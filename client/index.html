s found. Static documentation does not claim live, security, performance, release, or production qualification.\n\n## Generated reference\n\n`make reference` extracts backend routes, frontend routes, persisted models, and Alembic revisions into ignored `.generated/doc/Client/` files. It never writes under `doc/Client/EN` or `doc/Client/FR`.\n","search":"doc client en readme md client documentation this corpus documents the complete behavior currently declared by the client checkout at revision 6d8d9ab27f238a6553b376190f095384e913eca3 together with explicit gaps and planned only material client documentation this corpus documents the complete behavior currently declared by the client checkout at revision 6d8d9ab27f238a6553b376190f095384e913eca3 together with explicit gaps and planned only material reading order 1 scope and status client overview md 2 architecture client architecture md 3 backend api client backend api md 4 authentication and security client authentication security md 5 gameplay client gameplay md 6 social systems client social md 7 data and migrations client data md 8 frontend client frontend md 9 web application shell client interface shell md 10 web pages client interface pages md 11 social web interfaces client interface social md 12 ui components client interface components md 13 assets and fixtures client interface assets fixtures md 14 web gameplay client gameplay web md 15 settings client settings md 16 operations client operations md 17 testing and limitations client testing limitations md 18 support matrix client support matrix md evidence convention supported means an implementation path exists in the client sources partial means the path exists but its contract user interface or integration is incomplete planned means only an intention fixture visual shell or note exists absent means no implementation was found static documentation does not claim live security performance release or production qualification generated reference make reference extracts backend routes frontend routes persisted models and alembic revisions into ignored generated doc client files it never writes under doc client en or doc client fr"},{"id":"doc-client-en-client-architecture","surface":"client","language":"EN","relative":"client/architecture.md","path":"doc/Client/EN/client/architecture.md","title":"Architecture","summary":"The browser loads the Vite React application on port 5173. Calls under `/api` are proxied to FastAPI, normally on port 8000, with the prefix removed. FastAPI opens synchronous SQLAlchemy sessions against PostgreSQL 16. OAuth callbacks also ","headings":[{"depth":1,"text":"Architecture"},{"depth":2,"text":"Runtime topology"},{"depth":2,"text":"Backend layers"},{"depth":2,"text":"Frontend layers"},{"depth":2,"text":"Lifecycle"},{"depth":2,"text":"Concurrency and state"}],"markdown":"# Architecture\n\n## Runtime topology\n\nThe browser loads the Vite React application on port 5173. Calls under `/api` are proxied to FastAPI, normally on port 8000, with the prefix removed. FastAPI opens synchronous SQLAlchemy sessions against PostgreSQL 16. OAuth callbacks also call the external 42 API. WebSocket capture uses `/ws?token=...` directly and broadcasts machine updates to all connected sockets held in process memory.\n\n## Backend layers\n\n| Layer | Responsibility |\n| --- | --- |\n| `main.py` | Application creation, startup seed synchronization, router registration |\n| `security/` | OAuth, email/password, JWT, TOTP, active-user gates |\n| `access/` | HTTP and WebSocket transport contracts |\n| `core/` | Statistics, achievements, settings, guild and squad business rules |\n| `data/` | SQLAlchemy models, sessions, migrations |\n| `seeds/` | Achievement, setting, coalition, and machine seed material |\n\n## Frontend layers\n\n`src/routes/index.tsx` declares routing. `AuthProvider` restores or creates a development session. `services/` converts backend snake-case payloads into typed UI models. `pages/` orchestrates fetching and actions. `components/` contains reusable and feature-specific views. `settings/` applies appearance effects and caches them locally.\n\n## Lifecycle\n\nBackend startup synchronizes achievement definitions and settings definitions from JSON on every process start. The Docker backend command first runs `alembic upgrade head`, then starts reload-enabled Uvicorn. No `Base.metadata.create_all()` path is active; schema creation depends on migrations. Frontend startup applies cached appearance before rendering and then resolves authentication.\n\n## Concurrency and state\n\nHTTP mutations use database transactions; squad membership and machine capture use row locks in critical paths. The WebSocket manager is process-local, so broadcasts do not cross workers or replicas. There is no message broker, shared presence registry, retry queue, or durable event stream.\n","search":"doc client en client architecture md architecture the browser loads the vite react application on port 5173 calls under api are proxied to fastapi normally on port 8000 with the prefix removed fastapi opens synchronous sqlalchemy sessions against postgresql 16 oauth callbacks also architecture runtime topology the browser loads the vite react application on port 5173 calls under api are proxied to fastapi normally on port 8000 with the prefix removed fastapi opens synchronous sqlalchemy sessions against postgresql 16 oauth callbacks also call the external 42 api websocket capture uses ws token directly and broadcasts machine updates to all connected sockets held in process memory backend layers layer responsibility main py application creation startup seed synchronization router registration security oauth email password jwt totp active user gates access http and websocket transport contracts core statistics achievements settings guild and squad business rules data sqlalchemy models sessions migrations seeds achievement setting coalition and machine seed material frontend layers src routes index tsx declares routing authprovider restores or creates a development session services converts backend snake case payloads into typed ui models pages orchestrates fetching and actions components contains reusable and feature specific views settings applies appearance effects and caches them locally lifecycle backend startup synchronizes achievement definitions and settings definitions from json on every process start the docker backend command first runs alembic upgrade head then starts reload enabled uvicorn no base metadata create all path is active schema creation depends on migrations frontend startup applies cached appearance before rendering and then resolves authentication concurrency and state http mutations use database transactions squad membership and machine capture use row locks in critical paths the websocket manager is process local so broadcasts do not cross workers or replicas there is no message broker shared presence registry retry queue or durable event stream"},{"id":"doc-client-en-client-authentication-security","surface":"client","language":"EN","relative":"client/authentication-security.md","path":"doc/Client/EN/client/authentication-security.md","title":"Authentication and security","summary":"Direct 42 OAuth redirects to the configured callback, exchanges the code server-side, reads `/v2/me`, reads coalition membership, and creates or refreshes the local user. Email registration requires a syntactically valid address and a UTF-8","headings":[{"depth":1,"text":"Authentication and security"},{"depth":2,"text":"Identity flows"},{"depth":2,"text":"Token classes"},{"depth":2,"text":"Browser session"},{"depth":2,"text":"Development bypass"},{"depth":2,"text":"Security limitations"}],"markdown":"# Authentication and security\n\n## Identity flows\n\nDirect 42 OAuth redirects to the configured callback, exchanges the code server-side, reads `/v2/me`, reads coalition membership, and creates or refreshes the local user. Email registration requires a syntactically valid address and a UTF-8 password from 12 through 72 bytes, hashes it with bcrypt, then issues a five-minute link JWT. An email identity is unusable for gameplay until a unique 42 account is linked through OAuth state.\n\n## Token classes\n\n| Type | Lifetime | Use |\n| --- | --- | --- |\n| `access` | 48 hours | API authorization and WebSocket connection |\n| `pre_auth` | 5 minutes | TOTP verification only |\n| `link` | 5 minutes | Bind an email account to a 42 identity |\n\nAll tokens are HS256 JWTs signed with `JWT_SECRET`. The backend validates token type at each gate. TOTP secrets are generated per user; first challenge includes a base64 PNG QR. A valid code sets `totp_confirmed` and issues an access token. Subsequent logins still require TOTP but omit the QR.\n\n## Browser session\n\nThe access token is stored as `reloaded.access_token` in `localStorage`, attached as a Bearer header, and removed when restoration fails or the user logs out. This persists across tabs/restarts and is accessible to browser JavaScript; no HttpOnly cookie, refresh token, server-side revocation list, rotation, or explicit logout invalidation exists.\n\n## Development bypass\n\n`VITE_SKIP_LOGIN=true` makes the frontend call `/auth/dev-login` using `VITE_DEV_USER_ID`; the backend independently requires `DEV_MODE=true`. The frontend then marks the session as administrator locally, but the backend `/auth/authorized` always returns `is_admin: false`. This is a development convenience, not an authorization role.\n\n## Security limitations\n\nOAuth query parameters are concatenated without PKCE or a freshly generated CSRF state for normal login; state is reserved for link tokens. TOTP verification has no visible rate limit or replay window policy. JWT claims are logged by `verify_jwt`. No CORS policy, CSP, CSRF layer, request-size policy, brute-force throttling, password reset, email verification, recovery codes, secret rotation, or security headers are declared here. WebSocket tokens travel in the query string and may appear in infrastructure logs. These are observed implementation limits, not exploitability claims.\n","search":"doc client en client authentication security md authentication and security direct 42 oauth redirects to the configured callback exchanges the code server side reads v2 me reads coalition membership and creates or refreshes the local user email registration requires a syntactically valid address and a utf 8 authentication and security identity flows direct 42 oauth redirects to the configured callback exchanges the code server side reads v2 me reads coalition membership and creates or refreshes the local user email registration requires a syntactically valid address and a utf 8 password from 12 through 72 bytes hashes it with bcrypt then issues a five minute link jwt an email identity is unusable for gameplay until a unique 42 account is linked through oauth state token classes type lifetime use access 48 hours api authorization and websocket connection pre auth 5 minutes totp verification only link 5 minutes bind an email account to a 42 identity all tokens are hs256 jwts signed with jwt secret the backend validates token type at each gate totp secrets are generated per user first challenge includes a base64 png qr a valid code sets totp confirmed and issues an access token subsequent logins still require totp but omit the qr browser session the access token is stored as reloaded access token in localstorage attached as a bearer header and removed when restoration fails or the user logs out this persists across tabs restarts and is accessible to browser javascript no httponly cookie refresh token server side revocation list rotation or explicit logout invalidation exists development bypass vite skip login true makes the frontend call auth dev login using vite dev user id the backend independently requires dev mode true the frontend then marks the session as administrator locally but the backend auth authorized always returns is admin false this is a development convenience not an authorization role security limitations oauth query parameters are concatenated without pkce or a freshly generated csrf state for normal login state is reserved for link tokens totp verification has no visible rate limit or replay window policy jwt claims are logged by verify jwt no cors policy csp csrf layer request size policy brute force throttling password reset email verification recovery codes secret rotation or security headers are declared here websocket tokens travel in the query string and may appear in infrastructure logs these are observed implementation limits not exploitability claims"},{"id":"doc-client-en-client-backend-api","surface":"client","language":"EN","relative":"client/backend-api.md","path":"doc/Client/EN/client/backend-api.md","title":"Backend API","summary":"All routes except `/`, `/auth/login`, `/auth/callback`, `/auth/email/register`, `/auth/email/login`, `/auth/verify-totp`, and development login require a Bearer access token. Gameplay/data routes use the stricter active-user gate and reject","headings":[{"depth":1,"text":"Backend API"},{"depth":2,"text":"Common contract"},{"depth":2,"text":"Authentication routes"},{"depth":2,"text":"Read routes"},{"depth":2,"text":"Mutation routes"},{"depth":2,"text":"Ordering caveat"},{"depth":2,"text":"Exact inventory"}],"markdown":"# Backend API\n\n## Common contract\n\nAll routes except `/`, `/auth/login`, `/auth/callback`, `/auth/email/register`, `/auth/email/login`, `/auth/verify-totp`, and development login require a Bearer access token. Gameplay/data routes use the stricter active-user gate and reject accounts without a linked 42 identity. JSON bodies are assembled from individual FastAPI `Body` parameters. Error shapes are not uniform: FastAPI raises `{\"detail\": ...}`, while several route wrappers return `{\"error\": ...}`.\n\n## Authentication routes\n\n| Method | Path | Contract |\n| --- | --- | --- |\n| GET | `/auth/login` | Redirect to 42; optional `link_token` becomes OAuth `state` |\n| GET | `/auth/callback` | Exchange code, synchronize identity/coalition, return pre-auth challenge |\n| GET | `/auth/dev-login?user_id=` | Issue access token only when `DEV_MODE=true` |\n| GET | `/auth/authorized` | Return normalized current session fields |\n| POST | `/auth/verify-totp` | Verify `totp_code` under a pre-auth token and issue access token |\n| POST | `/auth/email/register` | Validate credentials, create unlinked account, return link token |\n| POST | `/auth/email/login` | Check password; require 42 linking or return TOTP challenge |\n\n## Read routes\n\nUsers expose a points leaderboard and a detailed profile. Coalitions expose a list, points-ranked ID list, and detail. Squads expose an average-points leaderboard, detail, and pending invitations. Guilds expose filtered/paginated listing, detail, and pending invitations. Machines expose all positions/ownership and per-machine detail. Achievements expose definitions and per-user unlocks. `/history` exposes every capture history record without coalition/user scoping. Settings expose the current version and categorized definitions/values.\n\n## Mutation routes\n\nSquad mutations create, join an open squad, invite, accept, decline, leave, remove a member, and update name/icon/openness. Guild mutations create, update, invite, accept, decline, leave, remove a member, promote/demote officers, and transfer leadership through rank `Leader`. Settings accept `{version, changes}` and use optimistic concurrency: stale versions return 409; unknown or invalid values return 422.\n\n## Ordering caveat\n\nThe dynamic guild `/{guild_id}` route is declared before `/guilds/invitations`. FastAPI/Starlette evaluates routes in declaration order, so the static invitation path may be consumed by the dynamic route and fail integer validation. The squad router already declares `/squads/invitations` before `/{squad_id}` and does not share this ordering defect. The guild endpoint is declared but its reachability is partial until ordering is corrected or an explicit integer converter/static-first order is used.\n\n## Exact inventory\n\nThe generated `client/reference/inventory.md` is authoritative for method/path/source presence and is coverage-checked against every FastAPI decorator.\n","search":"doc client en client backend api md backend api all routes except auth login auth callback auth email register auth email login auth verify totp and development login require a bearer access token gameplay data routes use the stricter active user gate and reject backend api common contract all routes except auth login auth callback auth email register auth email login auth verify totp and development login require a bearer access token gameplay data routes use the stricter active user gate and reject accounts without a linked 42 identity json bodies are assembled from individual fastapi body parameters error shapes are not uniform fastapi raises detail while several route wrappers return error authentication routes method path contract get auth login redirect to 42 optional link token becomes oauth state get auth callback exchange code synchronize identity coalition return pre auth challenge get auth dev login user id issue access token only when dev mode true get auth authorized return normalized current session fields post auth verify totp verify totp code under a pre auth token and issue access token post auth email register validate credentials create unlinked account return link token post auth email login check password require 42 linking or return totp challenge read routes users expose a points leaderboard and a detailed profile coalitions expose a list points ranked id list and detail squads expose an average points leaderboard detail and pending invitations guilds expose filtered paginated listing detail and pending invitations machines expose all positions ownership and per machine detail achievements expose definitions and per user unlocks history exposes every capture history record without coalition user scoping settings expose the current version and categorized definitions values mutation routes squad mutations create join an open squad invite accept decline leave remove a member and update name icon openness guild mutations create update invite accept decline leave remove a member promote demote officers and transfer leadership through rank leader settings accept version changes and use optimistic concurrency stale versions return 409 unknown or invalid values return 422 ordering caveat the dynamic guild guild id route is declared before guilds invitations fastapi starlette evaluates routes in declaration order so the static invitation path may be consumed by the dynamic route and fail integer validation the squad router already declares squads invitations before squad id and does not share this ordering defect the guild endpoint is declared but its reachability is partial until ordering is corrected or an explicit integer converter static first order is used exact inventory the generated client reference inventory md is authoritative for method path source presence and is coverage checked against every fastapi decorator"},{"id":"doc-client-en-client-data","surface":"client","language":"EN","relative":"client/data.md","path":"doc/Client/EN/client/data.md","title":"Data and migrations","summary":"The primary entities are users, coalitions, squads, guilds, machines, capture history, items, achievements, setting categories, setting definitions, and per-user setting values. Association tables model user achievements, user items, and di","headings":[{"depth":1,"text":"Data and migrations"},{"depth":2,"text":"Persisted model"},{"depth":2,"text":"Important constraints"},{"depth":2,"text":"Migration graph"},{"depth":2,"text":"Seed synchronization"},{"depth":2,"text":"Serialization gaps"}],"markdown":"# Data and migrations\n\n## Persisted model\n\nThe primary entities are users, coalitions, squads, guilds, machines, capture history, items, achievements, setting categories, setting definitions, and per-user setting values. Association tables model user achievements, user items, and directional friendships. Invitation tables store squad and guild invitations. Exact ORM class/table declarations are generated in the reference.\n\n## Important constraints\n\nUser email and 42 `intra_id` are unique and nullable. Settings keys are unique; one `(user_id, setting_id)` value is allowed. Invitation and association tables do not visibly declare uniqueness constraints, so duplicate prevention is mostly business-code based. Many domain columns are nullable in the model, including point balances, names, ownership, and counters; business functions often use `or 0` but not universally.\n\n## Migration graph\n\nAlembic begins at `490839257cfd`, adds identity, gameplay, guild, settings, and TOTP structures, and contains branch/merge history. The current merge revision joins the TOTP-confirmed and squad-open heads. File names frequently say “add_totp_secret” while containing unrelated changes; revision/down-revision identifiers, not filenames, define the graph. The generated inventory records every declared revision and parent.\n\n## Seed synchronization\n\nAchievement and setting definitions are upserted from JSON at application startup. Existing achievement names/descriptions and setting metadata are overwritten to match the files; user unlocks and values remain. Machine/coalition seeds are separate executable modules and are not part of normal startup. The backend `install` Make target runs only the machine seed after a fixed five-second wait.\n\n## Serialization gaps\n\nAPIs return hand-built dictionaries rather than declared response schemas. This makes fields and nullability dependent on implementation paths and prevents automatic output validation. History omits the user relation object; achievement output omits conditions and unlock time; user output omits wallet, email, guild, counters, timestamps, and settings version; machine output should be treated according to current serializer rather than the full table.\n","search":"doc client en client data md data and migrations the primary entities are users coalitions squads guilds machines capture history items achievements setting categories setting definitions and per user setting values association tables model user achievements user items and di data and migrations persisted model the primary entities are users coalitions squads guilds machines capture history items achievements setting categories setting definitions and per user setting values association tables model user achievements user items and directional friendships invitation tables store squad and guild invitations exact orm class table declarations are generated in the reference important constraints user email and 42 intra id are unique and nullable settings keys are unique one user id setting id value is allowed invitation and association tables do not visibly declare uniqueness constraints so duplicate prevention is mostly business code based many domain columns are nullable in the model including point balances names ownership and counters business functions often use or 0 but not universally migration graph alembic begins at 490839257cfd adds identity gameplay guild settings and totp structures and contains branch merge history the current merge revision joins the totp confirmed and squad open heads file names frequently say add totp secret while containing unrelated changes revision down revision identifiers not filenames define the graph the generated inventory records every declared revision and parent seed synchronization achievement and setting definitions are upserted from json at application startup existing achievement names descriptions and setting metadata are overwritten to match the files user unlocks and values remain machine coalition seeds are separate executable modules and are not part of normal startup the backend install make target runs only the machine seed after a fixed five second wait serialization gaps apis return hand built dictionaries rather than declared response schemas this makes fields and nullability dependent on implementation paths and prevents automatic output validation history omits the user relation object achievement output omits conditions and unlock time user output omits wallet email guild counters timestamps and settings version machine output should be treated according to current serializer rather than the full table"},{"id":"doc-client-en-client-frontend","surface":"client","language":"EN","relative":"client/frontend.md","path":"doc/Client/EN/client/frontend.md","title":"Frontend","summary":"`/dev/` is public and outside the main layout. `/login` and `/auth/callback` are public inside it. Home, profiles, settings, shop, games, guild search/detail, coalition leaderboard/detail, and squad search/detail are nested under `RequireAu","headings":[{"depth":1,"text":"Frontend"},{"depth":2,"text":"Routing and guards"},{"depth":2,"text":"Session lifecycle"},{"depth":2,"text":"Live-data pages"},{"depth":2,"text":"Partial and visual pages"},{"depth":2,"text":"UI framework"},{"depth":2,"text":"Accessibility and resilience"}],"markdown":"# Frontend\n\n## Routing and guards\n\n`/dev/` is public and outside the main layout. `/login` and `/auth/callback` are public inside it. Home, profiles, settings, shop, games, guild search/detail, coalition leaderboard/detail, and squad search/detail are nested under `RequireAuth`. The wildcard renders NotFound. `/admin` has a layout but every child resolves to NotFound. The generated reference lists all literal route paths; layout and pathless guard routes are structural entries, not navigable pages.\n\n## Session lifecycle\n\n`AuthProvider` starts in loading state, then restores a saved access token or creates the configured development session. Failure leaves the user null. `RequireAuth` waits for loading and redirects unauthenticated visitors. OAuth callback exchange is deduplicated per code/state for 60 seconds to tolerate repeated React execution. Successful TOTP stores the access token and reloads `/auth/authorized`.\n\n## Live-data pages\n\nGuild search and detail call guild services. Squad search/detail call the leaderboard, detail, profiles, invitations, and mutation routes. Coalition pages call coalition list/detail/rank. Profiles call user detail. Settings read and patch the versioned settings contract. Each service converts backend names and handles selected 404 responses as `null`; other failures propagate to page-level states.\n\n## Partial and visual pages\n\nThe shop and games have routes and visual assets/components but no corresponding backend services. Coalition trial leaderboards are always an empty array because no endpoint exists. Guild bonus/resource/event arrays are always empty because the adapter supplies them. Home includes map/game presentation, but this audit found no frontend WebSocket service in `front/src/services`; realtime machine capture wiring must therefore be treated as partial even though the backend endpoint exists. Development and dummy-data directories are demonstrations, not production data sources.\n\n## UI framework\n\nThe application uses React 19, React Router 7, TypeScript 6, Vite 8, Tailwind 4, Iconify, React Icons, date-fns, react-datepicker, and SVGR. Aliased imports resolve `@` to `src`. Vite accepts `re-loaded.fr` and proxies `/api`; no production build server or static asset deployment contract is included.\n\n## Accessibility and resilience\n\nNo automated frontend test script is declared in `package.json`; only build and lint exist. Visual components should not be interpreted as keyboard, screen-reader, responsive, localization, or accessibility qualification. API requests have no timeout, cancellation, retry, offline cache, or global refresh-token handling.\n","search":"doc client en client frontend md frontend dev is public and outside the main layout login and auth callback are public inside it home profiles settings shop games guild search detail coalition leaderboard detail and squad search detail are nested under requireau frontend routing and guards dev is public and outside the main layout login and auth callback are public inside it home profiles settings shop games guild search detail coalition leaderboard detail and squad search detail are nested under requireauth the wildcard renders notfound admin has a layout but every child resolves to notfound the generated reference lists all literal route paths layout and pathless guard routes are structural entries not navigable pages session lifecycle authprovider starts in loading state then restores a saved access token or creates the configured development session failure leaves the user null requireauth waits for loading and redirects unauthenticated visitors oauth callback exchange is deduplicated per code state for 60 seconds to tolerate repeated react execution successful totp stores the access token and reloads auth authorized live data pages guild search and detail call guild services squad search detail call the leaderboard detail profiles invitations and mutation routes coalition pages call coalition list detail rank profiles call user detail settings read and patch the versioned settings contract each service converts backend names and handles selected 404 responses as null other failures propagate to page level states partial and visual pages the shop and games have routes and visual assets components but no corresponding backend services coalition trial leaderboards are always an empty array because no endpoint exists guild bonus resource event arrays are always empty because the adapter supplies them home includes map game presentation but this audit found no frontend websocket service in front src services realtime machine capture wiring must therefore be treated as partial even though the backend endpoint exists development and dummy data directories are demonstrations not production data sources ui framework the application uses react 19 react router 7 typescript 6 vite 8 tailwind 4 iconify react icons date fns react datepicker and svgr aliased imports resolve to src vite accepts re loaded fr and proxies api no production build server or static asset deployment contract is included accessibility and resilience no automated frontend test script is declared in package json only build and lint exist visual components should not be interpreted as keyboard screen reader responsive localization or accessibility qualification api requests have no timeout cancellation retry offline cache or global refresh token handling"},{"id":"doc-client-en-client-gameplay-web","surface":"client","language":"EN","relative":"client/gameplay-web.md","path":"doc/Client/EN/client/gameplay-web.md","title":"Web gameplay","summary":"The web application does not currently expose the machine-capture gameplay implemented by the backend. There is no `WebSocket` construction in active TypeScript/TSX, no `/ws` client, no machine list/detail call, no map/grid/canvas, no machi","headings":[{"depth":1,"text":"Web gameplay"},{"depth":2,"text":"Actual playable boundary"},{"depth":2,"text":"Home presentation"},{"depth":2,"text":"Backend-to-web trace"},{"depth":2,"text":"Social metagame"},{"depth":2,"text":"Required integration for playable capture"},{"depth":2,"text":"Qualification statement"}],"markdown":"# Web gameplay\n\n## Actual playable boundary\n\nThe web application does not currently expose the machine-capture gameplay implemented by the backend. There is no `WebSocket` construction in active TypeScript/TSX, no `/ws` client, no machine list/detail call, no map/grid/canvas, no machine selection, no point wager control, no capture/defense action, no cooldown display, and no handler for `machine_updated`. The only WebSocket material under the frontend is `dummy/ws.json`.\n\n## Home presentation\n\nHome visually suggests gameplay through coalition scores, a 2D/3D mode button, and a hotbar. The three scores and trend arrows are literals. Switching 2D/3D changes only the menu state and icon. The page body contains no map. Hotbar icons for key, commit, feather, and ball have no handlers; Close only collapses the hotbar. Consequently these controls are interface intentions, not commands supported by gameplay.\n\n## Backend-to-web trace\n\n| Gameplay element | Backend | Web interface | Overall user status |\n| --- | --- | --- | --- |\n| Machine catalogue and coordinates | `GET /machine/all`, `GET /machine/{id}` | No service or page consumer | Not exposed |\n| Coalition point balance | User/profile and OAuth data | Home shows fixed numbers; profile is static | Not exposed correctly |\n| Capture/attack/defense | Authenticated `/ws` | No socket or action form | Not playable |\n| Three-minute cooldown | Enforced server-side after capture | No timer/state | Invisible |\n| Realtime machine update | Broadcast `machine_updated` | No listener | Invisible |\n| Capture history | `GET /history` | Profile/coalition logs are hard-coded | Not connected |\n| Achievements | List and per-user endpoints | Profile trophies are hard-coded | Not connected |\n| Rankings | User/coalition/squad endpoints | Coalition and squad pages partially/live | Partially exposed |\n| Points spend and counters | Updated during `/ws` action | No UI projection/refresh | Not exposed |\n\n## Social metagame\n\nSquads are the most complete playable web system: create, discover, join, invite, accept/decline, change recruitment, remove, and leave are connected. Coalition ranking is live but trial rankings are absent. Guild identity/member reading is live, while guild management and events are presentation-only. Shop, games, profile rewards, wallet, and logs do not execute metagame actions.\n\n## Required integration for playable capture\n\nA complete web path would need authenticated machine bootstrap, socket URL construction and token handling, reconnect/resynchronization, typed outbound/inbound messages, map rendering, selected-machine and wager state, affordability validation, pending/accepted/rejected feedback, cooldown display, broadcast reconciliation, session/points refresh, history and achievement refresh, and explicit error/close behavior. None of these missing pieces should be inferred from the backend endpoint or fixtures.\n\n## Qualification statement\n\nThe backend state machine is statically supported; the browser gameplay is absent. Therefore Client cannot be described as offering end-to-end machine gameplay at this revision. Social/settings/auth pages remain independently classifiable according to their own integration status.\n","search":"doc client en client gameplay web md web gameplay the web application does not currently expose the machine capture gameplay implemented by the backend there is no websocket construction in active typescript tsx no ws client no machine list detail call no map grid canvas no machi web gameplay actual playable boundary the web application does not currently expose the machine capture gameplay implemented by the backend there is no websocket construction in active typescript tsx no ws client no machine list detail call no map grid canvas no machine selection no point wager control no capture defense action no cooldown display and no handler for machine updated the only websocket material under the frontend is dummy ws json home presentation home visually suggests gameplay through coalition scores a 2d 3d mode button and a hotbar the three scores and trend arrows are literals switching 2d 3d changes only the menu state and icon the page body contains no map hotbar icons for key commit feather and ball have no handlers close only collapses the hotbar consequently these controls are interface intentions not commands supported by gameplay backend to web trace gameplay element backend web interface overall ding to their own integration status"},{"id":"doc-client-en-client-gameplay","surface":"client","language":"EN","relative":"client/gameplay.md","path":"doc/Client/EN/client/gameplay.md","title":"Gameplay","summary":"Machines have an ID, row, column, cluster, owning coalition, invested points, and last-capture timestamp. Read endpoints expose the whole map or one machine. The active interaction is an authenticated WebSocket; the client sends `{action, m","headings":[{"depth":1,"text":"Gameplay"},{"depth":2,"text":"Machine map"},{"depth":2,"text":"Capture state machine"},{"depth":2,"text":"Scoring and rankings"},{"depth":2,"text":"Achievements"},{"depth":2,"text":"History and realtime limits"}],"markdown":"# Gameplay\n\n## Machine map\n\nMachines have an ID, row, column, cluster, owning coalition, invested points, and last-capture timestamp. Read endpoints expose the whole map or one machine. The active interaction is an authenticated WebSocket; the client sends `{action, machine_id, points}`. `action` must be truthy but its value is otherwise not interpreted.\n\n## Capture state machine\n\nThe server rejects missing/false fields, non-positive points, unknown user/machine, users without a coalition, overspending, and machines captured less than three minutes earlier. It locks the machine row before applying the action.\n\n| Existing owner | Effect |\n| --- | --- |\n| None | Set ownership to the player's coalition and set points to the wager |\n| Same coalition | Add wager, increment player `machines_defended` |\n| Other coalition | Subtract wager; when points reach zero or below, transfer owner and record history |\n\nEvery accepted action deducts `coalition_points`, increments `spent_points`, checks achievements, commits, and broadcasts `machine_updated` with machine ID, coalition ID, and points. On capture, the machine is reset to zero points and receives the cooldown timestamp; overshoot is not preserved.\n\n## Scoring and rankings\n\nPlayer ranking sorts descending by current `coalition_points`. Coalition ranking sorts descending by `total_points` synchronized from 42, not by captured machines. Squad ranking sorts by average member coalition points. There is no declared score award loop in this checkout; Client spends points and imports the starting/current coalition values from 42.\n\n## Achievements\n\nFifteen seeded achievements cover captured machines (1/5/10/25), defended machines (1/5/10), spent points (100/1000/10000), consecutive login days (3/7/30), and friend counts (5/10). Checks occur after OAuth refresh and machine action. There are no friend mutation endpoints in this checkout, so friend-count achievements depend on externally populated data. Unlock timestamps exist in the join table but are omitted from API responses.\n\n## History and realtime limits\n\nHistory records machine, coalition, user, and capture time, but the API returns the global collection and is not paginated. Broadcast payloads do not include the acting user, cooldown timestamp, row/column, or a snapshot version. Connection state is single-process and disconnect cleanup occurs only after `WebSocketDisconnect`; arbitrary handler errors are not converted into a documented close/error contract.\n","search":"doc client en client gameplay md gameplay machines have an id row column cluster owning coalition invested points and last capture timestamp read endpoints expose the whole map or one machine the active interaction is an authenticated websocket the client sends action m gameplay machine map machines have an id row column cluster owning coalition invested points and last capture timestamp read endpoints expose the whole map or one machine the active interaction is an authenticated websocket the client sends action machine id points action must be truthy but its value is otherwise not interpreted capture state machine the server rejects missing false fields non positive points unknown user machine users without a coalition overspending and machines captured less than three minutes earlier it locks the machine row before applying the action existing owner effect none set ownership to the player s coalition and set points to the wager same coalition add wager increment player machines defended other coalition subtract wager when points reach zero or below transfer owner and record history every accepted action deducts coalition points increments spent points checks achievements commits and broadcasts machine updated with machine id coalition id and points on capture the machine is reset to zero points and receives the cooldown timestamp overshoot is not preserved scoring and rankings player ranking sorts descending by current coalition points coalition ranking sorts descending by total points synchronized from 42 not by captured machines squad ranking sorts by average member coalition points there is no declared score award loop in this checkout client spends points and imports the starting current coalition values from 42 achievements fifteen seeded achievements cover captured machines 1 5 10 25 defended machines 1 5 10 spent points 100 1000 10000 consecutive login days 3 7 30 and friend counts 5 10 checks occur after oauth refresh and machine action there are no friend mutation endpoints in this checkout so friend count achievements depend on externally populated data unlock timestamps exist in the join table but are omitted from api responses history and realtime limits history records machine coalition user and capture time but the api returns the global collection and is not paginated broadcast payloads do not include the acting user cooldown timestamp row column or a snapshot version connection state is single process and disconnect cleanup occurs only after websocketdisconnect arbitrary handler errors are not converted into a documented close error contract"},{"id":"doc-client-en-client-interface-assets-fixtures","surface":"client","language":"EN","relative":"client/interface-assets-fixtures.md","path":"doc/Client/EN/client/interface-assets-fixtures.md","title":"Assets and fixtures","summary":"The repository contains 29 asset files, including 17 under `assets/shop`. Presence does not imply that every asset is imported. Shop cards use literal `./src/assets/...` strings, which are development-path assumptions rather than verified V","headings":[{"depth":1,"text":"Assets and fixtures"},{"depth":2,"text":"Visual assets"},{"depth":2,"text":"JSON fixtures"},{"depth":2,"text":"Fixture interpretation"},{"depth":2,"text":"Icons and external resources"},{"depth":2,"text":"Asset limitations"}],"markdown":"# Assets and fixtures\n\n## Visual assets\n\n| Group | Files | Current use |\n| --- | --- | --- |\n| Brand/auth | `42logo.svg`, `logo.png`, `LogoIsland` assets | OAuth and application identity |\n| Coalitions | `analysts.svg`, `artisans.svg`, `technicians.svg` | Fixed Home score header |\n| Generic imagery | `dance.gif`, `default.jpeg`, `hero.png`, `Bus-Magique.png`, `T8_ROCK@3.png` | Image fallback, demonstrations, guild visuals |\n| Scaffold | `react.svg`, `vite.svg` | Template/development residue |\n| Shop attacks | `BOMBA`, `BOUMBOUM`, `FIOUU`, `FIREE`, `WATTEEERR` | Static shop cards |\n| Shop capture | `BATTERY`, `LIGHT`, `KARTTT`, `TABLE`, `VROUM` | Static shop cards |\n| Shop bosses | `Electric_Chuchu`, `Fire_Chuchu`, `Fire_Lick`, `Golem_Capitaine`, `Like`, `Miaou`, `Minitracien` | Static shop cards or unused stock |\n\nThe repository contains 29 asset files, including 17 under `assets/shop`. Presence does not imply that every asset is imported. Shop cards use literal `./src/assets/...` strings, which are development-path assumptions rather than verified Vite module imports.\n\n## JSON fixtures\n\nThe dummy directory contains examples for root, login, callback for existing/new users, authorization, TOTP, user detail/rank, coalition list/detail/rank/trials, squad list/detail/rank, guild detail/search, machine list/detail, settings, and WebSocket exchange. `exist.md` describes the fixture set. No production TypeScript/TSX import from the dummy directory was found; current services call `/api`.\n\n## Fixture interpretation\n\nFixtures document intended response shapes and help visual development, but they may be stale. In particular, coalition trial data, machine WebSocket exchange, and richer guild content appear in fixtures or types while the active frontend has no corresponding live integration. The source-derived backend contract and current service calls outrank fixture fields.\n\n## Icons and external resources\n\nMost controls use `react-icons` and Iconify instead of local raster assets. Inclusive Sans is fetched from Google Fonts at stylesheet load time. Missing network font availability falls back to system sans fonts. Coalition/user images are remote URLs returned by APIs and pass through the fallback Image component.\n\n## Asset limitations\n\nNo manifest declares licensing, attribution, dimensions, optimization, responsive variants, preloading, cache policy, dark/light variants, or accessibility text for this asset set. Raster names and hard-coded shop copy are prototype-oriented. The generated Client inventory lists every exact path so additions/removals cannot escape documentation coverage.\n","search":"doc client en client interface assets fixtures md assets and fixtures the repository contains 29 asset files including 17 under assets shop presence does not imply that every asset is imported shop cards use literal src assets strings which are development path assumptions rather than verified v assets and fixtures visual assets group files current use brand auth 42logo svg logo png logoisland assets oauth and application identity coalitions analysts svg artisans svg technicians svg fixed home score header generic imagery dance gif default jpeg hero png bus magique png t8 rock 3 png image fallback demonstrations guild visuals scaffold react svg vite svg template development residue shop attacks bomba boumboum fiouu face":"client","language":"EN","relative":"client/interface-components.md","path":"doc/Client/EN/client/interface-components.md","title":"UI components","summary":"`UserHeader` and `MenuBar` bridge pages to layout contexts. Header and menu content are installed in effects and removed at unmount. `MenuBar` owns collapsed/expanded state per installation. It exposes eight numeric page IDs; value 2 is unu","headings":[{"depth":1,"text":"UI components"},{"depth":2,"text":"Reusable primitives"},{"depth":2,"text":"Header and menu adapters"},{"depth":2,"text":"Floating windows"},{"depth":2,"text":"Window interaction limitations"},{"depth":2,"text":"Feature-local components"}],"markdown":"# UI components\n\n## Reusable primitives\n\n| Component | Behavior | Limits |\n| --- | --- | --- |\n| `Button` | Optional router navigation; default/menu styles | Does not forward normal button props or type |\n| `Image` | Native image with one-time fallback to `dance.gif` | Missing alt is allowed by props usage |\n| `Inputs` | Native input or date-time picker | Declares select/textarea/file but always renders input except date |\n| `LogoIsland` | Application logo presentation | Display only |\n| `Polygon` | CSS polygon wrapper/presentation | Display only |\n| `RelativeTime` | Formats date distance with date-fns | No live ticking established |\n| `RequireAuth` | Waits for auth and redirects to `/login` | No destination preservation |\n| `ScrollToHash` | Smooth-scrolls decoded hash target after navigation | Missing target is silently ignored |\n| `Separator` | Named horizontal section divider | Visual semantics only |\n| `Title`, `TitleBadge` | Centered page title and badge | Absolute positioning can compete with responsive content |\n| `Tooltip` | Truncated text plus hover reveal | Hover-only; no focus/ARIA tooltip contract |\n| `ui` | Shared Tailwind class strings for area/group/card | Styling convention, not a component |\n\n## Header and menu adapters\n\n`UserHeader` and `MenuBar` bridge pages to layout contexts. Header and menu content are installed in effects and removed at unmount. `MenuBar` owns collapsed/expanded state per installation. It exposes eight numeric page IDs; value 2 is unused. Hover expands labels and menu items navigate through the reusable Button.\n\n## Floating windows\n\n`WindowProvider` stores windows keyed by string ID. Opening an existing ID replaces its content/options, unminimizes it, and raises its z-index. Defaults center a two-thirds viewport window. Windows may be absolute or fixed, closable, draggable, outside-click closable, and minimized. `WindowManager` renders non-minimized windows and permits Escape only for the topmost closable window.\n\nDragging uses global mousemove/mouseup listeners and commits position on release. Focus raises normal windows; notifications use fixed z-index 1,000,000. Notifications are specialized fixed windows colored info/success/warning/error, default 320×96 at the upper right. They do not auto-dismiss, queue, persist, or announce through a live region by default.\n\n## Window interaction limitations\n\nThe window container has no dialog role, modal semantics, focus trap, initial focus, return focus, inert background, resize, viewport clamping, keyboard movement, or touch/pointer drag. Outside-click closure is evaluated on mouseup. Minimized state exists in data but no minimize action is exposed. Duplicate notification IDs overwrite instead of stacking.\n\n## Feature-local components\n\nPages define their own cards, headers, statistics, member editors, event forms, setting controls, and squad dialogs rather than exporting a shared feature library. These local components inherit page support status: a polished dialog may still be a placeholder when its validate handler does not call a service.\n","search":"doc client en client interface components md ui components userheader and menubar bridge pages to layout contexts header and menu content are installed in effects and removed at unmount menubar owns collapsed expanded state per installation it exposes eight numeric page ids value 2 is unu ui components reusable primitives component behavior limits button optional router navigation default menu styles does not forward normal button props or type image native image with one time fallback to dance gif missing alt is allowed by props usage inputs native input or date time picker declares select textarea file but always renders input except date logoisland application logo presentation display only polygon css polygon wrapper presentation display only relativetime formats date distance with date fns no live ticking established requireauth waits for auth and redirects to login no destination preservation scrolltohash smooth scrolls decoded hash target after navigation missing target is silently ignored separator named horizontal section divider visual semantics only title titlebadge centered page title and badge absolute positioning can compete with responsive content tooltip truncated text plus hover reveal hover only no focus aria tooltip contract ui shared tailwind class strings for area group card styling convention not a component header and menu adapters userheader and menubar bridge pages to layout contexts header and menu content are installed in effects and removed at unmount menubar owns collapsed expanded state per installation it exposes eight numeric page ids value 2 is unused hover expands labels and menu items navigate through the reusable button floating windows windowprovider stores windows keyed by string id opening an existing id replaces its content options unminimizes it and raises its z index defaults center a two thirds viewport window windows may be absolute or fixed closable draggable outside click closable and minimized windowmanager renders non minimized windows and permits escape only for the topmost closable window dragging uses global mousemove mouseup listeners and commits position on release focus raises normal windows tage | Live code exchange and TOTP; redirects home | Supported |\n| `/` | Coalition score header, 2D/3D menu, expandable five-icon hotbar | All scores fixed; gameplay icons have no action | Visual only |\n| `/profils` | Name header, six trophy cards, wallet cards, eight log rows | Entire content hard-coded; maximize buttons inactive | Visual only |\n| `/settings` | Category side menu, controls, sticky change bar | Live server settings and local effects | Supported |\n| `/shop` | Three horizontal shelves and eighteen item cards | Fixed names/prices; basket buttons have no handler | Visual only |\n| `/games` | A standalone expandable menu in a short container | No game content or action | Visual only |\n| `/coalitions/` | Ordered coalition cards with image and statistics | Live list plus ranked ID order | Partial |\n| `/coalitions/:id` | Coalition header, trial podium/list, colored logs | Live coalition summary; trials empty and logs hard-coded | Partial |\n| `*` | Not-found illustration and Back button | Calls browser `history.back()` | Supported |\n| `/admin/*` | Normal layout then not-found | No administration component | Planned |\n| `/dev/` | Window/notification/input/settings demonstrations | Local developer component laboratory | Development only |\n\n## Authentication details\n\nThe login page switches between sign-in and account creation. Creation checks matching passwords before calling the backend. Email responses either produce a 42-link flow or a TOTP stage. OAuth opens a full-page redirect. Both login and callback show the enrollment QR only when provided, restrict input to six digits, disable verification while incomplete/loading, and show errors with alert semantics. The older `pages/Logins/Login.tsx` OAuth-only page is not routed.\n\n## Home, profile, shop, and games\n\nHome's header always displays Analysts 1500 rising, Artisans 7000 falling, and Technicians 30000 unchanged. Its 2D/3D toggle only swaps icons/state; no canvas or map is rendered. The hotbar toggles five icons (key, commit, close, feather, ball), but only Close collapses it. Profile does not call the user or achievement services. Shop references static asset paths as strings rather than imported module URLs and displays the fixed `12 000$` price. Games only instantiates `MenuBar` and does not install the page header/menu contexts.\n\n## Coalition pages\n\nThe leaderboard concurrently fetches rank IDs and coalition objects, joins them client-side, and silently omits unknown IDs. It has no loading, empty, or rejected-promise presentation. Detail redirects invalid/missing coalitions to `/not-found`, which itself is not explicitly routed and therefore reaches the wildcard. The service always supplies `trials: []`; the podium and other ranking components consequently receive no live trial data. `CoalitionLogs` renders fixed warning/error/default examples unrelated to `/history`.\n\n## Legacy and unreachable page code\n\n`pages/Guild.tsx` is an older static guild composition and is not imported by the router; the active implementation is `pages/Guild/Guild.tsx`. The OAuth-only `pages/Logins/Login.tsx` is also unused. Their presence is source inventory, not a second supported route.\n","search":"doc client en client interface pages md web pages the login page switches between sign in and account creation creation checks matching passwords before calling the backend email responses either produce a 42 link flow or a totp stage oauth opens a full page redirect both login and cal web pages page by page status route visible interface data and actions status login email login create forms 42 button totp qr stage live auth services validates confirmation and six digits supported auth callback exchange loading error 42 button totp qr stage live code exchange and totp redirects home supported coalition score header 2d 3d menu expandable five icon hotbar all scores fixed gameplay icons have no action visual only profils name header six trophy cards wallet cards e side and silently omits unknown ids it has no loading empty or rejected promise presentation detail redirects invalid missing coalitions to not found which itself is not explicitly routed and therefore reaches the wildcard the service always supplies trials the podium and other ranking components consequently receive no live trial data coalitionlogs renders fixed warning error default examples unrelated to history legacy and unreachable page code pages guild tsx is an older static guild composition and is not imported by the router the active implementation is pages guild guild tsx the oauth only pages logins login tsx is also unused their presence is source inventory not a second supported route"},{"id":"doc-client-en-client-interface-shell","surface":"client","language":"EN","relative":"client/interface-shell.md","path":"doc/Client/EN/client/interface-shell.md","title":"Web application shell","summary":"`main.tsx` imports global CSS, applies cached appearance before React renders, and mounts `App` in `React.StrictMode`. `App` renders the router. The main layout owns header and menu contexts, then nests `AuthProvider`, `SettingsProvider`, `","headings":[{"depth":1,"text":"Web application shell"},{"depth":2,"text":"Bootstrap order"},{"depth":2,"text":"Persistent layout"},{"depth":2,"text":"Navigation menu"},{"depth":2,"text":"Providers and state ownership"},{"depth":2,"text":"Styling and responsive behavior"},{"depth":2,"text":"Shell limitations"}],"markdown":"# Web application shell\n\n## Bootstrap order\n\n`main.tsx` imports global CSS, applies cached appearance before React renders, and mounts `App` in `React.StrictMode`. `App` renders the router. The main layout owns header and menu contexts, then nests `AuthProvider`, `SettingsProvider`, `WindowProvider`, hash scrolling, the routed page, and the global window renderer. Authentication therefore resolves before settings are loaded, and settings before page windows are used.\n\n## Persistent layout\n\n`AppLayout` renders the logo island at the left, a page-supplied header in the center, and a page-supplied expandable menu at the right. Pages call `setPageHeader` and `setPageMenu`; each helper installs its content in an effect and clears it on unmount. The main content uses responsive margins. A footer renders breakpoint labels (`XS` through `2XL`) twice, including a fixed copy; this development diagnostic is visible in the normal application shell.\n\n## Navigation menu\n\nThe reusable menu starts collapsed. Expanding shows profile, settings, shop, games, guilds, coalitions, and squads; the current section is replaced by Home. Each icon is a router navigation button with a text label revealed on hover. The Home page does not reuse this menu: it defines a separate 2D/3D switch and a shorter profile/settings/shop/games menu.\n\n## Providers and state ownership\n\n| Provider/context | State owned |\n| --- | --- |\n| Header context | Current page header node |\n| Menu context | Current page menu node |\n| Auth context | User session, loading, restoration, logout, refresh |\n| Settings context | Server snapshot, draft, dirty keys, save/conflict/error state |\n| Window context | Floating windows, focus order, positions, notifications |\n\nProvider state is memory-only except access token and appearance cache. Navigation unmounts pages but the providers remain within the layout. Public login/callback pages are also inside the providers; `/dev/` is outside the layout and providers.\n\n## Styling and responsive behavior\n\nTailwind supplies layout utilities and custom tokens for dark page/UI surfaces, 42 blue, and three coalition colors. Inclusive Sans is loaded from Google Fonts. Root font size follows `--interface-scale`; light/system themes override page/UI colors; reduced motion collapses animation and transition durations. The stylesheet also contains a second legacy root token block, so both Tailwind theme variables and generic CSS variables coexist.\n\n## Shell limitations\n\n t state owned header context current page header node menu context current page menu node auth context user session loading restoration logout refresh settings context server snapshot draft dirty keys save conflict error state window context floating windows focus order positions notifications provider state is memory only except access token and appearance cache navigation unmounts pages but the providers remain within the layout public login callback pages are also inside the providers dev is outside the layout and providers styling and responsive behavior tailwind supplies layout utilities and custom tokens for dark page ui surfaces 42 blue and three coalition colors inclusive sans is loaded from google fonts root font size follows interface scale light system themes override page ui colors reduced motion collapses animation and transition durations the stylesheet also contains a second legacy root token block so both tailwind theme variables and generic css variables coexist shell limitations there is no route level error boundary suspense boundary global api error handler offline state localization provider or focus restoration policy header menu helpers intentionally use hooks despite imperative names and depend on stable render order the navigation is hover oriented the draggable window system is mouse oriented and the shell has no established mobile drawer or touch drag contract"},{"id":"doc-client-en-client-interface-social","surface":"client","language":"EN","relative":"client/interface-social.md","path":"doc/Client/EN/client/interface-social.md","title":"Social web interfaces","summary":"The squad page loads the leaderboard-derived squad list and pending invitations in parallel. Only open squads are displayed. Search is local and matches squad name, leader login, or member login. Cards display leader/members, capacity, and ","headings":[{"depth":1,"text":"Social web interfaces"},{"depth":2,"text":"Squad search"},{"depth":2,"text":"Squad detail"},{"depth":2,"text":"Guild search"},{"depth":2,"text":"Guild detail"},{"depth":2,"text":"Route and capability mismatches"}],"markdown":"# Social web interfaces\n\n## Squad search\n\nThe squad page loads the leaderboard-derived squad list and pending invitations in parallel. Only open squads are displayed. Search is local and matches squad name, leader login, or member login. Cards display leader/members, capacity, and open/full/current state. A user without a squad can join; a user in another squad is blocked; the current squad card navigates to detail. Creation opens a closable floating dialog for name and open/invite-only state, then navigates to the created squad.\n\nInvitation cards support accept and decline with per-invitation pending state. Acceptance refreshes the auth session, clears invitations, notifies success, and navigates to detail. Decline removes only that card. Initial-load and action failures are displayed separately. An empty filtered result has a dedicated message.\n\n## Squad detail\n\nInvalid or missing IDs redirect to the squad list; loading and fetch errors have explicit states. Detail shows recruitment status, member/free-slot counts, leader and member cards. Leaders can toggle open state, invite by login, and remove non-leaders through floating dialogs. Members can leave. Visitors may join an open squad through the main action or an empty slot. Mutations disable competing actions, notify success/error, refresh session when membership changes, and refetch the squad after relevant changes.\n\nThe displayed description mentions trials/events/leaderboard regardless of backend support. Squad icon is not rendered in detail; a generic shield is used. Name/icon update controls are not exposed even though the backend update route supports them.\n\n## Guild search\n\nGuild search loads the live guild list and pending invitations in parallel, then filters locally by guild or leader. Cards use the backend capacity with a 42-member fallback, calculate free slots, display equipped bonuses and the next event, and either join an open guild or submit a closed-guild request. Card links use `/guilds/{id}`, matching the declared detail route. Load failures and empty results have explicit states; invitation accept/decline and guild creation are connected.\n\n## Guild detail\n\nDetail fetches one live guild and displays overview, resources, bonuses, members, and events. Only the basic identity/member list is live. Resource, bonus, and event collections are adapter-supplied empty arrays. Editing bonus, member rank/removal, invitation, and event create/edit/delete opens complete-looking dialogs but only updates local form state, logs, closes windows, or shows “ready to submit”; none calls backend mutations. The permissions shown in UI use session guild rank, but visual authorization is not server action proof.\n\n## Route and capability mismatches\n\n| UI capability | Backend capability | Actual integration |\n| --- | --- | --- |\n| Squad create/join/invite/leave/remove/open | Present | Connected |\n| Squad rename/icon | Present | No UI control |\n| Guild list/detail | Present | Connected |\n| Guild create/join requests/invitations | Present | Connected |\n| Guild update/leave/ranks | Present | Connected from detail |\n| Guild bonuses/resources/events | Partial | Events connected; bonuses/resources remain adapter/UI data |\n","search":"doc client en client interface social md social web interfaces the squad page loads the leaderboard derived squad list and pending invitations in parallel only open squads are displayed search is local and matches squad name leader login or member login cards display leader members capacity and social web interfaces squad search the squad page loads the leaderboard derived squad list and pending invitations in parallel only open squads are displayed search is local and matches squad name leader login or member login cards display leader members capacity and open full current state a user without a squad  |\n| `VITE_API_PROXY_TARGET` | Vite proxy | Optional, default `http://localhost:8000` |\n| `VITE_SKIP_LOGIN` | Frontend development session | Optional, default false |\n| `VITE_DEV_USER_ID` | Frontend development session | Required when login is skipped |\n\nMissing database/OAuth/JWT variables fail early. Secrets belong in `back/.env`, which Compose loads; they must not be committed or exposed to the Vite client.\n\n## Make workflows\n\nTop-level `make install` installs frontend dependencies and starts backend containers. `make up` starts backend and frontend; `make up-skip-login` enables the frontend bypass; `make down`, `restart`, `re`, and logs variants delegate to each stack. Backend `install` builds/starts, sleeps five seconds, then runs the machine seed interactively. Frontend `up` is detached.\n\n## Destructive targets\n\nTop-level `fclean` runs `docker system prune -af`, affecting Docker resources beyond Client. `nuke` requires `CONFIRM=RL` and removes declared containers, volumes, images, Node dependencies, build products, caches, and selected generated files. These are explicitly destructive administrative operations and should not be used as routine cleanup in shared Docker environments.\n\n## Service behavior\n\nBackend Compose mounts source into `/app`, runs migrations, and starts `uvicorn --reload`; this is a development topology. PostgreSQL persists in `postgres_data`. Frontend Compose mounts source and an isolated Node modules volume. `host.docker.internal` connects frontend proxy to the host backend. No unified production Compose, ingress, TLS, health endpoint for FastAPI, backup, restore, monitoring, resource limit, or rolling-upgrade procedure is declared.\n","search":"doc client en client operations md operations missing database oauth jwt variables fail early secrets belong in back env which compose loads they must not be committed or exposed to the vite client operations required environment variable consumer requirement postgres user sqlalch grade procedure is declared"},{"id":"doc-client-en-client-overview","surface":"client","language":"EN","relative":"client/overview.md","path":"doc/Client/EN/client/overview.md","title":"Scope and status","summary":"Client is a web application composed of a FastAPI backend, a PostgreSQL database managed through SQLAlchemy and Alembic, and a React 19/Vite frontend. It owns browser session handling, player-facing navigation, social groups, rankings, sett","headings":[{"depth":1,"text":"Scope and status"},{"depth":2,"text":"Product boundary"},{"depth":2,"text":"Implemented surfaces"},{"depth":2,"text":"Sources of truth"},{"depth":2,"text":"Out-of-scope evidence"}],"markdown":"# Scope and status\n\n## Product boundary\n\nClient is a web application composed of a FastAPI backend, a PostgreSQL database managed through SQLAlchemy and Alembic, and a React 19/Vite frontend. It owns browser session handling, player-facing navigation, social groups, rankings, settings, and the machine-capture interaction. The separate `System` process is not present in this checkout and is not silently counted as Client support.\n\n## Implemented surfaces\n\n| Surface | Status | Evidence |\n| --- | --- | --- |\n| HTTP API | Supported | FastAPI routers in `back/security` and `back/access` |\n| Realtime capture | Supported | Authenticated `/ws` endpoint and connection manager |\n| Persistence | Supported | PostgreSQL models and Alembic graph |\n| Browser application | Partial | Routed React pages; several pages remain visual or data-incomplete |\n| 42 OAuth | Supported | Authorization, callback, profile and coalition synchronization |\n| Email identity | Partial | Registration/login exist but every account must link a 42 identity |\n| TOTP second factor | Supported | Enrollment QR, five-minute pre-auth token, code verification |\n| Administration | Planned | `/admin` only renders the not-found page |\n| Shop and games | Planned | Routes and visual components exist without backend purchase/game contracts |\n\n## Sources of truth\n\nThe source implementation outranks comments and design notes. `front/dev/backend-api-issues.md` is historical integration feedback: several reported gaps have since been fixed, so each claim is checked against current routes. Dummy data and components establish intended presentation only; they do not establish live backend support.\n\n## Out-of-scope evidence\n\nNo claim is made about production deployment, reverse proxying, TLS, browser compatibility, accessibility certification, load capacity, penetration testing, independent acceptance, or compatibility with the concurrent `Client-Test` worktree. These require separate evidence.\n","search":"doc client en client overview md scope and status client is a web application composed of a fastapi backend a postgresql database managed through sqlalchemy and alembic and a react 19 vite frontend it owns browser session handling player facing navigation social groups rankings sett scope and status product boundary client is a web application composed of a fastapi backend a postgresql database managed through sqlalchemy and alembic and a react 19 vite frontend it owns browser session handling player facing navigation social groups rankings settings and the machine capture interaction the separate system process is not present in this checkout and is not silently counted as client support implemented surfaces surface status evidence http api supported fastapi routers in back security and back access realtime capture supported authenticated ws endpoint and connection manager persistence supported postgresql models and alembic graph browser application partial routed react pages several pages remain visual or data incomplete 42 oauth supported authorization callback profile and coalition synchronization email identity partial registration login exist but every account must link a 42 identity totp second factor supported enrollment qr five minute pre auth token code verification administration otion` | theme enum; six-digit hex; 80–140; boolean |\n| Notifications | `notification_topics` | subset of guild, squad, shop, ranking |\n| Account | `display_name`, `match_history_size`, `logout` | length 3–24; number 5–100; local action |\n\nThe JSON also declares steps, labels, placeholders, `requiresRestart`, and danger metadata. Backend numeric validation enforces bounds but does not enforce configured step increments.\n\n## Optimistic concurrency\n\nEvery user begins with `settings_version` 1. The frontend fetches version and categories, then sends only changed keys with that version. The backend validates every key/value before writing any, upserts values, increments the version once, and returns it. A stale request receives the current version with HTTP 409 and must be refetched/reconciled by the caller.\n\n## Appearance cache\n\nTheme, accent color, interface scale, and reduced motion are cached in `localStorage` under `reloaded.appearance`. Cache parsing validates enums, hex format, scale range, and boolean type; invalid/unavailable storage falls back to defaults. Appearance is applied before the application renders. This cache is a fast local projection and can temporarily differ from server settings.\n\n## Effects and actions\n\nAppearance effects manipulate document theme/style state. Logout is dispatched client-side through the auth context and is not accepted as a setting mutation. Notification topics and match-history size are persisted preferences only in this checkout; no notification delivery or history truncation consumer was established by the audited source.\n","search":"doc client en client settings md settings settings are grouped and ordered by seeded categories the backend serializes type display metadata current default value and type specific configuration supported value types are boolean string number range select multi select an settings server driven catalogue settings are grouped and ordered by seeded categories the backend serialize
