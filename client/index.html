tions en attente. Seules les squads ouvertes sont affichées. La recherche est locale et correspond au nom de squad, login leader ou login membre. Les cartes affic","headings":[{"depth":1,"text":"Interfaces web sociales"},{"depth":2,"text":"Recherche de squads"},{"depth":2,"text":"Détail squad"},{"depth":2,"text":"Recherche de guildes"},{"depth":2,"text":"Détail guilde"},{"depth":2,"text":"Incohérences routes et capacités"}],"markdown":"# Interfaces web sociales\n\n## Recherche de squads\n\nLa page squad charge en parallèle la liste dérivée du classement et les invitations en attente. Seules les squads ouvertes sont affichées. La recherche est locale et correspond au nom de squad, login leader ou login membre. Les cartes affichent leader/membres, capacité et état ouvert/plein/courant. Un utilisateur sans squad peut rejoindre ; membre d'une autre squad est bloqué ; la carte de la squad courante navigue au détail. La création ouvre un dialogue flottant fermable pour nom et état ouvert/sur invitation, puis navigue vers la squad créée.\n\nLes cartes d'invitation acceptent et refusent avec état pending par invitation. Accepter rafraîchit la session auth, vide les invitations, notifie le succès et navigue au détail. Refuser retire seulement cette carte. Les erreurs de chargement initial et d'action sont présentées séparément. Un résultat filtré vide possède un message dédié.\n\n## Détail squad\n\nLes IDs invalides ou absents redirigent vers la liste squad ; chargement et erreur fetch ont des états explicites. Le détail affiche statut de recrutement, comptes membres/places, leader et cartes membres. Les leaders peuvent changer l'ouverture, inviter par login et retirer les non-leaders via dialogues flottants. Les membres peuvent quitter. Les visiteurs peuvent rejoindre une squad ouverte via l'action principale ou une place vide. Les mutations désactivent les actions concurrentes, notifient succès/erreur, rafraîchissent la session lors des changements d'appartenance et rechargent la squad quand nécessaire.\n\nLa description affichée mentionne épreuves/événements/classement indépendamment du support backend. L'icône squad n'est pas rendue dans le détail ; un bouclier générique est utilisé. Les contrôles nom/icône ne sont pas exposés malgré leur support par la route backend update.\n\n## Recherche de guildes\n\nLa recherche guilde charge en parallèle la liste live et les invitations en attente, puis filtre localement par guilde ou leader. Les cartes utilisent la capacité backend avec un fallback à 42 membres, calculent les places, affichent bonus équipés et prochain événement, puis rejoignent une guilde ouverte ou soumettent une demande pour une guilde fermée. Les liens carte utilisent `/guilds/{id}`, conformément à la route de détail. Les erreurs de chargement et résultats vides ont des états explicites ; accepter/refuser une invitation et créer une guilde sont connectés.\n\n## Détail guilde\n\nLe détail charge une guilde live et affiche vue d'ensemble, ressources, bonus, membres et événements. Seules identité et liste membres sont live. Ressources, bonus et événements sont des tableaux vides fournis par l'adaptateur. Modifier bonus, rang/retrait membre, invitation et création/modification/suppression événement ouvre des dialogues complets en apparence mais ne fait que modifier l'état local, logger, fermer ou afficher « ready to submit » ; aucun n'appelle les mutations backend. Les permissions UI utilisent le rang guilde de session, mais l'autorisation visuelle ne prouve pas une action serveur.\n\n## Incohérences routes et capacités\n\n| Capacité UI | Capacité backend | Intégration réelle |\n| --- | --- | --- |\n| Créer/rejoindre/inviter/quitter/retirer/ouvrir squad | Présente | Connectée |\n| Renommer/icône squad | Présente | Aucun contrôle UI |\n| Liste/détail guilde | Présente | Connectée |\n| Créer/demandes/invitations guilde | Présente | Connectée |\n| Modifier/quitter/rangs guilde | Présente | Connectée depuis le détail |\n| Bonus/ressources/événements guilde | Partielle | Événements connectés ; bonus/ressources restent des données adaptateur/UI |\n","search":"doc client fr client interface social md interfaces web sociales la page squad charge en parallele la liste derivee du classement et les invitations en attente seules les squads ouvertes sont affichees la recherche est locale et correspond au nom de squad login leader ou login membre les cartes affic interfaces web sociales recherche de squads la page squad charge en parallele la liste derivee du classement et les invitations en attente seules les squads ouvertes sont affichees la recherche est locale et correspond au nom de squad login leader ou login membre les cartes affichent leader membres capacite et etat ouvert plein courant un utilisateur sans squad peut rejoindre membre d une autre squad est bloque la carte de la squad courante navigue au detail la creation ouvre un dialogue flottant fermable pour nom et etat ouvert sur invitation puis navigue vers la squad creee les cartes d invitation acceptent et refusent avec etat pending par invitation accepter rafraichit la session auth vide les invitations notifie le succes et navigue au detail refuser retire seulement cette carte les erreurs de chargement initial et d action sont presentees separement un resultat filtre vide possede un message dedie detail squad les ids invalides ou absents redirigent vers la liste squad chargement et erreur fetch ont des etats explicites le detail affiche statut de recrutement comptes membres places leader et cartes membres les leaders peuvent changer l ouverture inviter par login et retirer les non leaders via dialogues flottants les membres peuvent quitter les visiteurs peuvent rejoindre une squad ouverte via l action principale ou une place vide les mutations desactivent les actions concurrentes notifient succes erreur rafraichissent la session lors des changements d appartenance et rechargent la squad quand necessaire la description affichee mentionne epreuves evenements classement independamment du support backend l icone squad n est pas rendue dans le detail un bouclier generique est utilise les controles nom icone ne sont pas exposes malgre leur support par la route backend update recherche de guildes la recherche guilde charge en parallele la liste live et les invitations en attente puis filtre localement par guilde ou leader les cartes utilisent la capacite backend avec un fallback a 42 membres calculent les places affichent bonus equipes et prochain evenement puis rejoignent une guilde ouverte ou soumettent une demande pour une guilde fermee les liens carte utilisent guilds id conformement a la route de detail les erreurs de chargement et resultats vides ont des etats explicites accepter refuser une invitation et creer une guilde sont connectes detail guilde le detail charge une guilde live et affiche vue d ensemble ressources bonus membres et evenements seules identite et liste membres sont live ressources bonus et evenements sont des tableaux vides fournis par l adaptateur modifier bonus rang retrait membre invitation et creation modification suppression evenement ouvre des dialogues complets en apparence mais ne fait que modifier l etat local logger fermer ou afficher ready to submit aucun n appelle les mutations backend les permissions ui utilisent le rang guilde de session mais l autorisation visuelle ne prouve pas une action serveur incoherences routes et capacites capacite ui capacite backend integration reelle creer rejoindre inviter quitter retirer ouvrir squad presente connectee renommer icone squad presente aucun controle ui liste detail guilde presente connectee creer demandes invitations guilde presente connectee modifier quitter rangs guilde presente connectee depuis le detail bonus ressources evenements guilde partielle evenements connectes bonus ressources restent des donnees adaptateur ui"},{"id":"doc-client-fr-client-operations","surface":"client","language":"FR","relative":"client/operations.md","path":"doc/Client/FR/client/operations.md","title":"Exploitation","summary":"L'absence de variables base/OAuth/JWT échoue tôt. Les secrets résident dans `back/.env`, chargé par Compose ; ils ne doivent être ni commités ni exposés au client Vite.","headings":[{"depth":1,"text":"Exploitation"},{"depth":2,"text":"Environnement requis"},{"depth":2,"text":"Workflows Make"},{"depth":2,"text":"Cibles destructives"},{"depth":2,"text":"Comportement des services"}],"markdown":"# Exploitation\n\n## Environnement requis\n\n| Variable | Consommateur | Exigence |\n| --- | --- | --- |\n| `POSTGRES_USER` | SQLAlchemy, Alembic, PostgreSQL | Requise |\n| `POSTGRES_PASSWORD` | SQLAlchemy, Alembic, PostgreSQL | Requise |\n| `POSTGRES_HOST` | SQLAlchemy, Alembic | Requise |\n| `POSTGRES_PORT` | SQLAlchemy, Alembic | Requise |\n| `POSTGRES_DB` | SQLAlchemy, Alembic, healthcheck | Requise |\n| `API_42_CLIENT_ID` | OAuth | Requise à l'import backend |\n| `API_42_CLIENT_SECRET` | OAuth | Requise à l'import backend |\n| `API_42_REDIRECT_URI` | OAuth | Requise à l'import backend |\n| `JWT_SECRET` | JWT | Requise à l'import backend |\n| `DEV_MODE` | Connexion de développement | Optionnelle, false par défaut |\n| `VITE_API_PROXY_TARGET` | Proxy Vite | Optionnelle, défaut `http://localhost:8000` |\n| `VITE_SKIP_LOGIN` | Session frontend de développement | Optionnelle, false par défaut |\n| `VITE_DEV_USER_ID` | Session frontend de développement | Requise quand la connexion est sautée |\n\nL'absence de variables base/OAuth/JWT échoue tôt. Les secrets résident dans `back/.env`, chargé par Compose ; ils ne doivent être ni commités ni exposés au client Vite.\n\n## Workflows Make\n\n`make install` racine installe les dépendances frontend et lance les conteneurs backend. `make up` démarre backend et frontend ; `make up-skip-login` active le contournement frontend ; `make down`, `restart`, `re` et variantes logs délèguent aux deux stacks. `install` backend build/démarre, attend cinq secondes puis exécute interactivement le seed machines. `up` frontend est détaché.\n\n## Cibles destructives\n\n`fclean` racine exécute `docker system prune -af`, ce qui affecte des ressources Docker hors Client. `nuke` exige `CONFIRM=RL` et supprime conteneurs, volumes, images, dépendances Node, produits de build, caches et certains fichiers générés déclarés. Ce sont des opérations administratives explicitement destructives, à ne pas utiliser comme nettoyage courant dans un Docker partagé.\n\n## Comportement des services\n\nCompose backend monte les sources dans `/app`, exécute les migrations et lance `uvicorn --reload` ; c'est une topologie de développement. PostgreSQL persiste dans `postgres_data`. Compose frontend monte les sources et un volume Node modules isolé. `host.docker.internal` relie le proxy frontend au backend hôte. Aucun Compose de production unifié, ingress, TLS, endpoint de santé FastAPI, sauvegarde, restauration, monitoring, limite de ressources ou procédure d'upgrade roulant n'est déclaré.\n","search":"doc client fr client operations md exploitation l absence de variables base oauth jwt echoue tot les secrets resident dans back env charge par compose ils ne doivent etre ni commites ni exposes au client vite exploitation environnement requis variable consommateur exigence postgres user sqlalchemy alembic postgresql requise postgres password sqlalchemy alembic postgresql requise postgres host sqlalchemy alembic requise postgres port sqlalchemy alembic requise postgres db sqlalchemy alembic healthcheck requise api 42 client id oauth requise a l import backend api 42 client secret oauth requise a l import backend api 42 redirect uri oauth requise a l import backend jwt secret jwt requise a l import backend dev mode connexion de developpement optionnelle false par defaut vite api proxy target proxy vite optionnelle defaut http localhost 8000 vite skip login session frontend de developpement optionnelle false par defaut vite dev user id session frontend de developpement requise quand la connexion est sautee l absence de variables base oauth jwt echoue tot les secrets resident dans back env charge par compose ils ne doivent etre ni commites ni exposes au client vite workflows make make install racine installe les dependances frontend et lance les conteneurs backend make up demarre backend et frontend make up skip login active le contournement frontend make down restart re et variantes logs deleguent aux deux stacks install backend build demarre attend cinq secondes puis execute interactivement le seed machines up frontend est detache cibles destructives fclean racine execute docker system prune af ce qui affecte des ressources docker hors client nuke exige confirm rl et supprime conteneurs volumes images dependances node produits de build caches et certains fichiers generes declares ce sont des operations administratives explicitement destructives a ne pas utiliser comme nettoyage courant dans un docker partage comportement des services compose backend monte les sources dans app execute les migrations et lance uvicorn reload c est une topologie de developpement postgresql persiste dans postgres data compose frontend monte les sources et un volume node modules isole host docker internal relie le proxy frontend au backend hote aucun compose de production unifie ingress tls endpoint de sante fastapi sauvegarde restauration monitoring limite de ressources ou procedure d upgrade roulant n est declare"},{"id":"doc-client-fr-client-overview","surface":"client","language":"FR","relative":"client/overview.md","path":"doc/Client/FR/client/overview.md","title":"Périmètre et statut","summary":"Client est une application web composée d'un backend FastAPI, d'une base PostgreSQL gérée avec SQLAlchemy et Alembic, et d'un frontend React 19/Vite. Il possède la gestion de session navigateur, la navigation joueur, les groupes sociaux, le","headings":[{"depth":1,"text":"Périmètre et statut"},{"depth":2,"text":"Frontière produit"},{"depth":2,"text":"Surfaces implémentées"},{"depth":2,"text":"Sources d'autorité"},{"depth":2,"text":"Preuves hors périmètre"}],"markdown":"# Périmètre et statut\n\n## Frontière produit\n\nClient est une application web composée d'un backend FastAPI, d'une base PostgreSQL gérée avec SQLAlchemy et Alembic, et d'un frontend React 19/Vite. Il possède la gestion de session navigateur, la navigation joueur, les groupes sociaux, les classements, les réglages et l'interaction de conquête des machines. Le processus `System` séparé n'est pas présent dans ce checkout et n'est pas compté implicitement comme support Client.\n\n## Surfaces implémentées\n\n| Surface | Statut | Preuve |\n| --- | --- | --- |\n| API HTTP | Supporté | Routeurs FastAPI dans `back/security` et `back/access` |\n| Conquête temps réel | Supporté | Endpoint `/ws` authentifié et gestionnaire de connexions |\n| Persistance | Supporté | Modèles PostgreSQL et graphe Alembic |\n| Application navigateur | Partiel | Pages React routées ; plusieurs restent visuelles ou incomplètes en données |\n| OAuth 42 | Supporté | Autorisation, callback, synchronisation du profil et de la coalition |\n| Identité email | Partiel | Inscription/connexion présentes mais chaque compte doit lier une identité 42 |\n| Second facteur TOTP | Supporté | QR d'enrôlement, jeton de pré-authentification de cinq minutes, vérification du code |\n| Administration | Prévu | `/admin` affiche seulement la page introuvable |\n| Boutique et jeux | Prévu | Routes et composants visuels sans contrats backend d'achat ou de jeu |\n\n## Sources d'autorité\n\nL'implémentation source prime sur les commentaires et notes de conception. `front/dev/backend-api-issues.md` est un retour d'intégration historique : plusieurs lacunes signalées ont depuis été corrigées, donc chaque affirmation est comparée aux routes actuelles. Les données factices et composants établissent seulement une présentation prévue ; ils ne prouvent aucun support backend live.\n\n## Preuves hors périmètre\n\nAucune revendication n'est faite sur le déploiement de production, le reverse proxy, TLS, la compatibilité navigateur, la certification d'accessibilité, la charge, les tests d'intrusion, l'acceptation indépendante ou la compatibilité avec le travail concurrent `Client-Test`. Ces points exigent des preuves séparées.\n","search":"doc client fr client overview md perimetre et statut client est une application web composee d un backend fastapi d une base postgresql geree avec sqlalchemy et alembic et d un frontend react 19 vite il possede la gestion de session navigateur la navigation joueur les groupes sociaux le perimetre et statut frontiere produit client est une application web composee d un backend fastapi d une base postgresql geree avec sqlalchemy et alembic et d un frontend react 19 vite il possede la gestion de session navigateur la navigation joueur les groupes sociaux les classements les reglages et l interaction de conquete des machines le processus system separe n est pas present dans ce checkout et n est pas compte implicitement comme support client surfaces implementees surface statut preuve api http supporte routeurs fastapi dans back security et back access conquete temps reel supporte endpoint ws authentifie et gestionnaire de connexions persistance supporte modeles postgresql et graphe alembic application navigateur partiel pages react routees plusieurs restent visuelles ou incompletes en donnees oauth 42 supporte autorisation callback synchronisation du profil et de la coalition identite email partiel inscription connexion presentes mais chaque compte doit lier une identite 42 second facteur totp supporte qr d enrolement jeton de pre authentification de cinq minutes verification du code administration prevu admin affiche seulement la page introuvable boutique et jeux prevu routes et composants visuels sans contrats backend d achat ou de jeu sources d autorite l implementation source prime sur les commentaires et notes de conception front dev backend api issues md est un retour d integration historique plusieurs lacunes signalees ont depuis ete corrigees donc chaque affirmation est comparee aux routes actuelles les donnees factices et composants etablissent seulement une presentation prevue ils ne prouvent aucun support backend live preuves hors perimetre aucune revendication n est faite sur le deploiement de production le reverse proxy tls la compatibilite navigateur la certification d accessibilite la charge les tests d intrusion l acceptation independante ou la compatibilite avec le travail concurrent client test ces points exigent des preuves separees"},{"id":"doc-client-fr-client-settings","surface":"client","language":"FR","relative":"client/settings.md","path":"doc/Client/FR/client/settings.md","title":"Réglages","summary":"Les réglages sont groupés et ordonnés par catégories seedées. Le backend sérialise type, métadonnées d'affichage, valeur courante/par défaut et configuration spécifique. Les types supportés sont boolean, string, number, range, select, multi","headings":[{"depth":1,"text":"Réglages"},{"depth":2,"text":"Catalogue piloté par le serveur"},{"depth":2,"text":"Définitions courantes"},{"depth":2,"text":"Concurrence optimiste"},{"depth":2,"text":"Cache d'apparence"},{"depth":2,"text":"Effets et actions"}],"markdown":"# Réglages\n\n## Catalogue piloté par le serveur\n\nLes réglages sont groupés et ordonnés par catégories seedées. Le backend sérialise type, métadonnées d'affichage, valeur courante/par défaut et configuration spécifique. Les types supportés sont boolean, string, number, range, select, multi-select et color. Les entrées action sont renvoyées pour gestion UI mais ne peuvent jamais être persistées par l'endpoint patch générique.\n\n## Définitions courantes\n\n| Catégorie | Clés | Règles |\n| --- | --- | --- |\n| Apparence | `theme`, `accent_color`, `interface_scale`, `reduce_motion` | enum thème ; hex six chiffres ; 80–140 ; booléen |\n| Notifications | `notification_topics` | sous-ensemble de guild, squad, shop, ranking |\n| Compte | `display_name`, `match_history_size`, `logout` | longueur 3–24 ; nombre 5–100 ; action locale |\n\nLe JSON déclare aussi pas, labels, placeholders, `requiresRestart` et métadonnées danger. La validation numérique backend impose les bornes mais pas les incréments de pas configurés.\n\n## Concurrence optimiste\n\nChaque utilisateur commence avec `settings_version` 1. Le frontend récupère version et catégories, puis envoie seulement les clés modifiées avec cette version. Le backend valide chaque clé/valeur avant toute écriture, upsert les valeurs, incrémente la version une fois et la renvoie. Une requête obsolète reçoit la version courante avec HTTP 409 et doit être rechargée/réconciliée par l'appelant.\n\n## Cache d'apparence\n\nThème, couleur d'accent, échelle d'interface et réduction des mouvements sont mis en cache dans `localStorage` sous `reloaded.appearance`. Le parsing valide enums, format hex, plage d'échelle et type booléen ; stockage invalide/indisponible revient aux valeurs par défaut. L'apparence est appliquée avant le rendu. Ce cache est une projection locale rapide et peut temporairement diverger des réglages serveur.\n\n## Effets et actions\n\nLes effets d'apparence manipulent l'état thème/style du document. Logout est dispatché côté client via le contexte d'authentification et n'est pas accepté comme mutation de réglage. Les sujets de notification et la taille d'historique sont seulement des préférences persistées dans ce checkout ; aucun consommateur de livraison de notifications ou troncature d'historique n'a été établi par les sources auditées.\n","search":"doc client fr client settings md reglages les reglages sont groupes et ordonnes par categories seedees le backend serialise type metadonnees d affichage valeur courante par defaut et configuration specifique les types supportes sont boolean string number range select multi reglages catalogue pilote par le serveur les reglages sont groupes et ordonnes par categories seedees le backend serialise type metadonnees d affichage valeur courante par defaut et configuration specifique les types supportes sont boolean string number range select multi select et color les entrees action sont renvoyees pour gestion ui mais ne peuvent jamais etre persistees par l endpoint patch generique definitions courantes categorie cles regles apparence theme accent color interface scale reduce motion enum theme hex six chiffres 80 140 booleen notifications notification topics sous ensemble de guild squad shop ranking compte display name match history size logout longueur 3 24 nombre 5 100 action locale le json declare aussi pas labels placeholders requiresrestart et metadonnees danger la validation numerique backend impose les bornes mais pas les increments de pas configures concurrence optimiste chaque utilisateur commence avec settings version 1 le frontend recupere version et categories puis envoie seulement les cles modifiees avec cette version le backend valide chaque cle valeur avant toute ecriture upsert les valeurs incremente la version une fois et la renvoie une requete obsolete recoit la version courante avec http 409 et doit etre rechargee reconciliee par l appelant cache d apparence theme couleur d accent echelle d interface et reduction des mouvements sont mis en cache dans localstorage sous reloaded appearance le parsing valide enums format hex plage d echelle et type booleen stockage invalide indisponible revient aux valeurs par defaut l apparence est appliquee avant le rendu ce cache est une projection locale rapide et peut temporairement diverger des reglages serveur effets et actions les effets d apparence manipulent l etat theme style du document logout est dispatche cote client via le contexte d authentification et n est pas accepte comme mutation de reglage les sujets de notification et la taille d historique sont seulement des preferences persistees dans ce checkout aucun consommateur de livraison de notifications ou troncature d historique n a ete etabli par les sources auditees"},{"id":"doc-client-fr-client-social","surface":"client","language":"FR","relative":"client/social.md","path":"doc/Client/FR/client/social.md","title":"Systèmes sociaux","summary":"Les squads sont des groupes compacts limités à cinq membres. Les noms sont trimés, doivent contenir de 3 à 50 caractères et ne sont pas déclarés uniques. Un créateur ne doit pas appartenir à une squad et devient leader. Les squads ouvertes ","headings":[{"depth":1,"text":"Systèmes sociaux"},{"depth":2,"text":"Squads"},{"depth":2,"text":"Guildes"},{"depth":2,"text":"Coalitions"},{"depth":2,"text":"Amis, objets, événements et bonus"}],"markdown":"# Systèmes sociaux\n\n## Squads\n\nLes squads sont des groupes compacts limités à cinq membres. Les noms sont trimés, doivent contenir de 3 à 50 caractères et ne sont pas déclarés uniques. Un créateur ne doit pas appartenir à une squad et devient leader. Les squads ouvertes sont joignables directement ; les fermées exigent une invitation en attente. Rejoindre verrouille squad et utilisateur, refuse capacité pleine ou appartenance modifiée, ferme les autres invitations et commit atomiquement.\n\nSeul le leader peut inviter, retirer des membres ou modifier nom/icône/ouverture. Un leader ne peut pas se retirer lui-même. Quitter supprime une squad vide et ses invitations ; si le leader quitte une squad non vide, l'utilisateur restant au plus petit identifiant devient leader. Le détail inclut capacité, nombre de membres, moyenne de points, trois meilleurs joueurs et identifiants membres. Le frontend effectue des appels profil supplémentaires pour afficher les membres.\n\n## Guildes\n\nLes guildes possèdent nom, icône, leader et membres classés `Member`, `Officer` ou `Leader`. La liste accepte recherche insensible à la casse et `limit`/`offset`, par défaut 20/0. Leaders et officiers peuvent modifier et inviter. Seuls les leaders gèrent les officiers, transfèrent la direction ou retirent un officier ; les officiers peuvent retirer les membres ordinaires. Un leader ne peut pas être expulsé.\n\nQuitter efface appartenance/rang. Si le leader quitte, la direction passe au premier membre restant renvoyé par la base ; si aucun ne reste, la guilde est supprimée. Contrairement aux squads, aucun ordre explicite, capacité, validation de nom, unicité ou verrouillage de ligne n'est déclaré. Les invitations de guilde sont des enregistrements pending/accepted/declined.\n\n## Coalitions\n\nL'appartenance coalition est dérivée du second élément de la réponse coalitions 42 lorsqu'elle contient plus d'une entrée. Client stocke identifiant, nom, score total, logo et couleur. Il expose liste, détail et classement ; aucune route Client ne crée, modifie, rejoint ou quitte une coalition.\n\n## Amis, objets, événements et bonus\n\nLes relations utilisateur incluent amis et objets possédés, et les réponses profil exposent leurs identifiants. Aucune route n'ajoute/retire des amis, ne liste/achète des objets ou ne gère l'inventaire. Les modèles frontend guilde contiennent bonus, ressources et événements, mais le backend n'en renvoie aucun et l'adaptateur fournit des tableaux vides. Ces capacités sont prévues/formées par l'UI, pas des workflows supportés.\n","search":"doc client fr client social md systemes sociaux les squads sont des groupes compacts limites a cinq membres les noms sont trimes doivent contenir de 3 a 50 caracteres et ne sont pas declares uniques un createur ne doit pas appartenir a une squad et devient leader les squads ouvertes systemes sociaux squads les squads sont des groupes compacts limites a cinq membres les noms sont trimes doivent contenir de 3 a 50 caracteres et ne sont pas declares uniques un createur ne doit pas appartenir a une squad et devient leader les squads ouvertes sont joignables directement les fermees exigent une invitation en attente rejoindre verrouille squad et utilisateur refuse capacite pleine ou appartenance modifiee ferme les autres invitations et commit atomiquement seul le leader peut inviter retirer des membres ou modifier nom icone ouverture un leader ne peut pas se retirer lui meme quitter supprime une squad vide et ses invitations si le leader quitte une squad non vide l utilisateur restant au plus petit identifiant devient leader le detail inclut capacite nombre de membres moyenne de points trois meilleurs joueurs et identifiants membres le frontend effectue des appels profil supplementaires pour afficher les membres guildes les guildes possedent nom icone leader et membres classes member officer ou leader la liste accepte recherche insensible a la casse et limit offset par defaut 20 0 leaders et officiers peuvent modifier et inviter seuls les leaders gerent les officiers transferent la direction ou retirent un officier les officiers peuvent retirer les membres ordinaires un leader ne peut pas etre expulse quitter efface appartenance rang si le leader quitte la direction passe au premier membre restant renvoye par la base si aucun ne reste la guilde est supprimee contrairement aux squads aucun ordre explicite capacite validation de nom unicite ou verrouillage de ligne n est declare les invitations de guilde sont des enregistrements pending accepted declined coalitions l appartenance coalition est derivee du second element de la reponse coalitions 42 lorsqu elle contient plus d une entree client stocke identifiant nom score total logo et couleur il expose liste detail et classement aucune route client ne cree modifie rejoint ou quitte une coalition amis objets evenements et bonus les relations utilisateur incluent amis et objets possedes et les reponses profil exposent leurs identifiants aucune route n ajoute retire des amis ne liste achete des objets ou ne gere l inventaire les modeles frontend guilde contiennent bonus ressources et evenements mais le backend n en renvoie aucun et l adaptateur fournit des tableaux vides ces capacites sont prevues formees par l ui pas des workflows supportes"},{"id":"doc-client-fr-client-support-matrix","surface":"client","language":"FR","relative":"client/support-matrix.md","path":"doc/Client/FR/client/support-matrix.md","title":"Matrice de support","summary":"Supporté signifie que les chemins source forment un contrat backend ou frontend de bout en bout dans Client. Partiel signifie qu'une branche ou garantie importante manque. Prévu signifie qu'une présentation ou intention existe sans contrat ","headings":[{"depth":1,"text":"Matrice de support"},{"depth":2,"text":"Définitions des statuts"},{"depth":2,"text":"Identité et plateforme"},{"depth":2,"text":"Gameplay et données"},{"depth":2,"text":"Social et préférences"},{"depth":2,"text":"Interface web"},{"depth":2,"text":"Niveau de preuve"}],"markdown":"# Matrice de support\n\n## Définitions des statuts\n\nSupporté signifie que les chemins source forment un contrat backend ou frontend de bout en bout dans Client. Partiel signifie qu'une branche ou garantie importante manque. Prévu signifie qu'une présentation ou intention existe sans contrat opérationnel. Absent signifie qu'aucune déclaration n'a été trouvée.\n\n## Identité et plateforme\n\n| Capacité | Statut | Frontière |\n| --- | --- | --- |\n| Connexion OAuth 42 | Supporté | Disponibilité externe et identifiants non qualifiés |\n| Inscription/connexion email | Partiel | Liaison 42 obligatoire ; aucune vérification/réinitialisation |\n| Enrôlement/connexion TOTP | Supporté | Aucun contrat de rate-limit/récupération |\n| Session navigateur persistante | Supporté | Jeton d'accès local storage uniquement |\n| Contournement connexion développement | Supporté | Exige les flags frontend/backend correspondants |\n| Application admin | Prévu | Coque de route uniquement |\n| Migrations PostgreSQL | Supporté | Graphe statique ; exécution upgrade non qualifiée |\n| Stacks Docker développement | Supporté | Aucune topologie production |\n\n## Gameplay et données\n\n| Capacité | Statut | Frontière |\n| --- | --- | --- |\n| Liste/détail machines | Supporté | Utilisateurs actifs authentifiés |\n| Conquête/défense WebSocket | Partiel | Backend implémenté ; branchement frontend absent |\n| Cooldown de conquête trois minutes | Supporté | Appliqué après transfert de propriété uniquement |\n| Historique global de conquête | Supporté | Non paginé et non filtré |\n| Classement/profil joueur | Supporté | Champs gameplay publics sélectionnés |\n| Liste/détail/classement coalition | Supporté | Appartenance importée depuis 42 |\n| Classements épreuves coalition | Prévu | Placeholder frontend vide |\n| Succès | Supporté | Vérification à OAuth et action machine |\n| Gestion des amis | Absent | Relation/identifiants en lecture seulement |\n| Boutique et achat d'objets | Prévu | UI/modèle sans routes service |\n| Exécution de jeux | Prévu | Route/assets UI sans contrat backend |\n\n## Social et préférences\n\n| Capacité | Statut | Frontière |\n| --- | --- | --- |\n| Création/liste/détail squad | Supporté | Maximum cinq, classement par moyenne |\n| Rejoindre/inviter/quitter/gérer squad | Supporté | Règles authentifiées et contrôles de capacité |\n| Liste/détail/création/modification guilde | Supporté | Pagination recherche sur la liste |\n| Invitation/départ/rangs guilde | Partiel | Règles métier implémentées ; réserve routage invitations |\n| Bonus/ressources/événements guilde | Prévu | Placeholders frontend vides |\n| Réglages pilotés serveur | Supporté | Valeurs validées et versionnées |\n| Application/cache d'apparence | Supporté | Projection locale pouvant diverger temporairement |\n| Livraison de notifications | Absent | Préférence sans sous-système de livraison |\n| Application taille d'historique | Absent | Préférence sans consommateur établi |\n\n## Interface web\n\n| Capacité | Statut | Frontière |\n| --- | --- | --- |\n| UI login, callback, TOTP | Supporté | Services live et états de formulaire explicites |\n| UI réglages | Supporté | Persistance versionnée live et récupération de conflit |\n| UI squad | Supporté | Principaux workflows d'appartenance connectés |\n| UI coalition | Partiel | Classement/résumé live ; épreuves/logs placeholders |\n| UI guilde | Partiel | Lecture partiellement connectée ; actions et lien carte incomplets |\n| Carte machines accueil | Absent | Aucune carte, service machine ou client WebSocket |\n| UI profil | Prévu | Trophées, wallet et logs codés en dur |\n| UI boutique | Prévu | Cartes statiques et contrôles achat inactifs |\n| UI jeux | Prévu | Menu seulement |\n| UI admin | Prévu | NotFound seulement |\n\n## Niveau de preuve\n\nChaque statut ci-dessus est un audit source à la révision documentée. Aucun ne constitue une acceptation indépendante, live, release, sécurité ou performance.\n","search":"doc client fr client support matrix md matrice de support supporte signifie que les chemins source forment un contrat backend ou frontend de bout en bout dans client partiel signifie qu une branche ou garantie importante manque prevu signifie qu une presentation ou intention existe sans contrat matrice de support definitions des statuts supporte signifie que les chemins source forment un contrat backend ou frontend de bout en bout dans client partiel signifie qu une branche ou garantie importante manque prevu signifie qu une presentation ou intention existe sans contrat operationnel absent signifie qu aucune declaration n a ete trouvee identite et plateforme capacite statut frontiere connexion oauth 42 supporte disponibilite externe et identifiants non qualifies inscription connexion email partiel liaison 42 obligatoire aucune verification reinitialisation enrolement connexion totp supporte aucun contrat de rate limit recuperation session navigateur persistante supporte jeton d acces local storage uniquement contournement connexion developpement supporte exige les flags frontend backend correspondants application admin prevu coque de route uniquement migrations postgresql supporte graphe statique execution upgrade non qualifiee stacks docker developpement supporte aucune topologie production gameplay et donnees capacite statut frontiere liste detail machines supporte utilisateurs actifs authentifies conquete defense websocket partiel backend implemente branchement frontend absent cooldown de conquete trois minutes supporte applique apres transfert de propriete uniquement historique global de conquete supporte non pagine et non filtre classement profil joueur supporte champs gameplay publics selectionnes liste detail classement coalition supporte appartenance importee depuis 42 classements epreuves coalition prevu placeholder frontend vide succes supporte verification a oauth et action machine gestion des amis absent relation identifiants en lecture seulement boutique et achat d objets prevu ui modele sans routes service execution de jeux prevu route assets ui sans contrat backend social et preferences capacite statut frontiere creation liste detail squad supporte maximum cinq classement par moyenne rejoindre inviter quitter gerer squad supporte regles authentifiees et controles de capacite liste detail creation modification guilde supporte pagination recherche sur la liste invitation depart rangs guilde partiel regles metier implementees reserve routage invitations bonus ressources evenements guilde prevu placeholders frontend vides reglages pilotes serveur supporte valeurs validees et versionnees application cache d apparence supporte projection locale pouvant diverger temporairement livraison de notifications absent preference sans sous systeme de livraison application taille d historique absent preference sans consommateur etabli interface web capacite statut frontiere ui login callback totp supporte services live et etats de formulaire explicites ui reglages supporte persistance versionnee live et recuperation de conflit ui squad supporte principaux workflows d appartenance connectes ui coalition partiel classement resume live epreuves logs placeholders ui guilde partiel lecture partiellement connectee actions et lien carte incomplets carte machines accueil absent aucune carte service machine ou client websocket ui profil prevu trophees wallet et logs codes en dur ui boutique prevu cartes statiques et controles achat inactifs ui jeux prevu menu seulement ui admin prevu notfound seulement niveau de preuve chaque statut ci dessus est un audit source a la revision documentee aucun ne constitue une acceptation independante live release securite ou performance"},{"id":"doc-client-fr-client-testing-limitations","surface":"client","language":"FR","relative":"client/testing-limitations.md","path":"doc/Client/FR/client/testing-limitations.md","title":"Tests et limites","summary":"Les tests backend vivent dans `Control/tests/Client` et utilisent Python `unittest`. Les 24 cas déclarés couvrent le callback OAuth d'un utilisateur existant, les comportements d'intégration/routes squad et guilde, ainsi que mapping des req","headings":[{"depth":1,"text":"Tests et limites"},{"depth":2,"text":"Tests déclarés"},{"depth":2,"text":"Vérification statique contre exécution"},{"depth":2,"text":"Limites fonctionnelles connues"},{"depth":2,"text":"Risques de contrat"},{"depth":2,"text":"Qualification requise"}],"markdown":"# Tests et limites\n\n## Tests déclarés\n\nLes tests backend vivent dans `Control/tests/Client` et utilisent Python `unittest`. Les 24 cas déclarés couvrent le callback OAuth d'un utilisateur existant, les comportements d'intégration/routes squad et guilde, ainsi que mapping des requêtes, framing, compression, erreurs, probe de disponibilité et mapping des seeds de la gateway System. Control les lance via Infra Compose contre PostgreSQL ; la suite gateway utilise un faux serveur TCP isolé. `Control/scripts/Client/check_alembic.sh` vérifie en plus une seule tête de migration, l'applique et détecte la dérive des modèles. Aucun test unitaire frontend, suite navigateur end-to-end, test UI WebSocket, test réglages, test accessibilité, qualification OAuth/sécurité réelle ou test de performance n'est déclaré.\n\n## Vérification statique contre exécution\n\nCette documentation dérive du graphe source courant et de son inventaire généré. Les gates documentaires prouvent fichiers appariés, symétrie structurelle EN/FR, liens, inclusion portail, indexation de recherche, sortie générée ignorée et couverture des déclarations. Elles ne prouvent pas que Docker a démarré, que l'API 42 a répondu, que les migrations PostgreSQL ont été appliquées, que les navigateurs ont rendu ou que les parcours utilisateur ont réussi.\n\n## Limites fonctionnelles connues\n\n| Zone | Limite |\n| --- | --- |\n| UI WebSocket | La conquête backend existe ; aucun service/branchement frontend trouvé |\n| Invitations guilde | La route statique peut être masquée par la route ID guilde dynamique précédente |\n| Boutique/jeux/admin | Coques navigables ou structurées sans workflows backend |\n| Extras guilde | Bonus, ressources, événements forcés à des tableaux vides |\n| Épreuves coalition | Tableau vide forcé ; aucun endpoint |\n| Amis/objets | Relations en lecture seule ; aucune route mutation/achat |\n| Historique | Global, non paginé, payload limité |\n| Échelle temps réel | Gestionnaire mémoire, aucune diffusion inter-processus |\n| Localisation | Chaînes seedées/UI mixtes anglais/français ; aucun framework i18n établi |\n\n## Risques de contrat\n\nIl n'existe ni modèles de réponse Pydantic, ni enveloppe d'erreur cohérente, ni préfixe de version API, ni politique de stabilité OpenAPI, ni clés d'idempotence, ni contrat de pagination hors liste guildes. Les champs nullable peuvent contredire les attentes arithmétiques et de tri. La sélection coalition OAuth suppose un ordre de réponse précis. L'identifiant utilisateur de développement frontend par défaut dépend de l'installation. La synchronisation de démarrage écrit en base dans chaque processus lancé.\n\n## Qualification requise\n\nAvant toute revendication release, valider migrations depuis base vide et anciennes bases représentatives ; flux OAuth/liaison/TOTP réels ; matrices d'autorisation ; accessibilité des invitations ; actions squad/machine concurrentes ; reconnexion/diffusion WebSocket ; build/lint frontend et parcours navigateur ; sauvegarde/restauration ; secrets et logs ; vulnérabilités dépendances ; accessibilité ; charge et multi-worker. Enregistrer chaque résultat avec environnement et révision au lieu de transformer cet audit statique en qualification non acquise.\n","search":"doc client fr client testing limitations md tests et limites les tests backend vivent dans control tests client et utilisent python unittest les 24 cas declares couvrent le callback oauth d un utilisateur existant les comportements d integration routes squad et guilde ainsi que mapping des req tests et limites tests declares les tests backend vivent dans control tests client et utilisent python unittest les 24 cas declares couvrent le callback oauth d un utilisateur existant les comportements d integration routes squad et guilde ainsi que mapping des requetes framing compression erreurs probe de disponibilite et mapping des seeds de la gateway system control les lance via infra compose contre postgresql la suite gateway utilise un faux serveur tcp isole control scripts client check alembic sh verifie en plus une seule tete de migration l applique et detecte la derive des modeles aucun test unitaire frontend suite navigateur end to end test ui websocket test reglages test accessibilite qualification oauth securite reelle ou test de performance n est declare verification statique contre execution cette documentation derive du graphe source courant et de son inventaire genere les gates documentaires prouvent fichiers apparies symetrie structurelle en fr liens inclusion portail indexation de recherche sortie generee ignoree et couverture des declarations elles ne prouvent pas que docker a demarre que l api 42 a repondu que les migrations postgresql ont ete appliquees qu ponents inputs tsx front src components logoisland tsx front src components menubar tsx front src components polygon tsx front src components relativetime tsx front src components requireauth tsx front src components scrolltohash tsx front src components separator tsx front src components title tsx front src components tooltip tsx front src components ui tsx front src components userheader tsx front src components window tsx front src components windowmanager tsx front src contexts authcontext tsx front src dummy auth authorized json front src dummy auth callback existing user json front src dummy auth callback new user json front src dummy auth login json front src dummy auth verify totp json front src dummy coalition coalition id json front src dummy coalition leaderboards json front src dummy coalitions leaderboard json front src dummy exist md front src dummy guild search json front src dummy guild json front src dummy machine all json front src dummy machine id json front src dummy root json front src dummy settings json front src dummy squad leaderboard json front src dummy squad squad id json front src dummy squad json front src dummy users leaderboard json front src dummy users user id json front src dummy ws json front src hooks usecoalitions ts front src index css front src layouts applayout tsx front src main tsx front src pages auth tsx front src pages coalition tsx front src pages dev tsx front src pages games tsx front src pages guild tsx front src pages guild event tsx front src pages guild guild tsx front src pages guild search tsx front src pages home home tsx front src pages home machinepage tsx front src pages leaderboard tsx front src pages logins login self tsx front src pages logins login tsx front src pages notfound tsx front src pages notifications tsx front src pages profil tsx front src pages settings tsx front src pages shop tsx front src pages squad search tsx front src pages squad usersquad tsx front src routes index tsx front src services api ts front src services auth ts front src services coalitions ts front src services guild ts front src services settings ts front src services squad ts front src services users ts front src settings settings actions ts front src settings settings catalog ts front src settings settings context ts front src settings settings effects ts front src settings settings storage ts front src settings settingsprovider tsx front src settings usesettings ts front src types api ts front src types guild ts front src types machine ts front src types notif ts front src types session ts front src types settings ts front src types squad ts front src vite env d ts front tailwind config cjs front tsconfig app json front tsconfig json front tsconfig node json front vite config ts license makefile package lock json package json readme md portee l inventaire prouve la presence statique des declarations pas leur qualification en production les contrats et limites sont expliques dans la documentation client suivie"}]</script><script>(function clientApp() {
  const docs = JSON.parse(document.getElementById("portal-data").textContent);
  const scope = document.documentElement.dataset.scope;
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* file:// may deny storage */ } },
  };
  const state = { language: storage.get("reloaded-doc-language") || "EN", surface: scope === "global" ? "all" : scope, query: [], active: null };
  const labels = {
    EN: { search: "Search documentation", contents: "On this page", empty: "No document matches this filter.", all: "All", system: "System", client: "Client", board: "Board", log: "Logs", shared: "Shared", globalTitle: "Global portal", systemTitle: "System docs", clientTitle: "Client docs", boardTitle: "Board", logTitle: "Logs" },
    FR: { search: "Rechercher dans la documentation", contents: "Dans cette page", empty: "Aucun document ne correspond à ce filtre.", all: "Tout", system: "System", client: "Client", board: "Board", log: "Journaux", shared: "Commun", globalTitle: "Portail global", systemTitle: "Documentation System", clientTitle: "Documentation Client", boardTitle: "Board", logTitle: "Journaux" },
  };
  const byId = new Map(docs.map((doc) => [doc.id, doc]));
  const nav = document.getElementById("doc-nav");
  const article = document.getElementById("article");
  const toc = document.getElementById("toc-links");
  const search = document.getElementById("search-input");
  const languageButton = document.getElementById("language-button");

  function escape(value) {
    return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
  }

  function slug(value) {
    return value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function normalizeSearch(value) {
    return value.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function matchesAll(value) {
    const normalized = normalizeSearch(value);
    return state.query.every((token) => matchesToken(normalized, token));
  }

  function matchesToken(normalized, token) {
    if (normalized.includes(token)) return true;
    return token.length > 3 && (token.endsWith("s") || token.endsWith("x")) && normalized.includes(token.slice(0, -1));
  }

  function inline(value) {
    let output = escape(value);
    output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
    output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    output = output.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
    output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return output;
  }

  function renderMarkdown(markdown) {
    const lines = markdown.replace(/\r/g, "").split("\n");
    let html = "";
    let paragraph = [];
    let list = null;
    const flushParagraph = () => {
      if (paragraph.length) html += `<p>${inline(paragraph.join(" "))}</p>`;
      paragraph = [];
    };
    const closeList = () => {
      if (list) html += `</${list}>`;
      list = null;
    };
    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];
      if (/^```/.test(line)) {
        flushParagraph(); closeList();
        const language = line.slice(3).trim();
        const code = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        html += `<pre><code data-language="${escape(language)}">${escape(code.join("\n"))}</code></pre>`;
        continue;
      }
      const heading = /^(#{1,6})\s+(.+)$/.exec(line);
      if (heading) {
        flushParagraph(); closeList();
        const level = heading[1].length;
        const text = heading[2].replace(/\s+#+$/, "");
        html += `<h${level} id="${slug(text)}">${inline(text)}</h${level}>`;
        continue;
      }
      if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
        flushParagraph(); closeList();
        const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
        const headers = cells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
        i -= 1;
        html += `<div class="table-wrap"><table><thead><tr>${headers.map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }
      const item = /^(\s*)([-*+] |\d+\. )(.*)$/.exec(line);
      if (item) {
        flushParagraph();
        const wanted = /\d/.test(item[2]) ? "ol" : "ul";
        if (list !== wanted) { closeList(); list = wanted; html += `<${list}>`; }
        const depth = Math.min(4, Math.floor(item[1].replace(/\t/g, "    ").length / 2));
        html += `<li class="depth-${depth}">${inline(item[3])}</li>`;
        continue;
      }
      if (/^>\s?/.test(line)) {
        flushParagraph(); closeList(); html += `<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`; continue;
      }
      if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
        flushParagraph(); closeList(); html += "<hr>"; continue;
      }
      if (!line.trim()) { flushParagraph(); closeList(); continue; }
      paragraph.push(line.trim());
    }
    flushParagraph(); closeList();
    return html;
  }

  function visibleDocs() {
    return docs.filter((doc) => {
      const languageOk = doc.language === "ALL" || doc.language === state.language;
      const surfaceOk = state.surface === "all" || doc.surface === state.surface;
      const queryOk = !state.query.length || state.query.every((token) => matchesToken(doc.search, token));
      return languageOk && surfaceOk && queryOk;
    });
  }

  function surfaceLabel(surface) {
    return labels[state.language][surface] || surface;
  }

  function renderNav() {
    const visible = visibleDocs();
    nav.innerHTML = "";
    let group = "";
    for (const doc of visible) {
      const nextGroup = `${surfaceLabel(doc.surface)} · ${doc.relative.includes("/") ? doc.relative.split("/")[0] : "index"}`;
      if (nextGroup !== group) {
        group = nextGroup;
        const label = document.createElement("div"); label.className = "nav-group"; label.textContent = group; nav.append(label);
      }
      const button = document.createElement("button");
      button.className = `doc-button${doc.id === state.active ? " active" : ""}`;
      button.innerHTML = `<strong>${escape(doc.title)}</strong><small>${escape(doc.relative)}</small>`;
      button.addEventListener("click", () => openDoc(doc.id));
      nav.append(button);
      if (state.query.length) {
        for (const heading of doc.headings.filter((item) => matchesAll(item.text)).slice(0, 8)) {
          const hit = document.createElement("button");
          hit.className = "search-hit";
          hit.textContent = `↳ ${heading.text}`;
          hit.addEventListener("click", () => openDocAtHeading(doc.id, heading.text));
          nav.append(hit);
        }
      }
    }
    if (!visible.length) {
      nav.innerHTML = `<p class="empty">${labels[state.language].empty}</p>`;
      article.innerHTML = `<div class="empty-state"><h1>${labels[state.language].empty}</h1></div>`;
      toc.innerHTML = "";
      return;
    }
    if (!visible.some((doc) => doc.id === state.active)) openDoc(visible[0].id, false);
  }

  function openDoc(id, rerenderNav = true) {
    const doc = byId.get(id);
    if (!doc) return;
    state.active = id;
    location.hash = id;
    article.innerHTML = `<header class="doc-header"><span>${surfaceLabel(doc.surface)} · ${doc.language === "ALL" ? labels[state.language].shared : doc.language}</span><h1>${escape(doc.title)}</h1><p>${escape(doc.summary)}</p><code>${escape(doc.path)}</code></header><div class="markdown">${renderMarkdown(doc.markdown)}</div>`;
    toc.innerHTML = doc.headings.filter((heading) => heading.depth > 1).map((heading) => `<a class="toc-${heading.depth}" href="#${slug(heading.text)}">${escape(heading.text)}</a>`).join("");
    document.getElementById("toc-title").textContent = labels[state.language].contents;
    if (rerenderNav) renderNav();
    article.scrollTop = 0;
  }

  function openDocAtHeading(id, heading) {
    openDoc(id);
    requestAnimationFrame(() => article.querySelector(`#${CSS.escape(slug(heading))}`)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  }

  function resolveMarkdownLink(href) {
    const active = byId.get(state.active);
    if (!active || !href.split("#")[0].endsWith(".md")) return null;
    const clean = href.split("#")[0];
    const stack = active.path.split("/"); stack.pop();
    for (const part of clean.split("/")) {
      if (part === "..") stack.pop(); else if (part !== ".") stack.push(part);
    }
    return docs.find((doc) => doc.path === stack.join("/")) || null;
  }

  article.addEventListener("click", (event) => {
    const anchor = event.target.closest("a");
    if (!anchor) return;
    const href = anchor.getAttribute("href") || "";
    const linked = resolveMarkdownLink(href);
    if (linked) { event.preventDefault(); openDoc(linked.id); return; }
    if (href.startsWith("#")) {
      event.preventDefault(); article.querySelector(href)?.scrollIntoView({ behavior: "smooth" });
    }
  });

  document.querySelectorAll("[data-surface]").forEach((button) => button.addEventListener("click", () => {
    state.surface = button.dataset.surface;
    document.querySelectorAll("[data-surface]").forEach((item) => item.classList.toggle("active", item === button));
    renderNav();
  }));
  search.addEventListener("input", () => {
    state.query = normalizeSearch(search.value).split(" ").filter(Boolean);
    renderNav();
  });
  languageButton.addEventListener("click", () => {
    const current = byId.get(state.active);
    state.language = state.language === "EN" ? "FR" : "EN";
    storage.set("reloaded-doc-language", state.language);
    if (current?.language !== "ALL") {
      const translated = docs.find((doc) => doc.surface === current.surface && doc.language === state.language && doc.relative === current.relative);
      if (translated) state.active = translated.id;
    }
    updateLanguageUi();
    renderNav();
    if (state.active) openDoc(state.active, false);
  });
  document.getElementById("theme-button").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next; storage.set("reloaded-doc-theme", next);
  });
  document.documentElement.dataset.theme = storage.get("reloaded-doc-theme") || "dark";
  function updateLanguageUi() {
    const copy = labels[state.language];
    languageButton.textContent = state.language === "EN" ? "FR" : "EN";
    languageButton.title = state.language === "EN" ? "Afficher en français" : "Show in English";
    search.placeholder = copy.search;
    document.getElementById("surface-title").textContent = copy[`${scope}Title`];
    document.querySelectorAll("[data-surface]").forEach((button) => {
      button.textContent = copy[button.dataset.surface];
    });
  }
  updateLanguageUi();
  const hashDoc = byId.get(location.hash.slice(1));
  if (hashDoc) state.active = hashDoc.id;
  document.querySelector(`[data-surface="${state.surface}"]`)?.classList.add("active");
  renderNav();
})();</script>
