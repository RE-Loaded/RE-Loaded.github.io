title":"Social systems","summary":"Squads are compact groups capped at five members. Names are trimmed, must contain 3 through 50 characters, and are not declared unique. A creator must not already belong to a squad and becomes leader. Open squads may be joined directly; clo","headings":[{"depth":1,"text":"Social systems"},{"depth":2,"text":"Squads"},{"depth":2,"text":"Guilds"},{"depth":2,"text":"Coalitions"},{"depth":2,"text":"Friends, items, events, and bonuses"}],"markdown":"# Social systems\n\n## Squads\n\nSquads are compact groups capped at five members. Names are trimmed, must contain 3 through 50 characters, and are not declared unique. A creator must not already belong to a squad and becomes leader. Open squads may be joined directly; closed squads require a pending invitation. Joining locks the squad and user, rejects full or changed membership, closes other invitations, and commits atomically.\n\nOnly the leader may invite, remove members, or change name/icon/openness. A leader cannot remove themself. Leaving deletes an empty squad and its invitations; if the leader leaves a non-empty squad, the remaining user with the lowest database ID becomes leader. Squad details include capacity, member count, average points, top three players, and member IDs. The frontend performs additional profile calls for member display.\n\n## Guilds\n\nGuilds have name, icon, leader, and members ranked `Member`, `Officer`, or `Leader`. Listing supports optional case-insensitive search and `limit`/`offset`, with defaults 20/0. Leaders and officers can edit and invite. Only leaders can manage officers, transfer leadership, or remove an officer; officers can remove ordinary members. A leader cannot be kicked.\n\nLeaving clears membership/rank. If the leader leaves, leadership transfers to the first remaining member returned by the database; if no one remains, the guild is deleted. Unlike squad logic, no explicit ordering, capacity, name validation, uniqueness, or row-locking contract is declared. Guild invitations are pending/accepted/declined records.\n\n## Coalitions\n\nCoalition membership is derived from the second element of the 42 coalition response when more than one entry exists. Client stores coalition ID, name, total score, logo, and color. It exposes list, detail, and rank; no Client route creates, edits, joins, or leaves coalitions.\n\n## Friends, items, events, and bonuses\n\nUser relationships include friends and owned items, and profile responses expose their IDs. There are no routes to add/remove friends, list/purchase items, or manage inventory. Guild frontend models contain bonuses, resources, and events, but the backend returns none and the adapter supplies empty arrays. These capabilities are planned/UI-shaped, not supported workflows.\n","search":"doc client en client social md social systems squads are compact groups capped at five members names are trimmed must contain 3 through 50 characters and are not declared unique a creator must not already belong to a squad and becomes leader open squads may be joined directly clo social systems squads squads are compact groups capped at five members names are trimmed must contain 3 through 50 characters and are not declared unique a creator must not already belong to a squad and becomes leader open squads may be joined directly closed squads require a pending invitation joining locks the squad and user rejects full or changed membership closes other invitations and commits atomically only the leader may invite remove members or change name icon openness a leader cannot remove themself leaving deletes an empty squad and its invitations if the leader leaves a non empty squad the remaining user with the lowest database id becomes leader squad details include capacity member count average points top three players and member ids the frontend performs additional profile calls for member display guilds guilds have name icon leader and members ranked member officer or leader listing supports optional case insensitive search and limit offset with defaults 20 0 leaders and officers can edit and invite only leaders can manage officers transfer leadership or remove an officer officers can remove ordinary members a leader cannot be kicked leaving clears membership rank if the leader leaves leadership transfers to the first remaining member returned by the database if no one remains the guild is deleted unlike squad logic no explicit ordering capacity name validation uniqueness or row locking contract is declared guild invitations are pending accepted declined records coalitions coalition membership is derived from the second element of the 42 coalition response when more than one entry exists client stores coalition id name total score logo and color it exposes list detail and rank no client route creates edits joins or leaves coalitions friends items events and bonuses user relationships include friends and owned items and profile responses expose their ids there are no routes to add remove friends list purchase items or manage inventory guild frontend models contain bonuses resources and events but the backend returns none and the adapter supplies empty arrays these capabilities are planned ui shaped not supported workflows"},{"id":"doc-client-en-client-support-matrix","surface":"client","language":"EN","relative":"client/support-matrix.md","path":"doc/Client/EN/client/support-matrix.md","title":"Support matrix","summary":"Supported means source paths form an end-to-end backend or frontend contract inside Client. Partial means an important leg or guarantee is missing. Planned means presentation or intent exists without an operational contract. Absent means no","headings":[{"depth":1,"text":"Support matrix"},{"depth":2,"text":"Status definitions"},{"depth":2,"text":"Identity and platform"},{"depth":2,"text":"Gameplay and data"},{"depth":2,"text":"Social and preferences"},{"depth":2,"text":"Web interface"},{"depth":2,"text":"Evidence level"}],"markdown":"# Support matrix\n\n## Status definitions\n\nSupported means source paths form an end-to-end backend or frontend contract inside Client. Partial means an important leg or guarantee is missing. Planned means presentation or intent exists without an operational contract. Absent means no declaration was found.\n\n## Identity and platform\n\n| Capability | Status | Boundary |\n| --- | --- | --- |\n| 42 OAuth login | Supported | External availability and credentials not qualified |\n| Email registration/login | Partial | Mandatory 42 linking; no verification/reset |\n| TOTP enrollment/login | Supported | No rate-limit/recovery contract |\n| Persistent browser session | Supported | Local storage access token only |\n| Development login bypass | Supported | Requires matching frontend/backend flags |\n| Admin application | Planned | Route shell only |\n| PostgreSQL migrations | Supported | Static graph; upgrade execution not qualified |\n| Docker development stacks | Supported | No production topology |\n\n## Gameplay and data\n\n| Capability | Status | Boundary |\n| --- | --- | --- |\n| Machine list/detail | Supported | Authenticated active users |\n| WebSocket capture/defense | Partial | Backend implemented; frontend wiring absent |\n| Three-minute capture cooldown | Supported | Applied after ownership transfer only |\n| Global capture history | Supported | Unpaginated and unscoped |\n| Player ranking/profile | Supported | Selected public gameplay fields |\n| Coalition list/detail/rank | Supported | Membership imported from 42 |\n| Coalition trial rankings | Planned | Frontend empty placeholder |\n| Achievements | Supported | Unlock checks at OAuth and machine action |\n| Friends management | Absent | Relationship/read IDs only |\n| Shop and item purchase | Planned | UI/model without service routes |\n| Games execution | Planned | UI route/assets without backend contract |\n\n## Social and preferences\n\n| Capability | Status | Boundary |\n| --- | --- | --- |\n| Squad nittest`. The 24 declared cases cover the returning-user OAuth callback, squad and guild integration/route behavior, and the System gateway's request mapping, framing, compression, errors, reachability probe, and seed mapping. Control runs them through Infra Compose against PostgreSQL; the gateway suite uses an isolated fake TCP server. `Control/scripts/Client/check_alembic.sh` additionally checks a single migration head, applies it, and detects model drift. No frontend unit command, browser end-to-end suite, WebSocket UI test, settings test, accessibility test, real OAuth/security qualification, or performance test is declared.\n\n## Static verification versus execution\n\nThis documentation was derived from the current source graph and its generated inventory. The documentation gates prove paired files, structural EN/FR symmetry, links, portal embedding, search indexing, ignored generated output, and declaration coverage. They do not prove that Docker services started, the 42 API answered, PostgreSQL migrations applied, browsers rendered pages, or user journeys passed.\n\n## Known functional limitations\n\n| Area | Limitation |\n| --- | --- |\n| WebSocket UI | Backend capture exists; frontend service/wiring was not found |\n| Guild invitations | Static route may be shadowed by the earlier dynamic guild ID route |\n| Shop/games/admin | Navigable or structured shells without backend workflows |\n| Guild extras | Bonuses, resources, events are forced to empty arrays |\n| Coalition trials | Forced to empty array; no endpoint |\n| Friends/items | Read relationships only; no mutation/purchase routes |\n| History | Global, unpaginated, limited payload |\n| Realtime scale | In-memory manager, no cross-process broadcast |\n| Localization | Mixed English/French seeded and UI strings; no i18n framework established |\n\n## Contract risks\n\nThere are no Pydantic response models, consistent error envelope, API version prefix, OpenAPI stability policy, idempotency keys, or pagination contract outside guild listing. Nullable database fields can conflict with arithmetic and sorting expectations. OAuth coalition selection assumes a specific response ordering. The frontend default development user ID is installation-specific. Startup synchronization performs database writes in each starting process.\n\n## Qualification required\n\nBefore a release claim, validate migrations from empty and representative old databases; real OAuth/link/TOTP flows; authorization matrices; invitation reachability; concurrent squad and machine actions; WebSocket reconnect/broadcast; frontend build/lint and browser journeys; backup/restore; secrets and logs; dependency vulnerabilities; accessibility; load and multi-worker behavior. Record each result with environment and revision rather than upgrading this static audit into an unearned qualification.\n","search":"doc client en client testing limitations md testing and limitations backend tests live in control tests client and use python unittest the 24 declared cases cover the returning user oauth callback squad and guild integration route behavior and the system gateway s request mapping framing compressio testing and limitations declared tests backend tests live in control tests client and use python unittest the 24 declared cases cover the returning user oauth callback squad and guild integration route behavior and the system gateway s request mapping framing compression errors reachability probe and seed mapping control runs them through infra compose against postgresql the gateway suite uses an isolated fake tcp server control scripts client check alembic sh additionally checks a single migration head applies it and detects model drift no frontend unit command browser end to end suite websocket ui test settings test accessibility test real oauth security qualification or performance test is declared static verification versus execution this documentation was derived from the current source graph and its genera language":"FR","relative":"README.md","path":"doc/Client/FR/README.md","title":"Documentation Client","summary":"Ce corpus documente le comportement complet actuellement déclaré par le checkout `Client` à la révision `6d8d9ab27f238a6553b376190f095384e913eca3`, avec les lacunes et les éléments seulement prévus explicitement signalés.","headings":[{"depth":1,"text":"Documentation Client"},{"depth":2,"text":"Ordre de lecture"},{"depth":2,"text":"Convention de preuve"},{"depth":2,"text":"Référence générée"}],"markdown":"# Documentation Client\n\nCe corpus documente le comportement complet actuellement déclaré par le checkout `Client` à la révision `6d8d9ab27f238a6553b376190f095384e913eca3`, avec les lacunes et les éléments seulement prévus explicitement signalés.\n\n## Ordre de lecture\n\n1. [Périmètre et statut](client/overview.md)\n2. [Architecture](client/architecture.md)\n3. [API backend](client/backend-api.md)\n4. [Authentification et sécurité](client/authentication-security.md)\n5. [Gameplay](client/gameplay.md)\n6. [Systèmes sociaux](client/social.md)\n7. [Données et migrations](client/data.md)\n8. [Frontend](client/frontend.md)\n9. [Coque de l'application web](client/interface-shell.md)\n10. [Pages web](client/interface-pages.md)\n11. [Interfaces web sociales](client/interface-social.md)\n12. [Composants UI](client/interface-components.md)\n13. [Assets et fixtures](client/interface-assets-fixtures.md)\n14. [Gameplay web](client/gameplay-web.md)\n15. [Réglages](client/settings.md)\n16. [Exploitation](client/operations.md)\n17. [Tests et limites](client/testing-limitations.md)\n18. [Matrice de support](client/support-matrix.md)\n\n## Convention de preuve\n\n`Supporté` signifie qu'un chemin d'implémentation existe dans les sources Client. `Partiel` signifie que le chemin existe mais que son contrat, son interface ou son intégration est incomplet. `Prévu` signifie que seuls une intention, une fixture, une coque visuelle ou une note existent. `Absent` signifie qu'aucune implémentation n'a été trouvée. Cette documentation statique ne revendique aucune qualification live, sécurité, performance, release ou production.\n\n## Référence générée\n\n`make reference` extrait les routes backend, les routes frontend, les modèles persistés et les révisions Alembic dans les fichiers ignorés de `.generated/doc/Client/`. Il n'écrit jamais dans `doc/Client/EN` ou `doc/Client/FR`.\n","search":"doc client fr readme md documentation client ce corpus documente le comportement complet actuellement declare par le checkout client a la revision 6d8d9ab27f238a6553b376190f095384e913eca3 avec les lacunes et les elements seulement prevus explicitement signales documentation client ce corpus documente le comportement complet actuellement declare par le checkout client a la revision 6d8d9ab27f238a6553b376190f095384e913eca3 avec les lacunes et les elements seulement prevus explicitement signales ordre de lecture 1 perimetre et statut client overview md 2 architecture client architecture md 3 api backend client backend api md 4 authentification et securite client authentication security md 5 gameplay client gameplay md 6 systemes sociaux client social md 7 donnees et migrations client data md 8 frontend client frontend md 9 coque de l application web client interface shell md 10 pages web client interface pages md 11 interfaces web sociales client interface social md 12 composants ui client interface components md 13 assets et fixtures client interface assets fixtures md 14 gameplay web client gameplay web md 15 reglages client settings md 16 exploitation client operations md 17 tests et limites client testing limitations md 18 matrice de support client support matrix md convention de preuve supporte signifie qu un chemin d implementation existe dans les sources client partiel signifie que le chemin existe mais que son contrat son interface ou son integration est incomplet prevu signifie que seuls une intention une fixture une coque visuelle ou une note existent absent signifie qu aucune implementation n a ete trouvee cette documentation statique ne revendique aucune qualification live securite performance release ou production reference generee make reference extrait les routes backend les routes frontend les modeles persistes et les revisions alembic dans les fichiers ignores de generated doc client il n ecrit jamais dans doc client en ou doc client fr"},{"id":"doc-client-fr-client-architecture","surface":"client","language":"FR","relative":"client/architecture.md","path":"doc/Client/FR/client/architecture.md","title":"Architecture","summary":"Le navigateur charge l'application React Vite sur le port 5173. Les appels sous `/api` sont proxifiés vers FastAPI, normalement sur le port 8000, avec suppression du préfixe. FastAPI ouvre des sessions SQLAlchemy synchrones vers PostgreSQL ","headings":[{"depth":1,"text":"Architecture"},{"depth":2,"text":"Topologie d'exécution"},{"depth":2,"text":"Couches backend"},{"depth":2,"text":"Couches frontend"},{"depth":2,"text":"Cycle de vie"},{"depth":2,"text":"Concurrence et état"}],"markdown":"# Architecture\n\n## Topologie d'exécution\n\nLe navigateur charge l'application React Vite sur le port 5173. Les appels sous `/api` sont proxifiés vers FastAPI, normalement sur le port 8000, avec suppression du préfixe. FastAPI ouvre des sessions SQLAlchemy synchrones vers PostgreSQL 16. Les callbacks OAuth appellent aussi l'API 42 externe. La conquête WebSocket utilise directement `/ws?token=...` et diffuse les mises à jour de machines à toutes les sockets gardées en mémoire par le processus.\n\n## Couches backend\n\n| Couche | Responsabilité |\n| --- | --- |\n| `main.py` | Création de l'application, synchronisation des seeds au démarrage, enregistrement des routeurs |\n| `security/` | OAuth, email/mot de passe, JWT, TOTP, barrières d'utilisateur actif |\n| `access/` | Contrats de transport HTTP et WebSocket |\n| `core/` | Statistiques, succès, réglages, règles métier guildes et squads |\n| `data/` | Modèles SQLAlchemy, sessions, migrations |\n| `seeds/` | Matériau de seed des succès, réglages, coalitions et machines |\n\n## Couches frontend\n\n`src/routes/index.tsx` déclare le routage. `AuthProvider` restaure ou crée une session de développement. `services/` convertit les payloads backend en snake-case vers des modèles UI typés. `pages/` orchestre les chargements et actions. `components/` contient les vues réutilisables et spécifiques. `settings/` applique les effets d'apparence et les met en cache localement.\n\n## Cycle de vie\n\nLe démarrage backend synchronise les définitions de succès et de réglages depuis JSON à chaque lancement. La commande Docker du backend exécute d'abord `alembic upgrade head`, puis démarre Uvicorn avec rechargement. Aucun chemin `Base.metadata.create_all()` n'est actif ; la création du schéma dépend des migrations. Au démarrage frontend, l'apparence en cache est appliquée avant le rendu puis l'authentification est résolue.\n\n## Concurrence et état\n\nLes mutations HTTP utilisent des transactions ; l'appartenance aux squads et la conquête des machines utilisent des verrous de ligne sur les chemins critiques. Le gestionnaire WebSocket est local au processus, donc les diffusions ne traversent ni workers ni réplicas. Il n'existe ni broker de messages, ni registre de présence partagé, ni file de reprise, ni flux d'événements durable.\n","search":"doc client fr client architecture md architecture le navigateur charge l application react vite sur le port 5173 les appels sous api sont proxifies vers fastapi normalement sur le port 8000 avec suppression du prefixe fastapi ouvre des sessions sqlalchemy synchrones vers postgresql architecture topologie d execution le navigateur charge l application react vite sur le port 5173 les appels sous api sont proxifies vers fastapi normalement sur le port 8000 avec suppression du prefixe fastapi ouvre des sessions sqlalchemy synchrones vers postgresql 16 les callbacks oauth appellent aussi l api 42 externe la conquete websocket utilise directement ws token et diffuse les mises a jour de machines a toutes les sockets gardees en memoire par le processus couches backend couche responsabilite main py creation de l application synchronisation des seeds au demarrage enregistrement des routeurs security oauth email mot de passe jwt totp barrieres d utilisateur actif access contrats de transport http et websocket core statistiques succes reglages regles metier guildes et squads data modeles sqlalchemy sessions migrations seeds materiau de seed des succes reglages coalitions et machines couches frontend src routes index tsx declare le routage authprovider restaure ou cree une session de developpement services convertit les payloads backend en snake case vers des modeles ui types pages orchestre les chargements et actions components contient les vues reutilisables et specifiques settings applique les effets d apparence et les met en cache localement cycle de vie le demarrage backend synchronise les definitions de succes et de reglages depuis json a chaque lancement la commande docker du backend execute d abord alembic upgrade head puis demarre uvicorn avec rechargement aucun chemin base metadata create all n est actif la creation du schema depend des migrations au demarrage frontend l apparence en cache est appliquee avant le rendu puis l authentification est resolue concurrence et etat les mutations http utilisent des transactions l appartenance aux squads et la conquete des machines utilisent des verrous de ligne sur les chemins critiques le gestionnaire websocket est local au processus donc les diffusions ne traversent ni workers ni replicas il n existe ni broker de messages ni registre de presence partage ni file de reprise ni flux d evenements durable"},{"id":"doc-client-fr-client-authentication-security","surface":"client","language":"FR","relative":"client/authentication-security.md","path":"doc/Client/FR/client/authentication-security.md","title":"Authentification et sécurité","summary":"OAuth 42 direct redirige vers le callback configuré, échange le code côté serveur, lit `/v2/me`, lit l'appartenance à une coalition et crée ou rafraîchit l'utilisateur local. L'inscription email exige une adresse syntaxiquement valide et un","headings":[{"depth":1,"text":"Authentification et sécurité"},{"depth":2,"text":"Flux d'identité"},{"depth":2,"text":"Classes de jetons"},{"depth":2,"text":"Session navigateur"},{"depth":2,"text":"Contournement de développement"},{"depth":2,"text":"Limites de sécurité"}],"markdown":"# Authentification et sécurité\n\n## Flux d'identité\n\nOAuth 42 direct redirige vers le callback configuré, échange le code côté serveur, lit `/v2/me`, lit l'appartenance à une coalition et crée ou rafraîchit l'utilisateur local. L'inscription email exige une adresse syntaxiquement valide et un mot de passe UTF-8 de 12 à 72 octets, le hache avec bcrypt, puis émet un JWT de liaison de cinq minutes. Une identité email est inutilisable pour le gameplay tant qu'un compte 42 unique n'est pas lié via le state OAuth.\n\n## Classes de jetons\n\n| Type | Durée | Usage |\n| --- | --- | --- |\n| `access` | 48 heures | Autorisation API et connexion WebSocket |\n| `pre_auth` | 5 minutes | Vérification TOTP uniquement |\n| `link` | 5 minutes | Lier un compte email à une identité 42 |\n\nTous les jetons sont des JWT HS256 signés avec `JWT_SECRET`. Le backend valide le type de jeton à chaque barrière. Les secrets TOTP sont générés par utilisateur ; le premier challenge inclut un QR PNG en base64. Un code valide positionne `totp_confirmed` et émet un jeton d'accès. Les connexions suivantes exigent encore TOTP mais omettent le QR.\n\n## Session navigateur\n\nLe jeton d'accès est stocké sous `reloaded.access_token` dans `localStorage`, joint comme en-tête Bearer et supprimé si la restauration échoue ou à la déconnexion. Il persiste entre onglets/redémarrages et reste accessible au JavaScript ; aucun cookie HttpOnly, refresh token, registre de révocation serveur, rotation ou invalidation explicite à la déconnexion n'existe.\n\n## Contournement de développement\n\n`VITE_SKIP_LOGIN=true` fait appeler `/auth/dev-login` avec `VITE_DEV_USER_ID` ; le backend exige indépendamment `DEV_MODE=true`. Le frontend marque alors localement la session administrateur, mais `/auth/authorized` renvoie toujours `is_admin: false`. C'est une commodité de développement, pas un rôle d'autorisation.\n\n## Limites de sécurité\n\nLes paramètres OAuth sont concaténés sans PKCE ni state CSRF nouvellement généré pour la connexion normale ; le state est réservé aux jetons de liaison. La vérification TOTP n'a ni limitation de débit visible ni politique de fenêtre/rejeu. Les claims JWT sont journalisés par `verify_jwt`. Aucune politique CORS, CSP, couche CSRF, limite de taille, limitation brute-force, réinitialisation de mot de passe, vérification email, codes de récupération, rotation de secret ou en-têtes de sécurité n'est déclarée ici. Les jetons WebSocket voyagent dans la query string et peuvent apparaître dans les journaux d'infrastructure. Ce sont des limites observées, pas des affirmations d'exploitabilité.\n","search":"doc client fr client authentication security md authentification et securite oauth 42 direct redirige vers le callback configure echange le code cote serveur lit v2 me lit l appartenance a une coalition et cree ou rafraichit l utilisateur local l inscription email exige une adresse syntaxiquement valide et un authentification et securite flux d identite oauth 42 direct redirige vers le callback configure echange le code cote serveur lit v2 me lit l appartenance a une coalition et cree ou rafraichit l utilisateur local l inscription email exige une adresse syntaxiquement valide et un mot de passe utf 8 de 12 a 72 octets le hache avec bcrypt puis emet un jwt de liaison de cinq minutes une identite email est inutilisable pour le gameplay tant qu un compte 42 unique n est pas lie via le state oauth classes de jetons type duree usage access 48 heures autorisation api et connexion websocket pre auth 5 minutes verification totp uniquement link 5 minutes lier un compte email a une identite 42 tous les jetons sont des jwt hs256 signes avec jwt secret le backend valide le type de jeton a chaque barriere les secrets totp sont generes par utilisateur le premier challenge inclut un qr png en base64 un code valide positionne totp confirmed et emet un jeton d acces les connexions suivantes exigent encore totp mais omettent le qr session navigateur le jeton d acces est stocke sous reloaded access token dans localstorage joint comme en tete bearer et supprime si la restauration echoue ou a la deconnexion il persiste entre onglets redemarrages et reste accessible au javascript aucun cookie httponly refresh token registre de revocation serveur rotation ou invalidation explicite a la deconnexion n existe contournement de developpement vite skip login true fait appeler auth dev login avec vite dev user id le backend exige independamment dev mode true le frontend marque alors localement la session administrateur mais auth authorized renvoie toujours is admin false c est une commodite de developpement pas un role d autorisation limites de securite les parametres oauth sont concatenes sans pkce ni state csrf nouvellement genere pour la connexion normale le state est reserve aux jetons de liaison la verification totp n a ni limitation de debit visible ni politique de fenetre rejeu les claims jwt sont journalises par verify jwt aucune politique cors csp couche csrf limite de taille limitation brute force reinitialisation de mot de passe verification email codes de recuperation rotation de secret ou en tetes de securite n est declaree ici les jetons websocket voyagent dans la query string et peuvent apparaitre dans les journaux d infrastructure ce sont des limites observees pas des affirmations d exploitabilite"},{"id":"doc-client-fr-client-backend-api","surface":"client","language":"FR","relative":"client/backend-api.md","path":"doc/Client/FR/client/backend-api.md","title":"API backend","summary":"Toutes les routes sauf `/`, `/auth/login`, `/auth/callback`, `/auth/email/register`, `/auth/email/login`, `/auth/verify-totp` et la connexion de développement exigent un jeton d'accès Bearer. Les routes gameplay/données utilisent la barrièr","headings":[{"depth":1,"text":"API backend"},{"depth":2,"text":"Contrat commun"},{"depth":2,"text":"Routes d'authentification"},{"depth":2,"text":"Routes de lecture"},{"depth":2,"text":"Routes de mutation"},{"depth":2,"text":"Réserve d'ordonnancement"},{"depth":2,"text":"Inventaire exact"}],"markdown":"# API backend\n\n## Contrat commun\n\nToutes les routes sauf `/`, `/auth/login`, `/auth/callback`, `/auth/email/register`, `/auth/email/login`, `/auth/verify-totp` et la connexion de développement exigent un jeton d'accès Bearer. Les routes gameplay/données utilisent la barrière d'utilisateur actif plus stricte et refusent les comptes sans identité 42 liée. Les corps JSON sont assemblés depuis des paramètres FastAPI `Body` individuels. Les formes d'erreur ne sont pas uniformes : FastAPI lève `{\"detail\": ...}`, tandis que plusieurs wrappers renvoient `{\"error\": ...}`.\n\n## Routes d'authentification\n\n| Méthode | Chemin | Contrat |\n| --- | --- | --- |\n| GET | `/auth/login` | Redirige vers 42 ; `link_token` optionnel devient le `state` OAuth |\n| GET | `/auth/callback` | Échange le code, synchronise identité/coalition, renvoie le challenge de pré-authentification |\n| GET | `/auth/dev-login?user_id=` | Émet un jeton d'accès seulement avec `DEV_MODE=true` |\n| GET | `/auth/authorized` | Renvoie les champs normalisés de la session courante |\n| POST | `/auth/verify-totp` | Vérifie `totp_code` sous jeton de pré-authentification et émet le jeton d'accès |\n| POST | `/auth/email/register` | Valide les identifiants, crée un compte non lié, renvoie le jeton de liaison |\n| POST | `/auth/email/login` | Vérifie le mot de passe ; exige la liaison 42 ou renvoie le challenge TOTP |\n\n## Routes de lecture\n\nLes utilisateurs exposent un classement par points et un profil détaillé. Les coalitions exposent une liste, une liste d'identifiants classée par points et le détail. Les squads exposent un classement par moyenne, le détail et les invitations en attente. Les guildes exposent une liste filtrée/paginée, le détail et les invitations en attente. Les machines exposent toutes les positions/propriétés et le détail d'une machine. Les succès exposent les définitions et déblocages par utilisateur. `/history` expose tout l'historique de conquête sans filtrage coalition/utilisateur. Les réglages exposent version courante, définitions catégorisées et valeurs.\n\n## Routes de mutation\n\nLes mutations squad créent, rejoignent une squad ouverte, invitent, acceptent, refusent, quittent, retirent un membre et modifient nom/icône/ouverture. Les mutations guilde créent, modifient, invitent, acceptent, refusent, quittent, retirent un membre, promeuvent/rétrogradent les officiers et transfèrent la direction via le rang `Leader`. Les réglages acceptent `{version, changes}` et utilisent une concurrence optimiste : version obsolète en 409 ; valeur inconnue ou invalide en 422.\n\n## Réserve d'ordonnancement\n\nLa route dynamique guilde `/{guild_id}` est déclarée avant `/guilds/invitations`. FastAPI/Starlette évalue les routes dans l'ordre de déclaration ; le chemin statique d'invitations peut donc être absorbé par la route dynamique et échouer à la validation entière. Le routeur squad déclare déjà `/squads/invitations` avant `/{squad_id}` et ne partage pas ce défaut d'ordre. L'endpoint guilde est déclaré mais son accessibilité reste partielle tant que l'ordre ou un convertisseur entier explicite/statique en premier n'est pas corrigé.\n\n## Inventaire exact\n\nLe fichier généré `client/reference/inventory.md` fait autorité pour la présence méthode/chemin/source et sa couverture est vérifiée contre chaque décorateur FastAPI.\n","search":"doc client fr client backend api md api backend toutes les routes sauf auth login auth callback auth email register auth email login auth verify totp et la connexion de developpement exigent un jeton d acces bearer les routes gameplay donnees utilisent la barrier api backend contrat commun toutes les routes sauf auth login auth callback auth email register auth email login auth verify totp et la connexion de developpement exigent un jeton d acces bearer les routes gameplay donnees utilisent la barriere d utilisateur actif plus stricte et refusent les comptes sans identite 42 liee les corps json sont assembles depuis des parametres fastapi body individuels les formes d erreur ne sont pas uniformes fastapi leve detail tandis que plusieurs wrappers renvoient error routes d authentification methode chemin contrat get auth login redirige vers 42 link token optionnel devient le state oauth get auth callback echange le code synchronise identite coalition renvoie le challenge de pre authentification get auth dev login user id emet un jeton d acces seulement avec dev mode true get auth authorized renvoie les champs normalises de la session courante post auth verify totp verifie totp code sous jeton de pre authentification et emet le jeton d acces post auth email register valide les identifiants cree un compte non lie renvoie le jeton de liaison post auth email login verifie le mot de passe exige la liaison 42 ou renvoie le challenge totp routes de lecture les utilisateurs exposent un classement par points et un profil detaille les coalitions exposent une liste une liste d identifiants classee par points et le detail les squads exposent un classement par moyenne le detail et les invitations en attente les guildes exposent une liste filtree paginee le detail et les invitations en attente les machines exposent toutes les positions proprietes et le detail d une machine les succes exposent les definitions et deblocages par utilisateur history expose tout l acunes de sérialisation"}],"markdown":"# Données et migrations\n\n## Modèle persisté\n\nLes entités principales sont utilisateurs, coalitions, squads, guildes, machines, historique de conquête, objets, succès, catégories de réglages, définitions de réglages et valeurs par utilisateur. Des tables d'association modélisent succès utilisateur, objets utilisateur et amitiés directionnelles. Des tables d'invitation stockent les invitations squad et guilde. Les déclarations exactes classe ORM/table sont générées dans la référence.\n\n## Contraintes importantes\n\nL'email utilisateur et l'`intra_id` 42 sont uniques et nullable. Les clés de réglages sont uniques ; une seule valeur `(user_id, setting_id)` est permise. Les tables d'invitation et d'association ne déclarent pas visiblement de contraintes d'unicité, donc la prévention des doublons repose surtout sur le code métier. Beaucoup de colonnes domaine sont nullable dans le modèle, dont soldes de points, noms, propriété et compteurs ; les fonctions métier utilisent souvent `or 0`, mais pas partout.\n\n## Graphe de migrations\n\nAlembic commence à `490839257cfd`, ajoute les structures identité, gameplay, guilde, réglages et TOTP, et contient un historique de branches/fusions. La révision de fusion courante joint les têtes TOTP-confirmed et squad-open. Les noms de fichiers disent souvent « add_totp_secret » tout en contenant d'autres changements ; les identifiants revision/down-revision, pas les noms, définissent le graphe. L'inventaire généré consigne chaque révision et parent déclarés.\n\n## Synchronisation des seeds\n\nLes définitions de succès et réglages sont upsertées depuis JSON au démarrage. Les noms/descriptions de succès et métadonnées de réglages existants sont écrasés pour correspondre aux fichiers ; déblocages et valeurs utilisateur restent. Les seeds machines/coalitions sont des modules exécutables séparés, hors démarrage normal. La cible Make `install` backend exécute seulement le seed machines après une attente fixe de cinq secondes.\n\n## Lacunes de sérialisation\n\nLes API renvoient des dictionnaires construits manuellement plutôt que des schémas de réponse déclarés. Les champs et leur nullabilité dépendent donc des chemins d'implémentation et aucune validation automatique de sortie n'est assurée. L'historique omet l'objet relation utilisateur ; les succès omettent conditions et heure de déblocage ; l'utilisateur omet wallet, email, guilde, compteurs, horodatages et version de réglages ; la sortie machine doit être lue selon le serializer courant plutôt que toute la table.\n","search":"doc client fr client data md donnees et migrations les entites principales sont utilisateurs coalitions squads guildes machines historique de conquete objets succes categories de reglages definitions de reglages et valeurs par utilisateur des tables d association modelisent succes donnees et migrations modele persiste les entites principales sont utilisateurs coalitions squads guildes machines historique de conquete objets succes categories de reglages definitions de reglages et valeurs par utilisateur des tables d association modelisent succes utilisateur objets utilisateur et amities directionnelles des tables d invitation stockent les invitations squad et guilde les declarations exactes classe orm table sont generees dans la reference contraintes importantes l email utilisateur et l intra id 42 sont uniques et nullable les cles de reglages sont uniques une seule valeur user id setting id est permise les tables d invitation et d association ne declarent pas visiblement de contraintes d unicite donc la prevention des doublons repose surtout sur le code metier beaucoup de colonnes domaine sont nullable dans le modele dont soldes de points noms propriete et compteurs les fonctions metier utilisent souvent or 0 mais pas partout graphe de migrations alembic commence a 490839257cfd ajoute les structures identite gameplay guilde reglages et totp et contient un historique de branches fusions silience"}],"markdown":"# Frontend\n\n## Routage et protections\n\n`/dev/` est public et hors layout principal. `/login` et `/auth/callback` sont publics dans celui-ci. Accueil, profils, réglages, boutique, jeux, recherche/détail guilde, classement/détail coalition et recherche/détail squad sont imbriqués sous `RequireAuth`. Le wildcard affiche NotFound. `/admin` possède un layout mais chaque enfant résout vers NotFound. La référence générée liste tous les chemins littéraux ; layouts et routes de garde sans chemin sont structurels, non navigables.\n\n## Cycle de session\n\n`AuthProvider` démarre en chargement, puis restaure un jeton sauvegardé ou crée la session de développement configurée. Un échec laisse l'utilisateur à null. `RequireAuth` attend la fin du chargement et redirige les visiteurs non authentifiés. L'échange du callback OAuth est dédupliqué par code/state pendant 60 secondes pour tolérer les exécutions React répétées. Un TOTP réussi stocke le jeton d'accès et recharge `/auth/authorized`.\n\n## Pages à données live\n\nRecherche et détail guilde appellent les services guilde. Recherche/détail squad appellent classement, détail, profils, invitations et mutations. Les pages coalition appellent liste/détail/classement. Les profils appellent le détail utilisateur. Les réglages lisent et patchent le contrat versionné. Chaque service convertit les noms backend et transforme certains 404 en `null` ; les autres échecs remontent aux états de page.\n\n## Pages partielles et visuelles\n\nBoutique et jeux possèdent routes et assets/composants visuels mais aucun service backend associé. Les classements d'épreuves coalition sont toujours un tableau vide faute d'endpoint. Les tableaux bonus/ressources/événements guilde restent vides car l'adaptateur les fournit ainsi. L'accueil contient une présentation carte/jeu, mais cet audit n'a trouvé aucun service WebSocket frontend dans `front/src/services` ; le branchement temps réel de conquête reste donc partiel malgré l'endpoint backend. Les dossiers développement et dummy-data sont des démonstrations, pas des sources de production.\n\n## Framework UI\n\nL'application utilise React 19, React Router 7, TypeScript 6, Vite 8, Tailwind 4, Iconify, React Icons, date-fns, react-datepicker et SVGR. L'alias `@` résout vers `src`. Vite accepte `re-loaded.fr` et proxy `/api` ; aucun serveur de build production ou contrat de déploiement des assets statiques n'est inclus.\n\n## Accessibilité et résilience\n\nAucun script de test frontend automatisé n'est déclaré dans `package.json` ; seuls build et lint existent. Les composants visuels ne prouvent aucune qualification clavier, lecteur d'écran, responsive, localisation ou accessibilité. Les requêtes API n'ont ni timeout, annulation, retry, cache offline ni gestion globale de refresh token.\n","search":"doc client fr client frontend md frontend dev est public et hors layout principal login et auth callback sont publics dans celui ci accueil profils reglages boutique jeux recherche detail guilde classement detail coalition et recherche detail squad sont imbriques frontend routage et protections dev est public et hors layout principal login et auth callback sont publics dans celui ci accueil profils reglages boutique jeux recherche detail guilde classement detail coalition et recherche detail squad sont imbriques sous requireauth le wildcard affiche notfound admin possede un layout mais chaque enfant resout vers notfound la reference generee liste tous les chemins litteraux layouts et routes de garde sans chemin sont structurels non navigables cycle de session authprovider demarre en chargement puis restaure un jeton sauvegarde ou cree la session de developpement configuree un echec laisse l utilisateur a null requireauth attend la fin du chargement et redirige les visiteurs non authentifies l echange du callback oauth est deduplique par code state pendant 60 secondes pour tolerer les executions react repetees un totp reussi stocke le jeton d acces et recharge auth authorized pages a donnees live recherche et detail guilde appellent les services guilde recherche detail squad appellent classement detail profils invitations et mutations les pages coalition appellent liste detail classement les profils appellent le detail utilisateur les reglages lisent et patchent le contrat versionne chaque service convertit les noms backend et transforme certains 404 en null les autres echecs remontent aux etats de page pages partielles et visuelles boutique et jeux possedent routes et assets composants visuels mais aucun service backend associe les classements d epreuves coalition sont toujours un tableau vide faute d endpoint les tableaux bonus ressources evenements guilde restent vides car l adaptateur les fournit ainsi l accueil contient une presentation carte jeu mais cet audit n a trouve aucun service websocket frontend dans front src services le branchement temps reel de conquete reste donc partiel malgre l endpoint backend les dossiers developpement et dummy data sont des demonstrations pas des sources de production framework ui l application utilise react 19 react router 7 typescript 6 vite 8 tailwind 4 iconify react icons date fns react datepicker et svgr l alias resout vers src vite accepte re loaded fr et proxy api aucun serveur de build production ou contrat de deploiement des assets statiques n est inclus accessibilite et resilience aucun script de test frontend automatise n est declare dans package json seuls build et lint existent les composants visuels ne prouvent aucune qualification clavier lecteur d ecran responsive localisation ou accessibilite les requetes api n ont ni timeout annulation retry cache offline ni gestion globale de refresh token"},{"id":"doc-client-fr-client-gameplay-web","surface":"client","language":"FR","relative":"client/gameplay-web.md","path":"doc/Client/FR/client/gameplay-web.md","title":"Gameplay web","summary":"L'application web n'expose pas actuellement le gameplay de conquête de machines implémenté par le backend. Il n'existe aucune construction `WebSocket` dans le TypeScript/TSX actif, aucun client `/ws`, aucun appel liste/détail machine, aucun","headings":[{"depth":1,"text":"Gameplay web"},{"depth":2,"text":"Frontière réellement jouable"},{"depth":2,"text":"Présentation de l'accueil"},{"depth":2,"text":"Traçage backend vers web"},{"depth":2,"text":"Métagame social"},{"depth":2,"text":"Intégration requise pour une conquête jouable"},{"depth":2,"text":"Déclaration de qualification"}],"markdown":"# Gameplay web\n\n## Frontière réellement jouable\n\nL'application web n'expose pas actuellement le gameplay de conquête de machines implémenté par le backend. Il n'existe aucune construction `WebSocket` dans le TypeScript/TSX actif, aucun client `/ws`, aucun appel liste/détail machine, aucune carte/grille/canvas, aucune sélection de machine, aucun contrôle de mise de points, aucune action conquête/défense, aucun affichage cooldown et aucun handler `machine_updated`. Le seul matériau WebSocket frontend est `dummy/ws.json`.\n\n## Présentation de l'accueil\n\nL'accueil suggère visuellement le gameplay via scores coalitions, bouton mode 2D/3D et hotbar. Les trois scores et flèches de tendance sont des littéraux. Changer 2D/3D modifie seulement l'état du menu et l'icône. Le corps ne contient aucune carte. Les icônes hotbar clé, commit, plume et balle n'ont aucun handler ; Fermer replie seulement la hotbar. Ces contrôles sont donc des intentions d'interface, pas des commandes gameplay supportées.\n\n## Traçage backend vers web\n\n| Élément gameplay | Backend | Interface web | Statut utilisateur global |\n| --- | --- | --- | --- |\n| Catalogue et coordonnées machines | `GET /machine/all`, `GET /machine/{id}` | Aucun service ou consommateur page | Non exposé |\n| Solde de points coalition | Données utilisateur/profil et OAuth | Accueil affiche des nombres fixes ; profil statique | Mal exposé |\n| Conquête/attaque/défense | `/ws` authentifié | Aucun socket ou formulaire d'action | Non jouable |\n| Cooldown trois minutes | Imposé serveur après conquête | Aucun timer/état | Invisible |\n| Mise à jour machine temps réel | Diffusion `machine_updated` | Aucun listener | Invisible |\n| Historique de conquête | `GET /history` | Logs profil/coalition codés en dur | Non connecté |\n| Succès | Endpoints liste et par utilisateur | Trophées profil codés en dur | Non connecté |\n| Classements | Endpoints utilisateur/coalition/squad | Pages coalition et squad partielles/live | Partiellement exposé |\n| Dépense de points et compteurs | Mis à jour pendant action `/ws` | Aucune projection/actualisation UI | Non exposé |\n\n## Métagame social\n\nLes squads constituent le système jouable web le plus complet : créer, découvrir, rejoindre, inviter, accepter/refuser, changer le recrutement, retirer et quitter sont connectés. Le classement coalition est live mais les épreuves sont absentes. Identité/membres guilde sont lus en live, tandis que gestion et événements guilde restent visuels. Boutique, jeux, récompenses profil, wallet et logs n'exécutent aucune action de métagame.\n\n## Intégration requise pour une conquête jouable\n\nUn chemin web complet exigerait bootstrap machines authentifié, construction URL socket et gestion jeton, reconnexion/resynchronisation, messages entrants/sortants typés, rendu carte, état machine sélectionnée et mise, validation du solde, feedback pending/accepté/refusé, affichage cooldown, réconciliation des broadcasts, rafraîchissement session/points, historique et succès, et comportement d'erreur/fermeture explicite. Aucun de ces éléments manquants ne doit être déduit de l'endpoint backend ou des fixtures.\n\n## Déclaration de qualification\n\nLa machine à états backend est supportée statiquement ; le gameplay navigateur est absent. Client ne peut donc pas être décrit comme offrant un gameplay machine de bout en bout à cette révision. Les pages social/réglages/auth restent classifiables indépendamment selon leur propre état d'intégration.\n","search":"doc client fr client gameplay web md gameplay web l application web n expose pas actuellement le gameplay de conquete de machines implemente par le backend il n existe aucune construction websocket dans le typescript tsx actif aucun client ws aucun appel liste detail machine aucun gameplay web frontiere reellement jouable l application web n expose pas actuellement le gameplay de conquete de machines implemente par le backend il n existe aucune construction websocket dans le typescript tsx actif aucun client ws aucun appel liste detail machine aucune carte grille canvas aucune selection de machine aucun controle de mise de points aucune action conquete defense aucun affichage cooldown et aucun handler machine updated le seul materiau websocket frontend est dummy ws json presentation de l accueil l accueil suggere visuellement le gameplay via scores coalitions bouton mode 2d 3d et hotbar les trois scores et fleches de tendance sont des litteraux changer 2d 3d modifie seulement l etat du menu et l icone le corps ne contient aucune carte les icones hotbar cle commit plume et balle n ont aucun handler fermer replie seulement la hotbar ces controles sont donc des intentions d interface pas des commandes gameplay supportees tracage backend vers web element gameplay backend interface web statut utilisateur global catalogue et coordonnees machines get machine all get machine id aucun service ou consommateur page non expose solde de points coalition donnees utilisateur profil et oauth accueil affiche des nombres fixes profil statique mal expose conquete attaque defense ws authentifie aucun socket ou formulaire d action non jouable cooldown trois minutes impose serveur apres conquete aucun timer etat invisible mise a jour machine temps reel diffusion machine updated aucun listener invisible historique de conquete get history logs profil coalition codes en dur non connecte succes endpoints liste et par utilisateur trophees profil codes en lay"},{"depth":2,"text":"Carte des machines"},{"depth":2,"text":"Machine à états de conquête"},{"depth":2,"text":"Score et classements"},{"depth":2,"text":"Succès"},{"depth":2,"text":"Limites historique et temps réel"}],"markdown":"# Gameplay\n\n## Carte des machines\n\nLes machines possèdent identifiant, ligne, colonne, cluster, coalition propriétaire, points investis et horodatage de dernière conquête. Les endpoints de lecture exposent toute la carte ou une machine. L'interaction active est un WebSocket authentifié ; le client envoie `{action, machine_id, points}`. `action` doit être truthy mais sa valeur n'est autrement pas interprétée.\n\n## Machine à états de conquête\n\nLe serveur refuse les champs manquants/faux, points non positifs, utilisateur/machine inconnus, utilisateurs sans coalition, dépense supérieure au solde et machines conquises moins de trois minutes auparavant. Il verrouille la ligne machine avant d'appliquer l'action.\n\n| Propriétaire existant | Effet |\n| --- | --- |\n| Aucun | Attribue la machine à la coalition du joueur et fixe les points à la mise |\n| Même coalition | Ajoute la mise, incrémente `machines_defended` du joueur |\n| Autre coalition | Soustrait la mise ; à zéro ou moins, transfère la propriété et enregistre l'historique |\n\nChaque action acceptée déduit `coalition_points`, incrémente `spent_points`, vérifie les succès, commit et diffuse `machine_updated` avec identifiant machine, identifiant coalition et points. Lors d'une conquête, la machine revient à zéro point et reçoit l'horodatage de cooldown ; le dépassement n'est pas conservé.\n\n## Score et classements\n\nLe classement joueur trie par `coalition_points` courants décroissants. Le classement coalition trie par `total_points` synchronisé depuis 42, pas par machines conquises. Le classement squad trie par moyenne des points coalition des membres. Aucune boucle d'attribution de points n'est déclarée dans ce checkout ; Client dépense les points et importe les valeurs initiales/courantes depuis 42.\n\n## Succès\n\nQuinze succès seedés couvrent machines conquises (1/5/10/25), machines défendues (1/5/10), points dépensés (100/1000/10000), jours consécutifs (3/7/30) et nombre d'amis (5/10). Les vérifications ont lieu après rafraîchissement OAuth et action machine. Aucun endpoint de mutation des amis n'existe dans ce checkout ; les succès d'amis dépendent donc de données alimentées extérieurement. Les horodatages de déblocage existent dans la table de jointure mais sont omis des réponses API.\n\n## Limites historique et temps réel\n\nL'historique enregistre machine, coalition, utilisateur et heure de conquête, mais l'API renvoie la collection globale sans pagination. Les diffusions n'incluent ni utilisateur actif, ni cooldown, ni ligne/colonne, ni version de snapshot. L'état de connexion est mono-processus et le nettoyage de déconnexion intervient seulement après `WebSocketDisconnect` ; les autres erreurs du handler ne sont pas converties en contrat de fermeture/erreur documenté.\n","search":"doc client fr client gameplay md gameplay les machines possedent identifiant ligne colonne cluster coalition proprietaire points investis et horodatage de derniere conquete les endpoints de lecture exposent toute la carte ou une machine l interaction active est un websocket gameplay carte des machines les machines possedent identifiant ligne colonne cluster coalition proprietaire points investis et horodatage de derniere conquete les endpoints de lecture exposent toute la carte ou une machine l interaction active est un websocket authentifie le client envoie action machine id points action doit etre truthy mais sa valeur n est autrement pas interpretee machine a etats de conquete le serveur refuse les champs manquants faux points non positifs utilisateur machine inconnus utilisateurs sans coalition depense superieure au solde et machines conquises moins de trois minutes auparavant il verrouille la ligne machine avant d appliquer l action proprietaire age":"FR","relative":"client/interface-assets-fixtures.md","path":"doc/Client/FR/client/interface-assets-fixtures.md","title":"Assets et fixtures","summary":"Le dépôt contient 29 assets, dont 17 sous `assets/shop`. Leur présence ne signifie pas que chacun est importé. Les cartes boutique utilisent des chaînes littérales `./src/assets/...`, hypothèses de chemin développement plutôt que des import","headings":[{"depth":1,"text":"Assets et fixtures"},{"depth":2,"text":"Assets visuels"},{"depth":2,"text":"Fixtures JSON"},{"depth":2,"text":"Interprétation des fixtures"},{"depth":2,"text":"Icônes et ressources externes"},{"depth":2,"text":"Limites des assets"}],"markdown":"# Assets et fixtures\n\n## Assets visuels\n\n| Groupe | Fichiers | Usage courant |\n| --- | --- | --- |\n| Marque/auth | `42logo.svg`, `logo.png`, assets `LogoIsland` | OAuth et identité application |\n| Coalitions | `analysts.svg`, `artisans.svg`, `technicians.svg` | Header de scores fixes Accueil |\n| Images génériques | `dance.gif`, `default.jpeg`, `hero.png`, `Bus-Magique.png`, `T8_ROCK@3.png` | Fallback image, démonstrations, visuels guilde |\n| Scaffold | `react.svg`, `vite.svg` | Résidu template/développement |\n| Boutique attaques | `BOMBA`, `BOUMBOUM`, `FIOUU`, `FIREE`, `WATTEEERR` | Cartes boutique statiques |\n| Boutique capture | `BATTERY`, `LIGHT`, `KARTTT`, `TABLE`, `VROUM` | Cartes boutique statiques |\n| Boutique boss | `Electric_Chuchu`, `Fire_Chuchu`, `Fire_Lick`, `Golem_Capitaine`, `Like`, `Miaou`, `Minitracien` | Cartes boutique statiques ou stock inutilisé |\n\nLe dépôt contient 29 assets, dont 17 sous `assets/shop`. Leur présence ne signifie pas que chacun est importé. Les cartes boutique utilisent des chaînes littérales `./src/assets/...`, hypothèses de chemin développement plutôt que des imports modules Vite vérifiés.\n\n## Fixtures JSON\n\nLe dossier dummy contient des exemples pour root, login, callback utilisateur existant/nouveau, authorization, TOTP, détail/classement utilisateur, liste/détail/classement/épreuves coalition, liste/détail/classement squad, détail/recherche guilde, liste/détail machine, réglages et échange WebSocket. `exist.md` décrit le jeu de fixtures. Aucun import TypeScript/TSX de production depuis dummy n'a été trouvé ; les services courants appellent `/api`.\n\n## Interprétation des fixtures\n\nLes fixtures documentent des formes de réponse prévues et aident le développement visuel, mais peuvent être obsolètes. En particulier, données d'épreuves coalition, échange WebSocket machine et contenu guilde enrichi apparaissent dans fixtures ou types alors que le frontend actif n'a pas d'intégration live correspondante. Le contrat backend dérivé des sources et les appels de services courants priment sur les champs fixture.\n\n## Icônes et ressources externes\n\nLa plupart des contrôles utilisent `react-icons` et Iconify plutôt que des rasters locaux. Inclusive Sans est chargée depuis Google Fonts au chargement CSS. Si la police réseau manque, les polices sans système prennent le relais. Les images coalition/utilisateur sont des URL distantes renvoyées par API et passent par le composant Image avec fallback.\n\n## Limites des assets\n\nAucun manifeste ne déclare licence, attribution, dimensions, optimisation, variantes responsive, préchargement, politique de cache, variantes sombre/claire ou texte d'accessibilité pour cet ensemble. Les noms raster et textes boutique codés en dur sont orientés prototype. L'inventaire Client généré liste chaque chemin exact afin qu'aucun ajout/retrait n'échappe à la couverture documentaire.\n","search":"doc client fr client interface assets fixtures md assets et fixtures le depot contient 29 assets dont 17 sous assets shop leur presence ne signifie pas que chacun est importe les cartes boutique utilisent des chaines litterales src assets hypotheses de chemin developpement plutot que des import assets et fixtures assets visuels groupe fichiers usage courant marque auth 42logo svg logo png assets logoisland oauth et identite application coalitions analysts svg artisans svg technicians svg header de scores fixes accueil images generiques dance gif default jpeg hero png bus magique png t8 rock 3 png fallback image demonstrations visuels guilde scaffold react svg vite svg residu template developpement boutique attaques bomba boumboum fiouu firee watteeerr cartes boutique statiques boutique capture battery light karttt table vroum cartes boutique statiques boutique boss electric chuchu fire chuchu fire lick golem capitaine like miaou minitracien cartes boutique statiques ou stock inutilise le depot contient 29 assets dont 17 sous assets shop leur presence ne signifie pas que chacun est importe les cartes boutique utilisent des chaines litterales src assets hypotheses de chemin developpement plutot que des imports modules vite verifies fixtures json le dossier dummy contient des exemples pour root login callback utilisateur existant nouveau authorization totp detail classement utilisateur liste detail classement epreuves coalition liste detail classement squad detail recherche guilde liste detail machine reglages et echange websocket exist md decrit le jeu de fixtures aucun import typescript tsx de production depuis dummy n a ete trouve les services courants appellent api interpretation des fixtures les fixtures documentent des formes de reponse prevues et aident le developpement visuel mais peuvent etre obsoletes en particulier donnees d epreuves coalition echange websocket machine et contenu guilde enrichi apparaissent dans fixtures ou types alors que le frontend actif n a pas d integration live correspondante le contrat backend derive des sources et les appels de services courants priment sur les champs fixture icones et ressources externes la plupart des controles utilisent react icons et iconify plutot que des rasters locaux inclusive sans est chargee depuis google fonts au chargement css si la police reseau manque les polices sans systeme prennent le relais les images coalition utilisateur sont des url distantes renvoyees par api et passent par le composant image avec fallback limites des assets aucun manifeste ne declare licence attribution dimensions optimisation variantes responsive prechargement politique de cache variantes sombre claire ou texte d accessibilite pour cet ensemble les noms raster et textes boutique codes en dur sont orientes prototype l inventaire client genere liste chaque chemin exact afin qu aucun ajout retrait n echappe a la couverture documentaire"},{"id":"doc-client-fr-client-interface-components","surface":"client","language":"FR","relative":"client/interface-components.md","path":"doc/Client/FR/client/interface-components.md","title":"Composants UI","summary":"`UserHeader` et `MenuBar` relient les pages aux contextes layout. Le contenu header/menu est installé dans des effets et retiré au démontage. `MenuBar` possède son état replié/déplié par installation. Il expose huit IDs numériques de page ;","headings":[{"depth":1,"text":"Composants UI"},{"depth":2,"text":"Primitives réutilisables"},{"depth":2,"text":"Adaptateurs header et menu"},{"depth":2,"text":"Fenêtres flottantes"},{"depth":2,"text":"Limites d'interaction des fenêtres"},{"depth":2,"text":"Composants locaux aux features"}],"markdown":"# Composants UI\n\n## Primitives réutilisables\n\n| Composant | Comportement | Limites |\n| --- | --- | --- |\n| `Button` | Navigation routeur optionnelle ; styles default/menu | Ne transmet pas les props bouton normales ni type |\n| `Image` | Image native avec fallback unique vers `dance.gif` | L'absence d'alt est permise par les usages |\n| `Inputs` | Input natif ou sélecteur date-heure | Déclare select/textarea/file mais rend toujours input sauf date |\n| `LogoIsland` | Présentation du logo application | Affichage seulement |\n| `Polygon` | Wrapper/présentation polygone CSS | Affichage seulement |\n| `RelativeTime` | Formate une distance de date avec date-fns | Aucun ticking live établi |\n| `RequireAuth` | Attend auth et redirige vers `/login` | Ne conserve pas la destination |\n| `ScrollToHash` | Scroll doux vers la cible hash décodée après navigation | Cible absente ignorée silencieusement |\n| `Separator` | Séparateur horizontal de section nommé | Sémantique visuelle seulement |\n| `Title`, `TitleBadge` | Titre de page centré et badge | Position absolue pouvant concurrencer le responsive |\n| `Tooltip` | Texte tronqué avec révélation au survol | Survol seul ; aucun contrat focus/ARIA tooltip |\n| `ui` | Chaînes de classes Tailwind partagées area/group/card | Convention de style, pas composant |\n\n## Adaptateurs header et menu\n\n`UserHeader` et `MenuBar` relient les pages aux contextes layout. Le contenu header/menu est installé dans des effets et retiré au démontage. `MenuBar` possède son état replié/déplié par installation. Il expose huit IDs numériques de page ; la valeur 2 est inutilisée. Le survol déplie les labels et les items naviguent via Button.\n\n## Fenêtres flottantes\n\n`WindowProvider` stocke les fenêtres par ID chaîne. Ouvrir un ID existant remplace contenu/options, le restaure et augmente son z-index. Par défaut, une fenêtre centrée occupe deux tiers du viewport. Elles peuvent être absolues ou fixes, fermables, déplaçables, fermables au clic extérieur et minimisées. `WindowManager` rend les non minimisées et autorise Échap seulement sur la fenêtre fermable au premier plan.\n\nLe drag utilise des listeners globaux mousemove/mouseup et commit la position au relâchement. Le focus remonte les fenêtres normales ; les notifications utilisent le z-index fixe 1 000 000. Les notifications sont des fenêtres fixes spécialisées colorées info/success/warning/error, par défaut 320×96 en haut à droite. Elles ne disparaissent pas automatiquement, ne sont ni mises en file, ni persistées, ni annoncées via live region par défaut.\n\n## Limites d'interaction des fenêtres\n\nLe conteneur n'a ni rôle dialog, ni sémantique modale, ni focus trap, focus initial/retour, arrière-plan inert, resize, bornage viewport, déplacement clavier ou drag tactile/pointer. La fermeture extérieure est évaluée au mouseup. L'état minimized existe dans les données mais aucune action minimize n'est exposée. Les IDs de notification identiques remplacent au lieu d'empiler.\n\n## Composants locaux aux features\n\nLes pages définissent leurs cartes, headers, statistiques, éditeurs membres, formulaires événement, contrôles réglage et dialogues squad au lieu d'exporter une bibliothèque feature partagée. Ces composants locaux héritent du statut de la page : un dialogue soigné peut rester placeholder si son handler de validation n'appelle aucun service.\n","search":"doc client fr client interface components md composants ui userheader et menubar relient les pages aux contextes layout le contenu header menu est installe dans des effets et retire au demontage menubar possede son etat replie deplie par installation il expose huit ids numeriques de page composants ui primitives reutilisables composant comportement limites button navigation routeur optionnelle styles default menu ne transmet pas les props bouton normales ni type image image native avec fallback unique vers dance gif l absence d alt est permise par les usages inputs input natif ou selecteur date heure declare select textarea file mais rend toujours input sauf date logoisland presentation du logo application affichage seulement polygon wrapper presentation polygone css affichage seulement relativetime formate une distance de date avec date fns aucun ticking live etabli requireauth attend auth et redirige vers login ne conserve pas la destination scrolltohash scroll doux vers la cible hash decodee apres navigation cible absente ignoree silencieusement separator separateur horizontal de section nomme semantique visuelle seulement title titlebadge titre de page centre et badge position absolue pouvant concurrencer le responsive tooltip texte tronque avec revelation au survol survol seul aucu gue soigne peut rester placeholder si son handler de validation n appelle aucun service"},{"id":"doc-client-fr-client-interface-pages","surface":"client","language":"FR","relative":"client/interface-pages.md","path":"doc/Client/FR/client/interface-pages.md","title":"Pages web","summary":"La page login alterne connexion et création de compte. La création vérifie l'égalité des mots de passe avant appel backend. Les réponses email produisent soit un flux de liaison 42, soit une étape TOTP. OAuth ouvre une redirection pleine pa","headings":[{"depth":1,"text":"Pages web"},{"depth":2,"text":"Statut page par page"},{"depth":2,"text":"Détails d'authentification"},{"depth":2,"text":"Accueil, profil, boutique et jeux"},{"depth":2,"text":"Pages coalition"},{"depth":2,"text":"Code de pages historique et inaccessible"}],"markdown":"# Pages web\n\n## Statut page par page\n\n| Route | Interface visible | Données et actions | Statut |\n| --- | --- | --- | --- |\n| `/login` | Formulaires connexion/création email, bouton 42, étape TOTP/QR | Services auth live ; valide confirmation et six chiffres | Supporté |\n| `/auth/callback` | Échange/chargement/erreur, bouton 42, étape TOTP/QR | Échange code et TOTP live ; redirige accueil | Supporté |\n| `/` | Header scores coalitions, menu 2D/3D, hotbar cinq icônes extensible | Tous les scores sont fixes ; icônes gameplay sans action | Visuel seulement |\n| `/profils` | Header nom, six cartes trophées, cartes wallet, huit logs | Contenu entièrement codé en dur ; boutons agrandir inactifs | Visuel seulement |\n| `/settings` | Menu latéral catégories, contrôles, barre de changements sticky | Réglages serveur et effets locaux live | Supporté |\n| `/shop` | Trois rayons horizontaux et dix-huit cartes objet | Noms/prix fixes ; boutons panier sans handler | Visuel seulement |\n| `/games` | Menu extensible autonome dans un conteneur court | Aucun contenu ou action de jeu | Visuel seulement |\n| `/coalitions/` | Cartes coalition ordonnées avec image et statistiques | Liste live plus ordre des identifiants classés | Partiel |\n| `/coalitions/:id` | Header coalition, podium/liste épreuves, logs colorés | Résumé live ; épreuves vides et logs codés en dur | Partiel |\n| `*` | Illustration introuvable et bouton Retour | Appelle `history.back()` du navigateur | Supporté |\n| `/admin/*` | Layout normal puis introuvable | Aucun composant d'administration | Prévu |\n| `/dev/` | Démonstrations fenêtres/notifications/inputs/réglages | Laboratoire local de composants développeur | Développement seulement |\n\n## Détails d'authentification\n\nLa page login alterne connexion et création de compte. La création vérifie l'égalité des mots de passe avant appel backend. Les réponses email produisent soit un flux de liaison 42, soit une étape TOTP. OAuth ouvre une redirection pleine page. Login et callback affichent le QR d'enrôlement seulement s'il est fourni, limitent l'entrée à six chiffres, désactivent la vérification pendant saisie incomplète/chargement et présentent les erreurs avec sémantique alert. L'ancienne page OAuth seule `pages/Logins/Login.tsx` n'est pas routée.\n\n## Accueil, profil, boutique et jeux\n\nLe header accueil affiche toujours Analysts 1500 en hausse, Artisans 7000 en baisse et Technicians 30000 stable. Le switch 2D/3D change seulement icône/état ; aucun canvas ou carte n'est rendu. La hotbar alterne cinq icônes (clé, commit, fermer, plume, balle), mais seul Fermer la replie. Profil n'appelle ni service utilisateur ni succès. Boutique référence des chemins d'assets statiques comme chaînes plutôt que des URL de modules importés et affiche le prix fixe `12 000$`. Jeux instancie seulement `MenuBar` et n'installe pas les contextes header/menu de page.\n\n## Pages coalition\n\nLe classement charge simultanément identifiants classés et objets coalition, les joint côté client et omet silencieusement les IDs inconnus. Il ne présente ni chargement, ni vide, ni promesse rejetée. Le détail redirige coalition invalide/absente vers `/not-found`, qui n'est pas explicitement routé et atteint donc le wildcard. Le service fournit toujours `trials: []` ; podium et autre liste ne reçoivent donc aucune donnée d'épreuve live. `CoalitionLogs` rend des exemples warning/error/default fixes sans lien avec `/history`.\n\n## Code de pages historique et inaccessible\n\n`pages/Guild.tsx` est une ancienne composition guilde statique non importée par le routeur ; l'implémentation active est `pages/Guild/Guild.tsx`. La page OAuth seule `pages/Logins/Login.tsx` est également inutilisée. Leur présence relève de l'inventaire source, pas d'une seconde route supportée.\n","search":"doc client fr client interface pages md pages web la page login alterne connexion et creation de compte la creation verifie l egalite des mots de passe avant appel backend les reponses email produisent soit un flux de liaison 42 soit une etape totp oauth ouvre une redirection pleine pa pages web statut page par page route interface visible donnees et actions statut login formulaires connexion creation email bouton 42 etape totp qr services auth live valide confirmation et six chiffres supporte auth callback echange chargement erreur bouton 42 etape totp qr echange code et totp live redirige accueil supporte header scores coalitions menu 2d 3d hotbar cinq icones extensible tous les scores sont fixes icones gameplay sans action visuel seulement profils header nom six cartes trophees cartes wallet huit logs contenu entierement code en dur boutons agrandir inactifs visuel seulement settings menu lateral categories controles barre de changements sticky reglages serveur et effets locaux live supporte shop trois rayons horizontaux et dix huit cartes objet noms prix fixes boutons panier sans handler visuel seulement games menu extensible autonome dans un conteneur court aucun contenu ou action de jeu visuel seulement coalitions cartes coalition ordonnees avec image et statistiques liste live plus ordre des identifiants classes partie des exemples warning error default fixes sans lien avec history code de pages historique et inaccessible pages guild tsx est une ancienne composition guilde statique non importee par le routeur l implementation active est pages guild guild tsx la page oauth seule pages logins login tsx est egalement inutilisee leur presence releve de l inventaire source pas d une seconde route supportee"},{"id":"doc-client-fr-client-interface-shell","surface":"client","language":"FR","relative":"client/interface-shell.md","path":"doc/Client/FR/client/interface-shell.md","title":"Coque de l'application web","summary":"`main.tsx` importe le CSS global, applique l'apparence en cache avant le rendu React et monte `App` dans `React.StrictMode`. `App` rend le routeur. Le layout principal possède les contextes header et menu, puis imbrique `AuthProvider`, `Set","headings":[{"depth":1,"text":"Coque de l'application web"},{"depth":2,"text":"Ordre de bootstrap"},{"depth":2,"text":"Layout persistant"},{"depth":2,"text":"Menu de navigation"},{"depth":2,"text":"Providers et propriété des états"},{"depth":2,"text":"Style et comportement responsive"},{"depth":2,"text":"Limites de la coque"}],"markdown":"# Coque de l'application web\n\n## Ordre de bootstrap\n\n`main.tsx` importe le CSS global, applique l'apparence en cache avant le rendu React et monte `App` dans `React.StrictMode`. `App` rend le routeur. Le layout principal possède les contextes header et menu, puis imbrique `AuthProvider`, `SettingsProvider`, `WindowProvider`, le scroll par hash, la page routée et le renderer global de fenêtres. L'authentification est donc résolue avant le chargement des réglages, et les réglages avant l'usage des fenêtres de page.\n\n## Layout persistant\n\n`AppLayout` rend l'îlot logo à gauche, un header fourni par la page au centre et un menu extensible fourni par la page à droite. Les pages appellent `setPageHeader` et `setPageMenu` ; chaque helper installe son contenu dans un effet et l'efface au démontage. Le contenu principal utilise des marges responsive. Un footer rend les labels de breakpoint (`XS` à `2XL`) deux fois, dont une copie fixe ; ce diagnostic de développement est visible dans la coque normale.\n\n## Menu de navigation\n\nLe menu réutilisable démarre replié. Son ouverture affiche profil, réglages, boutique, jeux, guildes, coalitions et squads ; la section courante est remplacée par Accueil. Chaque icône est un bouton de navigation routeur avec label révélé au survol. L'accueil ne réutilise pas ce menu : il définit un switch 2D/3D séparé et un menu plus court profil/réglages/boutique/jeux.\n\n## Providers et propriété des états\n\n| Provider/contexte | État possédé |\n| --- | --- |\n| Contexte header | Nœud de header de la page courante |\n| Contexte menu | Nœud de menu de la page courante |\n| Contexte auth | Session utilisateur, chargement, restauration, déconnexion, rafraîchissement |\n| Contexte réglages | Snapshot serveur, brouillon, clés modifiées, état sauvegarde/conflit/erreur |\n| Contexte fenêtres | Fenêtres flottantes, ordre de focus, positions, notifications |\n\nLes états providers résident en mémoire sauf jeton d'accès et cache d'apparence. La navigation démonte les pages mais les providers restent dans le layout. Les pages publiques login/callback sont aussi dans les providers ; `/dev/` est hors layout et providers.\n\n## Style et comportement responsive\n\nTailwind fournit les utilitaires de layout et tokens personnalisés pour surfaces sombres page/UI, bleu 42 et trois couleurs coalition. Inclusive Sans est chargée depuis Google Fonts. La taille de police racine suit `--interface-scale` ; les thèmes light/system remplacent les couleurs page/UI ; la réduction de mouvement écrase les durées d'animation et transition. La feuille contient aussi un second bloc de tokens root historique, donc variables de thème Tailwind et variables CSS génériques coexistent.\n\n## Limites de la coque\n\nIl n'existe ni error boundary de route, ni suspense boundary, ni gestionnaire global d'erreur API, ni état offline, ni provider de localisation, ni politique de restauration du focus. Les helpers header/menu utilisent volontairement des hooks malgré leurs noms impératifs et dépendent d'un ordre de rendu stable. La navigation est orientée survol, le système de fenêtres est orienté souris, et la coque n'a aucun contrat établi de drawer mobile ou drag tactile.\n","search":"doc client fr client interface shell md coque de l application web main tsx importe le css global applique l apparence en cache avant le rendu react et monte app dans react strictmode app rend le routeur le layout principal possede les contextes header et menu puis imbrique authprovider set coque de l application web ordre de bootstrap main tsx importe le css global applique l apparence en cache avant le rendu react et monte app dans react strictmode app rend le routeur le layout principal possede les contextes header et menu puis imbrique authprovider settingsprovider windowprovider le scroll par hash la page routee et le renderer global de fenetres l authentification est donc resolue avant le chargement des reglages et les reglages avant l usage des fenetres de page layout persistant applayout rend l ilot logo a gauche un header fourni par la page au centre et un menu extensible fourni par la page a droite les pages appellent setpageheader et setpagemenu chaque helper installe son contenu dans un effet et l efface au demontage le contenu principal utilise des marges responsive un footer rend les labels de breakpoint xs a 2xl deux fois dont une copie fixe ce diagnostic de developpement est visible dans la coque normale menu de navigation le menu reutilisable demarre replie son ouverture affiche profil reglages boutique jeux guildes coalitions et squads la section courante est remplacee par accueil chaque icone est un bouton de navigation routeur avec label revele au survol l accueil ne reutilise pas ce menu il definit un switch 2d 3d separe et un menu plus
