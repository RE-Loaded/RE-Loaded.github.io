gn assets the current compose files determine deployment topology"},{"id":"doc-infra-en-infra-operations","surface":"infra","language":"EN","relative":"infra/operations.md","path":"doc/Infra/EN/infra/operations.md","title":"Stack operations","summary":"Infra owns `service/` Dockerfiles, `tool/` entrypoints/helpers, `config/` runtime inputs and `secret/` ignored environment files/templates. Client and System must be siblings; current Client includes its Design copies as ordinary files. Use","headings":[{"depth":1,"text":"Stack operations"},{"depth":2,"text":"Layout and prerequisites"},{"depth":2,"text":"Services and networks"},{"depth":2,"text":"OAuth and demonstration"},{"depth":2,"text":"Development and production"},{"depth":2,"text":"Useful commands"}],"markdown":"# Stack operations\n\n## Layout and prerequisites\n\nInfra owns `service/` Dockerfiles, `tool/` entrypoints/helpers, `config/` runtime inputs and `secret/` ignored environment files/templates. Client and System must be siblings; current Client includes its Design copies as ordinary files. Use Docker Engine, Compose and Make. The production overlay uses `!reset`/`!override`; use a Compose version supporting those tags (the source README asks for 2.24 or later). No Docker deployment was run for this update.\n\n```sh\nmake -C Infra clone\nmake -C Infra\nmake -C Infra ports\nmake -C Infra smoke\n```\n\nRun from the parent workspace. `clone` fetches missing dependencies and needs access to private Design. The first startup creates `.env` files with private permissions, random database password and JWT_SECRET. Client uses the configured `JWT_SECRET` as its shared signing key; a normal backend restart does not generate another key.\n\n## Services and networks\n\n| Service | Internal endpoint | Host exposure |\n| --- | --- | --- |\n| nginx | HTTPS 443, HTTP 80 redirect | `HTTPS_PORT` / `HTTP_PORT` |\n| frontend | 5173 | Via nginx only |\n| backend | 8000 | `/api/` and `/api/ws` via nginx |\n| db | PostgreSQL 5432 | None |\n| system | Game 58100, health 58105 | Development loopback debug allocation; none in production |\n\nThe default network connects nginx/frontend; internal `api` connects nginx/backend; `data` connects backend/db/System. `DATA_SUBNET` and `BACKEND_DATA_ADDRESS` give the backend a stable address trusted by System for forwarded client IPs. Move both if the subnet conflicts. Uvicorn trusts proxy headers, so this separation is part of the address-trust contract.\n\nSystem's Compose fallback debug range and the committed `.env.example` both use `58100-58110`. Inspect `SYSTEM_HOST_PORT` and `make ports`; a wider range may collide with the native Control tests on ports 58111–58114. Do not assume one fixed host port.\n\n## OAuth and demonstration\n\nRegister browser redirect `/auth/callback` and System linking redirect `/api/system/auth/callback` on the configured HTTPS origin. Client uses `API_42_CLIENT_ID` / `API_42_CLIENT_SECRET`; System credentials use `RELOADED_CLIENT_ID` / `RELOADED_CLIENT_SECRET` folded into its runtime config. `PUBLIC_ORIGIN` is derived from hostname/HTTPS port unless URLs are explicitly overridden. A System session requires its own authorization-code exchange.\n\nWithout real credentials, email accounts can read as spectators. `make demo` seeds coalitions; `make demo-link EMAIL=…` assigns coalition, points, wallet, login and a synthetic intra ID to an existing email account. A synthetic identity does not create the real System session required by forwarded game writes. For an isolated local demonstration, explicitly set `DEV_MODE=true` and `SYSTEM_MODE=off` before starting the backend. `mirror` is an enforcement alias; `SYSTEM_ENABLED=false` alone does not authorize local-only play. Re-running demo-link assigns the configured balances again; it is not a non-destructive balance check.\n\n## Development and production\n\nDevelopment bind-mounts sources, reloads Uvicorn, serves Vite and polls watchers. Production uses image-baked backend code with one worker, built frontend on nginx, read-only roots plus explicit volumes/tmpfs, no System host port, and hides API docs at the reverse proxy. Switching variants preserves volumes when using `make down` then the other startup target. `make fclean` deletes volumes/images after confirmation; it is not a restart.\n\n## Useful commands\n\n`make logs`, `ps`, `ports`, `doctor`, `system-map` and `system-logs` provide diagnostics; `make test` runs current backend tests inside the running container; `make alembic-check` checks migration/model state. Team TODOs in the submission README remain unresolved facts.\n\nSources: `Infra/Makefile`, `docker-compose.yml`, `docker-compose.prod.yml`, `secret/Client/.env.example`, `tool/System/`, `tool/Client/back/demo_provisionning.py`, `tool/Infra/smoke.sh`.\n","diagrams":[],"search":"doc infra en infra operations md stack operations infra owns service dockerfiles tool entrypoints helpers config runtime inputs and secret ignored environment files templates client and system must be siblings current client includes its design copies as ordinary files use stack operations layout and prerequisites infra owns service dockerfiles tool entrypoints helpers config runtime inputs and secret ignored environment files templates client and system must be siblings current client includes its design copies as ordinary files use docker engine compose and make the production overlay uses reset override use a compose version supporting those tags the source readme asks for 2 24 or later no docker deployment was run for this update sh make c infra clone make c infra make c infra ports make c infra smoke run from the parent workspace clone fetches missing dependencies and needs access to private design the first startup creates env files with private permissions random database password and jwt secret client uses the configured jwt secret as its shared signing key a normal backend restart does not generate another key services and networks service tion maintenance","summary":"`make docs` builds without starting a server or copying Pages. `make` additionally starts the local documentation server; `make web` serves existing output. `make pages` explicitly copies generated portals into the Pages checkout; it does n","headings":[{"depth":1,"text":"Qualification and documentation maintenance"},{"depth":2,"text":"Separate kinds of evidence"},{"depth":2,"text":"Commands from Doc"},{"depth":2,"text":"Updated checks"},{"depth":2,"text":"Refresh procedure"}],"markdown":"# Qualification and documentation maintenance\n\n## Separate kinds of evidence\n\n| Check | What it establishes | What it does not establish |\n| --- | --- | --- |\n| Source/manifest review | Routes, models, configuration and declared behavior | Runtime success |\n| Documentation build and structural checks | Paired languages, links, embedded content and generated declarations | Application security or release acceptance |\n| Backend/frontend/native tests | Cases executed against the named source/environment | Every user journey |\n| Infra smoke | Reachability/wiring of an already-running stack | Full gameplay correctness |\n| Submission compliance | Mechanical README/schema rules | Team facts or subject acceptance |\n\n## Commands from Doc\n\n```sh\nmake docs\nmake test\nmake reference-test\n```\n\n`make docs` builds without starting a server or copying Pages. `make` additionally starts the local documentation server; `make web` serves existing output. `make pages` explicitly copies generated portals into the Pages checkout; it does not publish a commit. Generated Markdown stays under ignored `.generated/`; generated HTML is ignored.\n\n## Updated checks\n\nThe local change to `Control/tests/Doc/test-portals.mjs` replaces obsolete absence assertions with positive WebSocket/gameplay and HTTP history/achievements checks. It is needed alongside Doc at Control `faad31b`. `make test` also runs `scripts/check-infra-docs.mjs` for Infra pairs/navigation and `scripts/check-doc-fixes.mjs` for embedded diagrams and submission links. Results belong to the exact working trees recorded in `Doc/AUDIT-FIXES-2026-10-18.md`.\n\nControl's Client target declares a Client-Test path but actually executes the backend selected by Infra Compose. Verify service mounts before attributing its results. `system-secu` is a separate target. Submission `TODO(team)` markers are deliberately retained until the team provides those facts.\n\n## Refresh procedure\n\nRecord local HEADs and dirty state; read implementation before copying repository README claims; update both languages; rebuild references; check links/structure and embedded source freshness; inspect the portal; record exact results and residual failures. Preserve historical board/log entries and distinguish imported reports from reruns. The repository snapshot for this update is `doc/Infra/review-followup-2026-10-18.json`.\n","diagrams":[],"search":"doc infra en infra validation md qualification and documentation maintenance make docs builds without starting a server or copying pages make additionally starts the local documentation server make web serves existing output make pages explicitly copies generated portals into the pages checkout it does n qualification and documentation maintenance separate kinds of evidence check what it establishes what it does not establish source manifest review routes models configuration and declared behavior runtime success documentation build and structural checks paired languages links embedded content and generated declarations application security or release acceptance backend frontend native tests cases executed against the named source environment every user journey infra smoke reachability wiring of an already running stack full gameplay correctness submission compliance mechanical readme schema rules team facts or subject acceptance commands from doc sh make docs make test make reference test make docs builds without starting a server or copying pages make additionally starts the local documentation server make web serves existing output make pages explicitly copies generated portals into the pages checkout it does not publish a commit generated markdown stays under ignored generated generated html is ignored updated checks the local change to control tests doc test portals mjs replaces obsolete absence assertions with positive websocket gameplay and http history achievements checks it is needed alongside doc at control faad31b make test also runs scripts check infra docs mjs for infra pairs navigation and scripts check doc fixes mjs for embedded diagrams and submission links results belong to the exact working trees recorded in doc audit fixes 2026 10 18 md control s client target declares a client test path but actually executes the backend selected by infra compose verify service mounts before attributing its results system secu is a separate target submission todo team markers are deliberately retained until the team provides those facts refresh procedure record local heads and dirty state read implementation before copying repository readme claims update both languages rebuild references check links structure and embedded source freshness inspect the portal record exact results and residual failures preserve historical board log entries and distinguish imported reports from reruns the repository snapshot for this update is doc infra review followup 2026 10 18 json"},{"id":"doc-infra-fr-readme","surface":"infra","language":"FR","relative":"README.md","path":"doc/Infra/FR/README.md","title":"Infrastructure et carte des dépôts","summary":"Cette section documente les dépôts locaux inspectés au 2026-10-18, avec Infra à `dd5e0fb3915faf63069b8651c26c24c30cef4efe`. Commandes et déclarations sources ont été vérifiées localement ; déploiement et exécution des tests applicatifs cons","headings":[{"depth":1,"text":"Infrastructure et carte des dépôts"}],"markdown":"# Infrastructure et carte des dépôts\n\nCette section documente les dépôts locaux inspectés au 2026-10-18, avec Infra à `dd5e0fb3915faf63069b8651c26c24c30cef4efe`. Commandes et déclarations sources ont été vérifiées localement ; déploiement et exécution des tests applicatifs constituent des preuves séparées.\n\n- [Responsabilités et révisions des dépôts](infra/repositories.md)\n- [Lancement et configuration de la stack](infra/operations.md)\n- [Qualification et maintenance documentaire](infra/validation.md)\n\nLes anciens diagrammes `doc/Infra/schemes` sont des assets historiques de conception. Les fichiers Compose actuels déterminent la topologie de déploiement.\n","diagrams":[],"search":"doc infra fr readme md infrastructure et carte des depots cette section documente les depots locaux inspectes au 2026 10 18 avec infra a dd5e0fb3915faf63069b8651c26c24c30cef4efe commandes et declarations sources ont ete verifiees localement deploiement et execution des tests applicatifs cons infrastructure et carte des depots cette section documente les depots locaux inspectes au 2026 10 18 avec infra a dd5e0fb3915faf63069b8651c26c24c30cef4efe commandes et declarations sources ont ete verifiees localement deploiement et execution des tests applicatifs constituent des preuves separees responsabilites et revisions des depots infra repositories md lancement et configuration de la stack infra operations md qualification et maintenance documentaire infra validation md les anciens diagrammes doc infra schemes sont des assets historiques de conception les fichiers compose actuels determinent la topologie de deploiement"},{"id":"doc-infra-fr-infra-operations","surface":"infra","language":"FR","relative":"infra/operations.md","path":"doc/Infra/FR/infra/operations.md","title":"Exploitation de la stack","summary":"Infra possède Dockerfiles `service/`, entrypoints/helpers `tool/`, entrées d’exécution `config/` et fichiers d’environnement ignorés/modèles `secret/`. Client et System doivent être voisins ; Client inclut maintenant ses copies Design comme","headings":[{"depth":1,"text":"Exploitation de la stack"},{"depth":2,"text":"Organisation et prérequis"},{"depth":2,"text":"Services et réseaux"},{"depth":2,"text":"OAuth et démonstration"},{"depth":2,"text":"Développement et production"},{"depth":2,"text":"Commandes utiles"}],"markdown":"# Exploitation de la stack\n\n## Organisation et prérequis\n\nInfra possède Dockerfiles `service/`, entrypoints/helpers `tool/`, entrées d’exécution `config/` et fichiers d’environnement ignorés/modèles `secret/`. Client et System doivent être voisins ; Client inclut maintenant ses copies Design comme fichiers ordinaires. Utiliser Docker Engine, Compose et Make. La variante de production utilise `!reset`/`!override` ; choisir une version Compose qui les supporte (le README source demande 2.24 ou plus). Aucun déploiement Docker n’a été exécuté pour cette mise à jour.\n\n```sh\nmake -C Infra clone\nmake -C Infra\nmake -C Infra ports\nmake -C Infra smoke\n```\n\nLancer depuis l’espace parent. `clone` récupère les dépendances manquantes et exige accès au Design privé. Le premier démarrage crée les `.env` avec permissions privées, mot de passe de base et JWT_SECRET aléatoires. Client utilise `JWT_SECRET` comme clé de signature partagée ; un redémarrage ordinaire du backend ne génère pas une autre clé.\n\n## Services et réseaux\n\n| Service | Endpoint interne | Exposition hôte |\n| --- | --- | --- |\n| nginx | HTTPS 443, redirection HTTP 80 | `HTTPS_PORT` / `HTTP_PORT` |\n| frontend | 5173 | Via nginx seulement |\n| backend | 8000 | `/api/` et `/api/ws` via nginx |\n| db | PostgreSQL 5432 | Aucune |\n| system | Jeu 58100, santé 58105 | Allocation debug loopback en développement ; aucune en production |\n\nLe réseau par défaut relie nginx/frontend ; `api`, interne, relie nginx/backend ; `data` relie backend/db/System. `DATA_SUBNET` et `BACKEND_DATA_ADDRESS` donnent au backend une adresse stable de confiance pour transmettre les IP clients à System. Modifier les deux en cas de conflit de sous-réseau. Uvicorn accepte les en-têtes proxy : cette séparation fait partie du contrat de confiance d’adresse.\n\nLe repli Compose du port debug System et le `.env.example` versionné utilisent tous deux `58100-58110`. Vérifier `SYSTEM_HOST_PORT` et `make ports` ; une plage plus large peut entrer en conflit avec les tests natifs Control sur 58111–58114. Ne pas supposer un port hôte fixe.\n\n## OAuth et démonstration\n\nEnregistrer la redirection navigateur `/auth/callback` et celle de liaison System `/api/system/auth/callback` sur l’origine HTTPS configurée. Client utilise `API_42_CLIENT_ID` / `API_42_CLIENT_SECRET` ; les identifiants System utilisent `RELOADED_CLIENT_ID` / `RELOADED_CLIENT_SECRET`, injectés dans sa configuration d’exécution. `PUBLIC_ORIGIN` dérive du nom d’hôte/port HTTPS sauf URL surchargée explicitement. Une session System exige son propre échange de code d’autorisation.\n\nSans vrais identifiants, les comptes email lisent en spectateurs. `make demo` peuple les coalitions ; `make demo-link EMAIL=…` attribue coalition, points, portefeuille, login et intra ID synthétique à un compte email existant. Une identité synthétique ne crée pas la vraie session System requise pour transférer les écritures de jeu. Pour une démonstration locale isolée, définir explicitement `DEV_MODE=true` et `SYSTEM_MODE=off` avant le démarrage du backend. `mirror` est un alias du mode de contrôle ; `SYSTEM_ENABLED=false` seul n’autorise pas le jeu local. Relancer demo-link réaffecte les soldes configurés ; ce n’est pas un contrôle de solde sans modification.\n\n## Développement et production\n\nLe développement monte les sources, recharge Uvicorn, sert Vite et utilise la surveillance par polling. La production utilise le backend intégré à l’image avec un worker, le frontend compilé servi par nginx, des racines en lecture seule avec volumes/tmpfs explicites, aucun port System hôte et masque les docs API au proxy. Changer de variante conserve les volumes avec `make down` puis l’autre cible de démarrage. `make fclean` supprime volumes/images après confirmation ; ce n’est pas un redémarrage.\n\n## Commandes utiles\n\n`make logs`, `ps`, `ports`, `doctor`, `system-map` et `system-logs` donnent les diagnostics ; `make test` lance les tests backend actuels dans le conteneur démarré ; `make alembic-check` contrôle migrations/modèles. Les TODO d’équipe du README de rendu restent des faits non résolus.\n\nSources : `Infra/Makefile`, `docker-compose.yml`, `docker-compose.prod.yml`, `secret/Client/.env.example`, `tool/System/`, `tool/Client/back/demo_provisionning.py`, `tool/Infra/smoke.sh`.\n","diagrams":[],"search":"doc infra fr infra operations md exploitation de la stack infra possede dockerfiles service entrypoints helpers tool entrees d execution config et fichiers d environnement ignores modeles secret client et system doivent etre voisins client inclut maintenant ses copies design comme exploitation de la stack organisation et prerequis infra possede dockerfiles service entrypoints helpers tool entrees d execution config et fichiers d environnement ignores modeles secret client et system doivent etre voisins client inclut maintenant ses copies design comme fichiers ordinaires utiliser docker engine compose et make la variante de production utilise reset override choisir une version compose qui les supporte le readme source demande 2 24 ou plus aucun deploiement docker n a ete execute pour cette mise a jour sh make c infra clone make c infra make c infra ports make c infra smoke lancer depuis l espace parent clone recupere les dependances manquantes et exige acces au design prive le premier demarrage cree les env avec permissions privees mot de passe de base et jwt secret aleatoires client utilise jwt secret comme cle de signature partagee un redemarrage ordinaire du backend ne genere pas une autre cle services et reseaux service endpoint interne exposition hote nginx https 443 redirection http 80 https port http port frontend AD inspecté | Responsabilité |\n| --- | --- | --- |\n| `Client` | `4428cd3d422680ec4de2284166aa668981a7e99d` | Application FastAPI/React, règles PostgreSQL, temps réel navigateur et tests locaux |\n| `System` | `81fe049ae7f08d323e2119896422222dc6b5e27a` | Moteur C11, protocole JSON brut/TCP, SQLite et règles moteur |\n| `Infra` | `dd5e0fb3915faf63069b8651c26c24c30cef4efe` | Compose, images, nginx, configuration/préparation et smoke |\n| `Control` | `faad31bff465e0efccd1a5e52df4e525f38afffb` | Suites externes et contrôles documentaires/conformité ; cibles effectives à vérifier |\n| `Doc` | `0bb6696092ef5a4a1bc04ec69a76641d9f131783` | Branche main ; première revue commitée, corrections de suivi dans le working tree |\n| `Design` | `e710dd139d770c5da5794a0f15c07a75293c4af5` | Identité visuelle, images et textes légaux ; copies consommatrices potentiellement différentes |\n| `Tool` | `4c3551ba3aee5d2eb4db415a69444558c6792c0f` | Configuration Git/hooks/import/compose/agregate et exemple de service |\n| `RE-Loaded.github.io` | `80a3a5a32980bb6b5572d91ee7f36c310a1024d5` | Dépôt séparé recevant les portails générés ; publication par une opération ultérieure |\n| `.github` | `11398ecc2399cce6ae82fd401a373f5c2405070d` | Profil d’organisation et matériel partagé |\n\n## Relations actives\n\nInfra construit Client/System depuis les voisins. Client suit désormais les fichiers Design ordinaires dans `front/src/design` et `back/design` ; Doc épingle toujours Design dans `vendor/Design`. Doc lit les headers System et déclarations Client pour ses références générées. `make docs` ne copie pas vers Pages ; `make pages` copie explicitement sans stage/commit/push.\n\nLes deux copies Design de Client ont l’arbre Git `ca5270ab2ba4200edea4f1a1e044d750cde9afc3`. `vendor/Design` de Doc reste au commit `ad60df294a81a6f8875723044ce40d0818b13011` ; le portail privilégie ce logo épinglé. Ces identifiants ne désignent pas le HEAD Design voisin.\n\n## Outils et archives\n\nTool contient des commandes Git à effets réels : `compose` utilise GitHub et fusionne des PR ; `agregate` synchronise les modules dans leurs worktrees puis peut stage/commit/push. Ce ne sont pas des prérequis de lecture ou de construction documentaire. Aucun de ces workflows n’a été exécuté ici.\n\nClient-Link est un dossier historique sans `.git` local, décrivant notamment l’ancien branchement des API. Ses commandes, résultats datés et références de branche ne décrivent pas nécessairement Client actuel. Board/log et schémas anciens sont conservés comme historique.\n\n## Sources\n\nInventaires Git locaux ; Makefiles Client/System/Infra/Control/Doc ; fichiers `.gitmodules` ; `Tool/git/action/{compose,agregate,update}`, `Tool/git/setup.sh`, `Tool/config/git.conf` ; `Client-Link/README.md` ; `.github/profile/README.md`. Les détails de validation de cette mise à jour sont consignés dans `Doc/AUDIT-FIXES-2026-10-18.md`.\n","diagrams":[],"search":"doc infra fr infra repositories md depots responsabilites et provenance inventaire local de suivi du 2026 10 18 ces sha identifient les checkouts consultes doc etait propre a 0bb6696 control contenait deja des changements dans tests system test inventory c conserves separement de la correction du contr depots responsabilites et provenance inventaire local de suivi du 2026 10 18 ces sha identifient les checkouts consultes doc etait propre a 0bb6696 control contenait deja des changements dans tests system test inventory c conserves separement de la correction du controleur doc les changements initiaux de ds store sont sans rapport client test est desormais absent les anciens instantanes conservent leurs noms d origine depot head inspecte responsabilite client 4428cd3d422680ec4de2284166aa668981a7e99d application fastapi react regles postgresql temps reel navigateur et tests locaux system 81fe049ae7f08d323e2119896422222dc6b5e27a moteur c11 protocole json brut tcp sqlite et regles moteur infra dd5e0fb3915faf63069b8651c26c24c30cef4efe compose images nginx co ties existantes. `make pages` copie explicitement les portails vers le checkout Pages ; il ne publie pas de commit. Le Markdown généré reste sous `.generated/` ignoré ; le HTML généré est ignoré.\n\n## Contrôles actualisés\n\nLa correction locale de `Control/tests/Doc/test-portals.mjs` remplace les anciennes assertions d’absence par des contrôles positifs WebSocket/jeu et HTTP historique/succès. Elle doit accompagner Doc avec Control `faad31b`. `make test` exécute aussi `scripts/check-infra-docs.mjs` pour les paires/navigation Infra et `scripts/check-doc-fixes.mjs` pour les schémas intégrés et liens du rendu. Les résultats portent sur les working trees consignés dans `Doc/AUDIT-FIXES-2026-10-18.md`.\n\nLa cible Client de Control déclare un chemin Client-Test mais exécute le backend choisi par Compose Infra. Vérifier les montages avant d’attribuer ses résultats. `system-secu` est séparée. Les marqueurs de rendu `TODO(team)` sont volontairement conservés jusqu’à obtention de ces faits auprès de l’équipe.\n\n## Procédure d’actualisation\n\nConsigner HEAD et état local ; lire l’implémentation avant de reprendre les README des dépôts ; actualiser les deux langues ; reconstruire les références ; vérifier liens/structure et fraîcheur des sources embarquées ; inspecter le portail ; consigner résultats exacts et échecs résiduels. Préserver board/log historiques et distinguer rapports importés et réexécutions. Le snapshot des dépôts de cette mise à jour est `doc/Infra/review-followup-2026-10-18.json`.\n","diagrams":[],"search":"doc infra fr infra validation md qualification et maintenance documentaire make docs construit sans demarrer le serveur ni copier vers pages make demarre aussi le serveur documentaire local make web sert les sorties existantes make pages copie explicitement les portails vers le checkout pages il ne p qualification et maintenance documentaire niveaux de preuve separes controle ce qu il etablit ce qu il n etablit pas revue des sources manifests routes mo storiques et distinguer rapports importes et reexecutions le snapshot des depots de cette mise a jour est doc infra review followup 2026 10 18 json"}]</script><script>(function clientApp() {
  const docs = JSON.parse(document.getElementById("portal-data").textContent);
  const scope = document.documentElement.dataset.scope;
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* file:// may deny storage */ } },
  };
  const state = { language: storage.get("reloaded-doc-language") || "EN", surface: scope === "global" ? "all" : scope, query: [], active: null };
  const labels = {
    EN: { search: "Search documentation", contents: "On this page", empty: "No document matches this filter.", all: "All", system: "System", client: "Client", infra: "Infra", board: "Board", log: "Logs", shared: "Shared", globalTitle: "Global portal", systemTitle: "System docs", clientTitle: "Client docs", infraTitle: "Infrastructure docs", boardTitle: "Board", logTitle: "Logs" },
    FR: { search: "Rechercher dans la documentation", contents: "Dans cette page", empty: "Aucun document ne correspond à ce filtre.", all: "Tout", system: "System", client: "Client", infra: "Infra", board: "Board", log: "Journaux", shared: "Commun", globalTitle: "Portail global", systemTitle: "Documentation System", clientTitle: "Documentation Client", infraTitle: "Documentation infrastructure", boardTitle: "Board", logTitle: "Journaux" },
  };
  const byId = new Map(docs.map((doc) => [doc.id, doc]));
  const nav = document.getElementById("doc-nav");
  const article = document.getElementById("article");
  const toc = document.getElementById("toc-links");
  const search = document.getElementById("search-input");
  const languageButton = document.getElementById("language-button");

  function escape(value) {
    return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
  }

  function slug(value) {
    return value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function normalizeSearch(value) {
    return value.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function matchesAll(value) {
    const normalized = normalizeSearch(value);
    return state.query.every((token) => matchesToken(normalized, token));
  }

  function matchesToken(normalized, token) {
    if (normalized.includes(token)) return true;
    return token.length > 3 && (token.endsWith("s") || token.endsWith("x")) && normalized.includes(token.slice(0, -1));
  }

  function inline(value) {
    let output = escape(value);
    output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
    output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    output = output.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
    output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return output;
  }

  function renderMarkdown(markdown, diagrams = []) {
    let diagramIndex = 0;
    const lines = markdown.replace(/\r/g, "").split("\n");
    let html = "";
    let paragraph = [];
    let list = null;
    const flushParagraph = () => {
      if (paragraph.length) html += `<p>${inline(paragraph.join(" "))}</p>`;
      paragraph = [];
    };
    const closeList = () => {
      if (list) html += `</${list}>`;
      list = null;
    };
    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];
      if (/^```/.test(line)) {
        flushParagraph(); closeList();
        const language = line.slice(3).trim();
        const code = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        const codeHtml = `<pre><code data-language="${escape(language)}">${escape(code.join("\n"))}</code></pre>`;
        if (language === "mermaid") {
          const diagram = diagrams[diagramIndex++];
          const fr = state.language === "FR";
          html += `<figure class="diagram" data-focus-x="${diagram.focus?.x ?? 0}" data-focus-y="${diagram.focus?.y ?? 0}"><figcaption>${fr ? "Schéma relationnel — agrandir pour lire les champs" : "Entity relationships — enlarge to read the fields"}</figcaption><div class="diagram-tools"><button type="button" data-diagram-zoom aria-pressed="false">${fr ? "Taille réelle / ajustée" : "Actual size / fit"}</button><a href="${diagram.image}" download="diagram-${diagram.hash.slice(0, 12)}.svg">${fr ? "Télécharger le SVG" : "Download SVG"}</a></div><div class="diagram-canvas" tabindex="0" role="region" aria-label="${fr ? "Schéma relationnel défilable" : "Scrollable entity relationship diagram"}"><img src="${diagram.image}" alt="${fr ? "Relations et champs des tables PostgreSQL" : "PostgreSQL table fields and relationships"}"></div><details><summary>${fr ? "Source Mermaid" : "Mermaid source"}</summary>${codeHtml}</details></figure>`;
        } else html += codeHtml;
        continue;
      }
      const heading = /^(#{1,6})\s+(.+)$/.exec(line);
      if (heading) {
        flushParagraph(); closeList();
        const level = heading[1].length;
        const text = heading[2].replace(/\s+#+$/, "");
        html += `<h${level} id="${slug(text)}">${inline(text)}</h${level}>`;
        continue;
      }
      if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
        flushParagraph(); closeList();
        const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
        const headers = cells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
        i -= 1;
        html += `<div class="table-wrap"><table><thead><tr>${headers.map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }
      const item = /^(\s*)([-*+] |\d+\. )(.*)$/.exec(line);
      if (item) {
        flushParagraph();
        const wanted = /\d/.test(item[2]) ? "ol" : "ul";
        if (list !== wanted) { closeList(); list = wanted; html += `<${list}>`; }
        const depth = Math.min(4, Math.floor(item[1].replace(/\t/g, "    ").length / 2));
        html += `<li class="depth-${depth}">${inline(item[3])}</li>`;
        continue;
      }
      if (/^>\s?/.test(line)) {
        flushParagraph(); closeList(); html += `<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`; continue;
      }
      if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
        flushParagraph(); closeList(); html += "<hr>"; continue;
      }
      if (!line.trim()) { flushParagraph(); closeList(); continue; }
      paragraph.push(line.trim());
    }
    flushParagraph(); closeList();
    return html;
  }

  function visibleDocs() {
    return docs.filter((doc) => {
      const languageOk = doc.language === "ALL" || doc.language === state.language;
      const surfaceOk = state.surface === "all" || doc.surface === state.surface;
      const queryOk = !state.query.length || state.query.every((token) => matchesToken(doc.search, token));
      return languageOk && surfaceOk && queryOk;
    });
  }

  function surfaceLabel(surface) {
    return labels[state.language][surface] || surface;
  }

  function renderNav() {
    const visible = visibleDocs();
    nav.innerHTML = "";
    let group = "";
    for (const doc of visible) {
      const nextGroup = `${surfaceLabel(doc.surface)} · ${doc.relative.includes("/") ? doc.relative.split("/")[0] : "index"}`;
      if (nextGroup !== group) {
        group = nextGroup;
        const label = document.createElement("div"); label.className = "nav-group"; label.textContent = group; nav.append(label);
      }
      const button = document.createElement("button");
      button.className = `doc-button${doc.id === state.active ? " active" : ""}`;
      button.innerHTML = `<strong>${escape(doc.title)}</strong><small>${escape(doc.relative)}</small>`;
      button.addEventListener("click", () => openDoc(doc.id));
      nav.append(button);
      if (state.query.length) {
        for (const heading of doc.headings.filter((item) => matchesAll(item.text)).slice(0, 8)) {
          const hit = document.createElement("button");
          hit.className = "search-hit";
          hit.textContent = `↳ ${heading.text}`;
          hit.addEventListener("click", () => openDocAtHeading(doc.id, heading.text));
          nav.append(hit);
        }
      }
    }
    if (!visible.length) {
      nav.innerHTML = `<p class="empty">${labels[state.language].empty}</p>`;
      article.innerHTML = `<div class="empty-state"><h1>${labels[state.language].empty}</h1></div>`;
      toc.innerHTML = "";
      return;
    }
    if (!visible.some((doc) => doc.id === state.active)) openDoc(visible[0].id, false);
  }

  function openDoc(id, rerenderNav = true) {
    const doc = byId.get(id);
    if (!doc) return;
    state.active = id;
    location.hash = id;
    article.innerHTML = `<header class="doc-header"><span>${surfaceLabel(doc.surface)} · ${doc.language === "ALL" ? labels[state.language].shared : doc.language}</span><h1>${escape(doc.title)}</h1><p>${escape(doc.summary)}</p><code>${escape(doc.path)}</code></header><div class="markdown">${renderMarkdown(doc.markdown, doc.diagrams)}</div>`;
    toc.innerHTML = doc.headings.filter((heading) => heading.depth > 1).map((heading) => `<a class="toc-${heading.depth}" href="#${slug(heading.text)}">${escape(heading.text)}</a>`).join("");
    document.getElementById("toc-title").textContent = labels[state.language].contents;
    if (rerenderNav) renderNav();
    article.scrollTop = 0;
  }

  function openDocAtHeading(id, heading) {
    openDoc(id);
    requestAnimationFrame(() => article.querySelector(`#${CSS.escape(slug(heading))}`)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  }

  function resolveMarkdownLink(href) {
    const active = byId.get(state.active);
    if (!active || !href.split("#")[0].endsWith(".md")) return null;
    const clean = href.split("#")[0];
    const stack = active.path.split("/"); stack.pop();
    for (const part of clean.split("/")) {
      if (part === "..") stack.pop(); else if (part !== ".") stack.push(part);
    }
    return docs.find((doc) => doc.path === stack.join("/")) || null;
  }

  article.addEventListener("click", (event) => {
    const zoom = event.target.closest("[data-diagram-zoom]");
    if (zoom) {
      const figure = zoom.closest("figure");
      const enlarged = figure.classList.toggle("diagram-enlarged");
      zoom.setAttribute("aria-pressed", String(enlarged));
      const canvas = figure.querySelector(".diagram-canvas");
      canvas.scrollLeft = enlarged ? Number(figure.dataset.focusX) - canvas.clientWidth / 2 : 0;
      canvas.scrollTop = enlarged ? Number(figure.dataset.focusY) - canvas.clientHeight / 2 : 0;
      return;
    }
    const anchor = event.target.closest("a");
    if (!anchor) return;
    const href = anchor.getAttribute("href") || "";
    const linked = resolveMarkdownLink(href);
    if (linked) { event.preventDefault(); openDoc(linked.id); return; }
    if (href.startsWith("#")) {
      event.preventDefault(); article.querySelector(href)?.scrollIntoView({ behavior: "smooth" });
    }
  });

  document.querySelectorAll("[data-surface]").forEach((button) => button.addEventListener("click", () => {
    state.surface = button.dataset.surface;
    document.querySelectorAll("[data-surface]").forEach((item) => item.classList.toggle("active", item === button));
    renderNav();
  }));
  search.addEventListener("input", () => {
    state.query = normalizeSearch(search.value).split(" ").filter(Boolean);
    renderNav();
  });
  languageButton.addEventListener("click", () => {
    const current = byId.get(state.active);
    state.language = state.language === "EN" ? "FR" : "EN";
    storage.set("reloaded-doc-language", state.language);
    if (current?.language !== "ALL") {
      const translated = docs.find((doc) => doc.surface === current.surface && doc.language === state.language && doc.relative === current.relative);
      if (translated) state.active = translated.id;
    }
    updateLanguageUi();
    renderNav();
    if (state.active) openDoc(state.active, false);
  });
  document.getElementById("theme-button").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next; storage.set("reloaded-doc-theme", next);
  });
  document.documentElement.dataset.theme = storage.get("reloaded-doc-theme") || "dark";
  function updateLanguageUi() {
    const copy = labels[state.language];
    languageButton.textContent = state.language === "EN" ? "FR" : "EN";
    languageButton.title = state.language === "EN" ? "Afficher en français" : "Show in English";
    search.placeholder = copy.search;
    document.getElementById("surface-title").textContent = copy[`${scope}Title`];
    document.querySelectorAll("[data-surface]").forEach((button) => {
      button.textContent = copy[button.dataset.surface];
    });
  }
  updateLanguageUi();
  const hashDoc = byId.get(location.hash.slice(1));
  if (hashDoc) state.active = hashDoc.id;
  document.querySelector(`[data-surface="${state.surface}"]`)?.classList.add("active");
  renderNav();
})();</script>
